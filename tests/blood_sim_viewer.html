<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>BloodFlow Simulation</title>
<style>
:root { --bg: #f4f1ec; --fg: #222; --muted: #666; --accent: #8a1c14; --panel: #fff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161414; --fg: #eee; --muted: #aaa; --accent: #e0574b; --panel: #222; } }
:root[data-theme="dark"] { --bg: #161414; --fg: #eee; --muted: #aaa; --accent: #e0574b; --panel: #222; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, sans-serif; }
main { max-width: 1300px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 12px; }
img { width: 100%; display: block; border-radius: 6px; background: #000; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; }
button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
label { display: flex; gap: 6px; align-items: center; color: var(--muted); }
#time { font-variant-numeric: tabular-nums; min-width: 70px; }
</style></head>
<body><main>
<h1>BloodFlow simulation: desert ground</h1>
<p>The real BloodFlow shader on gentle Mojave-like slopes (3-15 degrees), 0 to 20 seconds after the hits. Splats on slopes over
about 5 degrees should run downhill; pools sit under bodies. Debug view: streams red, puddles yellow, edge drops blue.</p>
<div class="bar">
  <button id="play">Play</button>
  <input id="slider" type="range" min="0" max="40" value="0">
  <span id="time">0.0 s</span>
  <label><input id="debug" type="checkbox"> debug view</label>
  <label><input id="close" type="checkbox" checked> close up</label>
</div>
<img id="frame" src="terrain_000.png" alt="BloodFlow simulation frame">
</main>
<script>
const img = document.getElementById('frame'), slider = document.getElementById('slider'), time = document.getElementById('time');
const debug = document.getElementById('debug'), play = document.getElementById('play'), close = document.getElementById('close');
let timer = null;
function show() {
  const f = String(slider.value).padStart(3, '0');
  img.src = (close.checked ? 'terrain_close_' : debug.checked ? 'terrain_debug_' : 'terrain_') + f + '.png';
  time.textContent = (slider.value * 0.5).toFixed(1) + ' s';
}
slider.oninput = show; debug.onchange = () => { if (debug.checked) close.checked = false; show(); };
close.onchange = () => { if (close.checked) debug.checked = false; show(); };
show();
play.onclick = () => {
  if (timer) { clearInterval(timer); timer = null; play.textContent = 'Play'; return; }
  play.textContent = 'Pause';
  timer = setInterval(() => { slider.value = (+slider.value + 1) % 41; show(); }, 250);
};
</script>
</body></html>
