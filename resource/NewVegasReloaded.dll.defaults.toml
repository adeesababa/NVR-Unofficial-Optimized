[_Shaders.ShadowsExteriors.ScreenSpace]
BlurRadius = 1.0                     # Blur strength for denoising screenspace shadows. Keep low, otherwise a lot of pixelation will occur.
Enabled = true                       # Wether to render screen space contact/detail shadows
RenderDistance = 180000              # Max distance at which to compute screen space shadows
Intensity = 0.315                    # Rescale the intensity of screenspace shadows, to combat jitter and blur making them very faint even at maximum brightness.
NearFade = 400.0                     # UNOFFICIAL (2026-10-27), applies immediately: contact shadows fade in with distance from the camera, none nearer than half of this, full from this (game units, 70 = 1 m). Up close the sharp sun shadows already show the real shapes, and the contact shadows drew low-poly noses, brows and collars as hard triangles on characters (the 'facets', worst with Sharp). 0 = everywhere, as before.
Sharp = false                        # UNOFFICIAL: sharper, steadier contact shadows for less: the ray toward the sun followed in 16 even steps instead of 4 random ones smoothed by two big blurs (about a third of the cost). With forward shadows (the default). BlurRadius is not used with it on.
FastPaths = true                     # UNOFFICIAL (2026-10-17): the same contact shadows for less GPU time: the march's early exits (too far, surface turned away from the sun) really skip work (the shader compiler had turned them into work every pixel did). Off = the original pass. Applies immediately

[_Shaders.ShadowsExteriors.ShadowMaps]
CascadeResolution = 1				 # Resolution used for shadow cascades. 0: 1024, 1: 1536, 2: 2048, 3: 2560, 4: 3072, 5: 3584, 6: 4096 (UNOFFICIAL; 6 needs about 256 MB of video memory with PCF shadows, Max Quality uses it).
                                     # 3: 2560, 4: 3072, 5: 3584. The atlas holds 2x2 cascades, so
                                     # VRAM and shadow-pass bandwidth scale with the square of this:
                                     # 3 is ~2.6x the cost of 2, and 5 is ~5x. Clamped down if it
                                     # exceeds the device's maximum texture size.
Mipmaps = false						 # DISABLED. Enable mipmaps for the shadow maps.
Anisotropy = 0						 # DISABLED. Anisotropic filteric for mipmaps, 0: disabled, 1: 8x, 2: 16x
Distance = 6000                      # Distance to render shadows for. The unit is the same as the game uses for i.e. fog values. 
CascadeLambda = 0.9					 # [0.0-1.0] Controls how cascades are split, higher value means nearer cascades get higher resolution.
HandoverBlend = 70                   # UNOFFICIAL (2026-10-21), live, every Quality: how far inside each sun shadow cascade's edge the hand-over to the next (coarser) cascade is blended, in world units (70 is about 1 m). Fixes shadows on your character popping as the third-person camera zooms in and out (the hair's shadow on the brow appearing and vanishing at one distance), worst with a high CascadeLambda, where the old blend was a few centimetres wide: now both cascades read the same spot across the band, so only their mix changes. Never wider than the cascade, never narrower than the old tenth of it. 0 = the old blend (the outer tenth of each cascade).
PlayerInNear = 0                     # UNOFFICIAL (2026-10-23), live: in third person, keep your character's head in the sharpest sun shadow cascade while the camera is within this distance of it, in world units (420 is about 6 m; 70 = 1 m). Fixes the hair's, nose's and brow's shadows on your face showing only once the camera zooms in close (about 1.5-2 m): further out the head was in the next, coarser cascade, which blurs shadows that thin away. The sharp cascade grows to reach the head, so its shadows get a little softer everywhere while the camera is far back. 0 = off (as before).
PlayerInNearLog = false              # UNOFFICIAL (2026-10-23), diagnostic: with PlayerInNear, log the camera-to-head distance and the sharp cascade's size once a second.
CharacterShadowMap = true            # UNOFFICIAL (2026-10-23), ON by default since P82 v4, needs a restart to switch on or off (live after that): a small extra sun shadow map of your own character alone, fitted round the head and upper body (1-3 mm texels instead of the 4-10 mm of the sun cascades), read by the skin and clothing shaders where your character is on screen. Keeps the hair's, nose's and hat brim's shadows on the face sharp and steady at any third-person zoom. The sun cascades are drawn exactly as before (your shadow on the ground, and the world's shadows on you, stay theirs); this map only adds back the fine self-shadow they blur away. Third person only. Costs one small shadow map per frame (measured about 0.04 ms to draw; F10 profile: "Character shadow map").
CharacterShadowMapResolution = 1024  # UNOFFICIAL (2026-10-23), live: the map's size in texels (256-4096, rounded to 256). 1024 = about 1.4 mm texels round the head; 2048 = half that, four times the memory (16 MB) and fill.
CharacterShadowMapFit = 0            # UNOFFICIAL (2026-10-23), live: what the map is fitted round. 0 = the head and upper body (the Spine2 bone to the head bone, plus the margin): the sharpest. 1 = the whole character (its bound sphere): the arms' and weapon's shadows on the body too, about twice the texel size.
CharacterShadowMapMargin = 24        # UNOFFICIAL (2026-10-23), live: world units added round the fit (70 = 1 m), for hat brims, hair and shoulders; the sun is at an angle, so the box needs room on every side. Larger = coarser texels.
CharacterShadowMapBlend = 12         # UNOFFICIAL (2026-10-23), live: world units inside the map's edge over which it hands over to the sun cascades, so the border never shows as a line.
CharacterShadowMapBias = 0.15        # UNOFFICIAL (2026-10-23), live: constant depth bias of the lookup, world units (0.15 = 2 mm). Raise it if the skin shows fine stripes or speckles (acne) with the map on; lower it if shadows detach from what casts them.
CharacterShadowMapOthers = false     # UNOFFICIAL (2026-10-23), live: other characters standing inside the map's box are drawn into it too, so their shadow on you is as sharp as your own. A little CPU per frame (the loaded cells' references are scanned for them).
CharacterShadowMapLog = false        # UNOFFICIAL (2026-10-23), diagnostic: log the fit, texel size and caster count once a second.
CharacterShadowMapDebug = 0          # UNOFFICIAL (2026-10-24), diagnostic view, live: inside the map's box the sun shadow is replaced by 1 = the map's own verdict alone (white lit, black shadowed), 2 = the depth the map holds there (black = the map is empty or not bound, white = nothing drawn there, gray = a caster), 3 = the point's own depth in the box. 0 = off.
SmoothFilter = false					 # UNOFFICIAL (2026-10-15), PCF shadows (Mode 3): a smoother, slightly wider filter on the sun shadow maps (a 4 x 4 cubic B-spline instead of 3 x 3). Rounds off the stair steps that show where one shadow-map texel covers several pixels: shadows on your character in third person, a low sun across steep surfaces. Costs a little (16 compares per lookup instead of 9).
LimitFrequency = true				 # Limit the update frequency of the furthest cascade (once per four frames).
CasterFadeMin = 0.75                 # UNOFFICIAL (2026-10-28) [0-1], live: things the game is fading (in or out with distance) cast their sun shadow only from this much of their fade on. 0.75 = as before. Found with CasterView: distant trees' leaves sit at fade 0 while drawn on screen, so they never cast, and their shadow snaps on as you come nearer. 0 = they always cast (more shadow-map draws in tree-heavy places).
LodSkipLoaded = true				 # Distant-object LOD inside the loaded cells casts no shadow: the full objects there already do. Removes doubled shadows and ghost shadows of swapped or removed objects, and saves drawing them twice. false: the old behaviour.

[_Shaders.ShadowsExteriors.Ortho]
Resolution = 2						 # Resolution of the texture used to store the ortho map. 0: 128, 1: 256, 2: 512, 3: 1024, 4: 2048
Distance = 3000                      # Distance to render ortho for. The unit is the same as the game uses for i.e. fog values.
LimitFrequency = true				 # Limit the update frequency of the ortho map (one per four frames).
ProbeDump = 0                        # UNOFFICIAL, development builds only: a new non-zero value writes one dump of the ortho map with the object that drew each texel (for diagnosis; does nothing in release builds).

[_Shaders.ShadowsExteriors.TerrainShadows]
Enabled = false                      # UNOFFICIAL (2026-10-19) Mountain shadows: hills and mountains shade the land and everything on it far past the sun-shadow maps (about 85 m), so at sunrise and sunset ranges cast long shadows across the valleys. Only the sunlight is taken away: shaded land keeps its sky and ambient light. Reads the land's heights from your plugins in load order (about a second, on a spare core, when you enter a worldspace), or an xLODGen height map if you made one (UseHeightMapFile). Worked out on a spare CPU core when the sun moves; about 0.1 ms a frame on the GPU. Ported from Conor's (mrfury97) NVR fork, after Community Shaders' Terrain Shadows (both GPL-3.0).
MaxResolution = 1                    # [0-2] (2026-10-19) The land's height map is shrunk to at most 0: 1024, 1: 2048, 2: 4096 texels on its longer side (applied on the next worldspace change or a moment after you change it). Larger: sharper shadow edges, more video memory (16 MB at 2048) and CPU per update.
Bias = 64.0                          # [0-4096] (2026-10-19) Shadow heights are lowered by this many units, so slopes do not shadow themselves. Higher: fewer, deeper shadows only; lower: more shadow on gentle slopes.
Softness = 1.0                       # [0.1-10] (2026-10-19) Degrees either side of the sun's height over which the shadow's edge fades.
Strength = 1.0                       # [0-1] (2026-10-19) How much of the sun the land's shadow takes.
Darkness = 0.0                       # [0-0.95] (2026-10-19) How much of the sky and ambient light the land's shadow also takes. 0: only the sun (physically right: a valley still sees the sky); higher: darker, more contrasted shadows (Conor's fork uses 0.5).
Contrast = 1.5                       # [0.5-8] (2026-10-19) Sharpens the shadow's edge: 1 as worked out, higher a harder line between lit and shaded land.
UseHeightMapFile = true              # (2026-10-19) Use an xLODGen height map when one is installed (FNVLODGen: Terrain LOD > Height maps, in Data\Textures\Terrain\<Worldspace>\), otherwise the land read from your plugins. Both give the same shape; the file skips the one-second read.
DebugView = 0                        # (2026-10-19) 1: the land's shadow tinted green (and the clouds' blue) over the picture. 2: also tints the area the height map covers.

[_Shaders.CloudShadows.Main]
Enabled = false                      # UNOFFICIAL (2026-10-19) Cloud shadows: the game's own cloud layers cast moving shadows on the land, dimming only the sunlight (shade keeps its sky light). Cheap (a few texture reads per pixel); no volumetric clouds needed. Not the same as the volumetric clouds' shadows (Volumetric Clouds, Shadows): while those are on, they are used and this switch does nothing. In the menu: under Shadows Exteriors. After Community Shaders' Cloud Shadows (GPL-3.0); this build's own version for DirectX 9.
Strength = 0.6                       # [0-1] (2026-10-19) How much of the sun a fully clouded patch of sky takes.
Density = 3.0                        # [0-8] (2026-10-19) How solid the clouds count: their pictures' cover times this. Thin, wispy cloud pictures need more to cast a visible shadow (faint, wispy clear-sky clouds still cast little shade at 3).
Height = 140000.0                    # [1000-1000000] (2026-10-19) How high above you the clouds' shadows are cast from, in game units (140000 = about 2 km, as Community Shaders). Higher: the shadows move further from the clouds' spot overhead as the sun gets low.
TileSize = 400000.0                  # [1000-10000000] (2026-10-19) How much land one cloud picture covers, in game units. Smaller: smaller, more frequent cloud shadows.
Speed = 1.0                          # [0-20] (2026-10-19) How fast the cloud shadows drift with the weather's wind (the higher cloud layers faster).
DebugView = 0                        # (2026-10-19) 1: the clouds' shadow tinted blue (and the land's green) over the picture. 3 (2026-10-23): also the water's depth as WaterShadows reads it, white at the shore to red deep. 4 (2026-10-25, test): as a full cloud over the whole sky (Strength 1): the sunlit ground should come out as dark as the tree and object shadows on it, never darker.
WaterShadows = false                 # UNOFFICIAL (2026-10-23), live: cloud (and mountain) shadows also fall on water, by its depth: shallow water, where you see the ground through it, keeps nearly all of the shadow and deep water a small share (WaterDeepShare). Off: water takes no shadow at all, so a cloud's shadow on the sand ends in a hard line at the waterline. Uses the game's own water depth map; costs next to nothing.
WaterDeepShare = 0.2                 # [0-1] (2026-10-23) With WaterShadows on: how much of the shadow deep water keeps (its look is mostly the sky's reflection). 0: none, 1: as much as the land.
TargetFix = false                    # UNOFFICIAL BUG FIX candidate (2026-10-22): before the mountain/cloud shadow pass draws, its own picture is taken off every texture slot it was left on (the sun-shadow composite leaves it there) and the pass draws full screen whatever the game left set. Aimed at the DXVK-only report of the ground going darker on single frames under clouds. Off = as before.
HazardLog = 0                        # Test only (2026-10-22): 1 = the log says which texture slots still hold that pass's picture while it draws, and its draw states.
FlickerWatch = 0                     # Test only (2026-10-23): 1 = outdoors, every frame the finished picture is measured (shrunk, read back two frames later) and a frame whose lower half suddenly gets lighter or darker while the sky stays the same is written to the log ('FLICKER' lines) with how that frame drew the shadows. Costs a little GPU time; leave 0.
FlickerThreshold = 0.06              # [0.01-0.5] Test only (2026-10-23): with FlickerWatch, how big a jump (0.06 = 6%) is logged.
OldSunModel = false                  # Test only (2026-10-25): true = the cloud and mountain shadows as before that day's fix, when they took the ground's sunlight for more than it was (the land is lit by a lower sun than the rest, and the game's fog was darkened too): a tree's shadow under a cloud's shadow then came out lighter than the clouded ground round it. Leave false.

[_Shaders.SunFar.Status]
Enabled = true                       # (2026-10-19) The pass that draws the mountain and cloud shadows above. It only runs while one of them is on.

[_Shaders.ShadowsExteriors.Status]
Enabled = true                       # Post process sun and pointlights shadows in exteriors.

[_Shaders.ShadowsInteriors.Main]
UseCastShadowFlag = false            # Objects without the cast shadow flag will not be rendered to the shadow maps
Activators = true                    # Wether to include objects with "Activator" flag when rendering shadowmaps.
Actors = true                        # Wether to include objects with "Actors" flag when rendering shadowmaps.
AlphaEnabled = true                  # Wether to take into account alpha of objects when rendering shadowmaps.
Apparatus = true                     # Wether to include objects with "Apparatus" flag when rendering shadowmaps.
Books = true                         # Wether to include objects with "Books" flag when rendering shadowmaps.
Containers = true                    # Wether to include objects with "Containers" flag when rendering shadowmaps.
Darkness = 0.65                      # Darkness of shadows.
Doors = true                         # Wether to include objects with "Doors" flag when rendering shadowmaps.
Furniture = true                     # Wether to include objects with "Furniture" flag when rendering shadowmaps.
LightPoints = 24                     # How many lamps can cast shadows at once (24 = default). UNOFFICIAL: indoors with forward shadows ([Shaders.ShadowsInteriors.Forward] Enabled) up to 64; each lamp past 12 needs about 6 MB of video memory at ShadowCubeMapSize 512 (12 MB with people near it, RedrawActorsOnly) and about 0.3-0.4 ms whenever its shadow is redrawn whole (lamps with nothing moving near them are drawn once; with RedrawActorsOnly, lamps with people near them redraw only the people). Outdoors, and indoors without forward shadows, at most 12.
ExteriorLightPoints = 12             # UNOFFICIAL (2026-10-13) [0-44]: OUTDOORS, how many lamps cast shadows (needs [Shaders.ShadowsExteriors.Main] UsePointShadowsDay/Night on). 12 = as before. Above 12 the shadow pass is drawn in batches of 11 lamps (about 0.3 ms each at 1440p) and each lamp needs a shadow cube map (about 6 MB at ShadowCubeMapSize 512, plus its drawing whenever things near it move).
LightRadiusMult = 1.5                # A muliplier for the lights radius to render shadows for.
MinRadius = 10.0                     # Wether to include objects with a radius of less than x pixels on the screen in the shadowmaps.
Misc = true                          # Wether to include objects with misc flags when rendering shadowmaps.
NearFade = 0.0                       # UNOFFICIAL [0-128]: things within this many world units of a lamp (about 70 to a metre) cast less of a shadow from it, none at the lamp itself. Standing right at a lamp made your shadow fill the room, sharp and black, sometimes on several walls at once. A real lamp's shadow from that close is too blurred to see. 0 = as before.
EdgeFade = 0.0                       # UNOFFICIAL [0-0.9], OFF (0 = exactly as before): fades each lamp's lit disc, and the shadows in it, out over this fraction of its radius instead of ending on the hard circle where a bright lamp's clamped light amount drops. 0.4 was tried on 2026-10-07 and darkened the ring round every lamp (with forward shadows on this mask is the room darkening), so it is off; see LampReachMask for the cure. Applies immediately.
MaskSkipFar = true                   # UNOFFICIAL (2026-10-16): the lamp mask skips each lamp's maths where the lamp cannot reach (exactly the same picture; cheaper). Applies immediately
ContactShadows = 0.0                 # UNOFFICIAL (2026-10-16) [0-1]: contact shadows from lamps indoors -- the small dark lines where a prop meets the floor or a table meets the wall, which the lamps' shadow maps are too coarse to show (NVR had them for the sun only). Strength; 0 off. Applies immediately
ContactLength = 40.0                 # [4-200] How far toward the lamp the contact shadow looks, in world units (about 70 to a metre)
ContactThickness = 12.0              # [1-100] How thick a surface is taken to be: thinner things in front do not cast a contact shadow
ContactDistance = 3000.0             # [200-20000] Contact shadows fade out by this distance from the camera
LampReachMask = false                # UNOFFICIAL, CHANGES THE IMAGE indoors (2026-10-07): the darkening pass faded each lamp out with its own falloff on top of the game's lamp lighting, which already fades, so the floor past a certain distance was darkened twice and a shadow on it seemed to stop at a circle. On: a lamp counts in full out to its game radius and fades over the rest of its LightRadiusMult reach (the game's own light does the fading), so its shadows show in full; the outer part of each lamp's reach is a little brighter than before. Applies immediately. (2026-10-24: always used while the per-object lamp shadows, [Shaders.ShadowsInteriors.Forward] Enabled, are on: without it, near interior lamps every triangle of a character was darkened on its own, hard-edged; see ForwardReachMask for that mode.)
ForwardReachMask = 2                 # [0-2] UNOFFICIAL (2026-10-25), live, with or without the per-object lamp shadows ([Shaders.ShadowsInteriors.Forward] Enabled; without them too since the evening of 2026-10-25, so no setting combination brings the facets back): near interior lamps every triangle of a character (skin and clothes) was darkened on its own and showed as a hard-edged facet (the room darkening took each lamp's angle from a flat per-triangle surface direction). 2 = fixed, the room as bright as before (the lamp's distance fade kept, the angle dropped). 1 = fixed with LampReachMask's rule (rooms a little lighter: the darkening's distance fade goes too). 0 = as before (facets). LampReachMask on overrides it.
PlayerInsideLamp = true           # UNOFFICIAL, BUG FIX: a lamp whose light point sits inside your body (or within PlayerLampMargin of it) leaves you out of its shadow cube map. A point inside a model is blocked on every side, so without this the player threw room-sized shadows onto every wall when walking through a light that has no fixture. Applies immediately.
RedrawActorsOnly = true              # UNOFFICIAL: a lamp with people (or wind-blown leaves) in reach draws its walls and furniture into its shadow once and keeps them; each refresh copies that and redraws only the people on top. Off = the whole shadow is redrawn every refresh, as before. Same image either way.
PlayerLampMargin = 16.0              # [0-64] How close (world units, about 70 to a metre) a lamp may come to your character before it counts as inside.
Quality = 1                          # Not currently used.
ShadowCubeMapSize = 512              # The resolution of one face for the point light shadow cubemaps.
Statics = true                       # Wether to include objects with "Statics" flag when rendering shadowmaps.
TorchesCastShadows = true            # Used in Oblivion to enable shadows on torches.
TwoSidedCasters = false              # UNOFFICIAL (2026-10-29), live, TEST: lamp shadows drawn from both sides of every object, as the sun's are. Without it a lamp's shadow map kept the side of each object turned AWAY from the lamp, so open or thin things (cups, glasses, bowls, characters near a lamp) cast rings or shadows that trace the inside of the mesh. false = as before.
DrawDistance = 4000                  # Max distance for point light shadow rendering.
PlayerShadowThirdPerson = true       # Enable shadows for Player Model in third person in pointlights shadows
PlayerShadowFirstPerson = false      # Enable shadows for Player Model in first person in pointlights shadows

[_Shaders.ShadowsInteriors.Forward]
Enabled = true                       # UNOFFICIAL: indoor lamp shadows drawn on each object, lamp by lamp, instead of one dark mask over the finished picture: a lamp's shadow takes away only that lamp's light, so lamp glow, lit windows and the room's ambient light stay bright and two lamps on a wall each cast their own shadow. Needs a restart (the indoor shaders are compiled once, then cached).
Strength = 1.0                       # [0.0-1.0] How dark a lamp's shadow is (1 = none of its light). 0 = the old screen-space shadows again, live, to compare.
Softness = 0.4                       # [0.0-2.0] 0 = sharp shadow edges (cheapest). About 0.75 = softer edges, about 1-2 ms slower in busy rooms.
Quality = 1                          # UNOFFICIAL (2026-10-10) [0-3]: how smooth lamp shadow edges are (with Softness above 0). 0 Low = one lookup, sharp edges (cheapest, as Softness 0). 1 Medium = 4 lookups, as before. 2 High = 10, smoother edges. 3 Ultra = 20, smoothest. Applies immediately.
ContactHardening = false             # UNOFFICIAL (2026-10-10): lamp shadows sharp where an object touches what it shadows (a chair leg on the floor) and blurred by Softness further away. Indoor lamps only; the sun has its own [Shaders.ContactHardening]. Needs Quality 1 or more. Off = as before. Applies immediately.
ContactHardeningStrength = 2.0       # [0.0-8.0] How fast the shadow softens with distance from the object casting it. Higher = soft sooner.
ContactHardeningMinSoftness = 0.2    # [0.0-1.0] How sharp the edge is right at contact, as a share of Softness (0 = razor sharp).
LampSize = 0.0                       # UNOFFICIAL (2026-10-20) [0-64], a LOOK OPTION, applies immediately: lamp shadows soft by distance, as a real lamp of this radius (world units, about 70 to a metre) casts them: sharp where an object touches what it shadows, softer the further the shadow falls from the object, and blurred away where the object is right at the lamp (its own fitting, fan blades just above its globes). 4-8 = a bulb or a small shade. Softness stays the sharpest edge, MaxSoftness caps the blur; with Quality 2-3 the wide blurs are smoother. Replaces ContactHardening while above 0. 0 = off: every shadow as sharp as Softness along its whole length, as before.
MaxSoftness = 8.0                    # [1-32] The widest blur LampSize may give a lamp shadow, in shadow-map texels (at ShadowCubeMapSize 512 one texel is about 0.2 degrees seen from the lamp). Higher = softer far shadows, but with few PCF taps (Quality) a wide blur shows steps.
InvisibleLightShadowStrength = 1.0   # UNOFFICIAL (2026-10-20) [0.0-1.0], a LOOK OPTION, applies immediately: how dark the shadows of the game's INVISIBLE lights are. New Vegas lights its rooms mostly with lights that have no lamp: the level designers placed them for mood (fill, key, ambient) wherever they wanted light, often far from any lamp you see (Doc Mitchell's house: 24 of its 25 lights; the Prospector Saloon: 18 of 24). The game never gave lamps shadows, so where they stand did not matter; with shadows they throw a lamp's whole outline onto the wall behind it, fan blades onto the ceiling, and shadows from places where nothing glows. A light counts as invisible when no glowing mesh (lamp glass, bulb, glow, flame) is within FixtureDistance of it. 0 = no shadow from them (they light as before, as in the game, and leave their shadow slot to the real lamps); 1 = full shadows, as before.
LampGlassShadows = true              # UNOFFICIAL (2026-10-20), a LOOK OPTION, applies immediately: false = a lamp's glowing parts (its glass shades, bulbs, glow sprites, flames: small meshes that glow) cast no lamp shadows. They are the light itself, yet drawn as solid blockers they threw a lamp's whole shade outline onto the wall behind it (a sconce's glass tulips: a dark cone above it). Lights built into lamp models (each chandelier globe, each sconce bulb) sit right inside them. true = as before.
LampModelShadows = true              # UNOFFICIAL (2026-10-20), a LOOK OPTION, applies immediately: false = each light leaves the LAMP MODELS near it (within LampModelDistance) out of its own shadows: the whole lamp -- a sconce with its arms, a chandelier, a ceiling fan's blades, a hanging or arm lamp, a table lamp -- found by its model file's name (light, lamp, fan, chandelier, sconce, bulb, lantern, candle, torch). The level designers put the game's invisible lights right next to the lamps, and from there a lamp threw its whole outline onto the wall or ceiling, hard and room-sized (fan blades as black ovals, a sconce's brackets as a dark cone). Every other shadow -- furniture, props, walls, people -- stays, so the invisible lights can keep InvisibleLightShadowStrength 1. true = as before.
LampModelDistance = 160.0            # [0-512] How near (world units, about 70 to a metre) a lamp model's edge must be to a light for LampModelShadows to leave it out of that light's shadows. 160 covers the designers' lights in Goodsprings (10-160 units from their lamps).
LampModelOwnDistance = 24.0          # [-1-128] (with LampModelShadows false) A lamp keeps shadowing its OWN light: one built into its model, or a light built into another object (a bulb model inside a shade) within this many world units of one of the lamp's small parts, so a shade still shapes its bulb's light. The game's invisible designer lights never count, wherever they stand (one placed inside a chandelier's globes made the chandelier throw its frame across the ceiling). 0 = only lights built into the lamp's own model. Below 0: no lamp keeps shadowing any light near it (a test: shades then let light through).
NoShadowLampModels = "lantern,lamplightlamp" # UNOFFICIAL (2026-10-27), a LOOK OPTION, applies immediately: lamp models whose file name holds one of these words (comma separated, any case; "lamplightlamp" is the game's small oil lantern, LamplightLamp.NIF; e.g. add "candle") cast NO shadow for the lights inside or near them (within LampModelDistance), their own light included. A small lantern's frame and glass threw a cage of shadows round the room that moved with the flickering flame. Every other lamp keeps its shadows (LampModelShadows). Empty = as before.
InvisibleShadowFromLamp = 0.0        # UNOFFICIAL (2026-10-20) [0-1024], a LOOK OPTION, an EXPERIMENT, applies immediately: the game's invisible lights cast their shadows from the nearest VISIBLE lamp within this many world units (about 70 to a metre) instead of from where they stand. The room is still lit exactly as the level designers placed those lights; only where their shadows fall from changes, so every shadow comes from a lamp you can see. Lights with no lamp in reach cast from where they are. 0 = off (as before).
InvisibleLightSize = 0.0             # UNOFFICIAL (2026-10-20) [0-128], a LOOK OPTION, applies immediately: the lamp size (as LampSize, world units) the game's invisible lights cast their shadows with. They stand in for broad room light (the level designers' fill and key lights), so a large size suits them: their shadows stay where an object meets the floor or a wall, and blur away the further they fall from it, instead of throwing sharp outlines across the room. Lets them keep their shadows (InvisibleLightShadowStrength 1) without the hard projections. MaxSoftness caps the blur. 0 = the same size as the other lamps (LampSize).
FixtureDistance = 48.0               # [0-256] How close (world units, about 70 to a metre) a glowing mesh must be to a light for it to count as a real lamp's light (InvisibleLightShadowStrength). LogLamps writes each light's answer and distance to the log.
Bias = 0.018                         # [0.0-0.1] Keeps surfaces from shadowing themselves (speckles). Raise a little if lit walls show dark speckles.
NormalOffset = 0.0                   # [0.0-4.0] Another cure for speckles, pushing the lookup off the surface. 0 = off.
AutoNormalOffset = true              # UNOFFICIAL (2026-10-24; on by default since 2026-10-25: a tester's facets with the per-object lamp shadows on and LampReachMask on were this, and per-area setting add-ons can reset NormalOffset), live: NormalOffset is raised to the softening's reach (Softness, MagnifiedSoftness, in shadow-map texels). Without it, close to the camera a lamp's soft shadow lookup caught the surface's own depth wherever it was tilted more than about 57 degrees from the lamp, and since a character is flat per triangle, every triangle came out lit or dimmed on its own: a faceted, low-poly look on skin and clothes indoors. false = NormalOffset alone, as before.
FirstPerson = true                   # Shadows on your weapon and arms too.
KeepDarkening = true                 # Keep the old darkening of what no tracked lamp reaches (rooms keep their mood). Off = brighter unlit corners, and about 0.8 ms saved.
DarkeningBlur = false                # Blur that darkening as the old pass did (about 0.9 ms more).
MaskHalfRes = false                  # UNOFFICIAL (2026-10-16): work out the room darkening's lamp reach at half resolution (cheaper; edges of objects a little softer). Applies immediately
SmoothEdges = true                       # UNOFFICIAL (2026-10-15), needs a restart: smoother lamp shadow edges indoors. The shadow maps are read so each edge fades over one of their texels instead of stepping along them (the blocky look, worst with ContactHardening). Adds about 50 instructions to the 4-lamp object shaders (compiled in only when on). Off: the plain, blockier edges.
EvenTaps = true                       # UNOFFICIAL (2026-10-21), a LOOK OPTION, needs a restart: Quality 2 (High) and 3 (Ultra) spread their extra lookups evenly instead of on a grid (High 8 lookups instead of 10, Ultra 16 instead of 20, the same blur width). On the grid an edge got only five lookup places across it (eight of Ultra's twenty on the centre line), so wide soft lamp shadows (LampSize, MaxSoftness) showed as stacked, stepped copies of their edge. Off: the grid, exactly as before.
MagnifiedSoftness = 2.0               # UNOFFICIAL (2026-10-21) [0-8], a LOOK OPTION: where one texel of a lamp's shadow map covers many screen pixels (big shadows far from their lamp, seen close up), the shadow's edge is blurred over at least this many texels, so it stops showing the shadow map's stair-steps; everywhere else nothing changes (it ramps in between 2 and 8 pixels per texel). 2 = smooth. Turning it on from 0 needs a restart (it is compiled in only then); after that it applies immediately. 0 = off (as before).
TexelFilter = false                   # UNOFFICIAL (2026-10-21), a LOOK OPTION, needs a restart: lamp shadows filtered the way the sun's shadows are: the shadow map is read at exact texel centres round each point and blended with a smooth curve by where the point sits between them, so edges are smooth curves instead of the shadow map's stair-steps, however close you look. Wide soft shadows (LampSize) use the same filter on a coarser grid. Replaces Quality's lookups (Medium, High and Ultra filter alike; Low stays one sharp lookup), SmoothEdges, EvenTaps and MagnifiedSoftness; NearFade does not apply. Edges at the narrowest are a little softer than Ultra's (one texel at least, as the sun's). Off: as before.
LampSwitchMargin = 0.2               # [0.0-0.9] Only so many lamps can cast shadows at once (LightPoints); they are picked by distance. A lamp that already has a shadow keeps it until another is this much nearer (0.2 = 20%), and while it is a little behind you, so shadows stop popping on and off as you walk and turn. 0 = pick purely by distance, as before.
ShadowClusterEnabled = false          # UNOFFICIAL (2026-10-26): indoors, lamps closer together than ShadowClusterDistance share ONE shadow, the brightest lamp's. The others still light as before, just without their own shadow, so rooms with many bulbs stop running out of shadow slots (flicker). With LogLamps on, the log says how many lamps were merged. false = as before.
ShadowClusterDistance = 128.0        # [0-512] Units: lamps this close to a brighter lamp share its shadow (ShadowClusterEnabled).
ShadowClusterInvisibleOnly = false   # UNOFFICIAL (2026-10-29), live, with ShadowClusterEnabled: only the level designers' invisible fill lights (no glowing lamp part within FixtureDistance) give up their own shadow; lamps that are really there always keep theirs.
ShadowClusterMinLights = 0           # [0-64] UNOFFICIAL (2026-10-29), live, with ShadowClusterEnabled: a light joins a neighbour's shadow only where at least this many lights (itself included) stand within ShadowClusterDistance, so crowded spots (Vault 21: hundreds of lights) are thinned and rooms with a few lights keep every shadow. 0 = anywhere.
FadeIn = 0.0                         # [0.0-2.0] Seconds a lamp's shadow takes to fade in when the lamp gets one, instead of popping in. 0 = at once, as before.
LampRanking = 1                      # 1: lamps get shadows by how much of the scene they light (brightness x reach / distance), so a big room lamp is not pushed out by small bulbs near you as you move. 0 = the nearest lamps, as before.
KeepLampsInView = true               # UNOFFICIAL, BUG FIX (2026-10-08): the game lights each object only with the lamps it thinks are in view, and its test dropped lamps whose light was still on screen: turning the camera, their light and shadow popped off and on across whole mesh pieces (forward shadows live in each object's own lamps; the old screen-space shadows hid it). Lamps whose light reaches the view now stay. false = the game's test alone.
CameraIndependent = true             # UNOFFICIAL (2026-10-08): lamps get shadows by where you are, not where you look. A busy room has far more lamps than shadow slots (the Tops: 50-70 for 11), and picking them by the view swapped them as you turned: shadows and whole floor pieces popped at the edges of the screen. Now only walking changes them. false = the view test, as before.
FillLightRadius = 1000               # UNOFFICIAL (2026-10-08) [0-4000]: lamps that reach farther than this (game units) are a level's big fill lights, placed up near the ceiling to light a whole area; FillLightShadowStrength decides their shadows. 0 = no lamp counts as one.
FillLightShadowStrength = 0.5        # UNOFFICIAL (2026-10-08) [0.0-1.0]: how dark fill lights' shadows are. 0 = none (they light as before; at full strength a fill light's ceiling and the staircases under it blacked out whole floor pieces, and they take shadow slots from real lamps). 0.5 = half: staircases, tables and people still shade the floor under them. 1 = full, like a real lamp.
LogLamps = false                     # DIAGNOSTIC, for finding faults: write to the log every lamp that gains or loses its shadow, and why.
ScopeFix = true                      # B42 Optics (picture-in-picture scopes): no lamp shadows (indoors) or sun shadows (outdoors) on the scope's lens or in the scope's picture, where they would land in the wrong places (it is drawn from another camera). Off = as before.
DebugView = 0                        # 1: the light a shadow takes away is drawn in the lamp's own colour instead. 2: each lamp that casts shadows tints what it lights in its colour. 3 (diagnostic): only the red lamp's shadow map, read at every pixel whatever lamps the object has: red = blocked, pale colours = the six sides of its shadow map, a checker every 64 units, objects that lamp does not light at a third of the brightness. 0 off.

[_Shaders.ShadowsInteriors.RT]
Enabled = false                      # UNOFFICIAL (2026-10-28), EXPERIMENTAL, needs a restart, needs NVR DXVK with the RT core (patch 0028, and NvrRtHelper.exe in Data\NVSE\Plugins\NvrRt) AND a GPU with ray tracing (an AMD RX 6000 / Radeon 680M-780M or newer, an NVIDIA RTX, an Intel Arc; NOT a GTX 10-series: there it stays off and nothing changes): indoor lamp shadows traced against the room's real geometry instead of read from each lamp's shadow cube map, for the per-object lamp shadows ([Shaders.ShadowsInteriors.Forward] Enabled, needed). No cube-map stair-steps, seams or bias speckles; shadows sharp where things touch and softer further away (LampRadius). The tracing runs beside the game (a 64-bit helper) and arrives a frame or so later; where the result does not match what is on screen (something just moved in front, the edge of the screen) the cube map is used, so the cube maps stay as the fallback and the A/B (Live). The log says whether it is on and why not. docs/next/FORK-RT-LAMPS.md.
Live = true                          # Live A/B: true = the traced shadows, false = the cube maps again (same lamps, same shaders). Applies immediately.
MaxLamps = 8                         # [0-9] How many of the lamps with shadows (by shadow slot, the best-ranked first) are traced; the others keep their cube-map shadow. The tracing costs about Rays rays per pixel per traced lamp that reaches it. Applies immediately.
Rays = 1                             # [1-8] Rays per lamp per pixel. 1 = cheapest; with LampRadius above 0 the soft edge is then noise that TAA smooths (with TAA off use 4 or more). Applies immediately.
LampRadius = 4.0                     # [0-32] World units (about 70 to a metre): the size of the lamp the rays aim at, for soft shadows (sharp where things touch, softer further away). 0 = a point: hard shadows, no noise. Applies immediately.
InvisibleLightRadius = 24.0          # [-1-128] The same for the game's invisible lights (fill and mood lights with no lamp; see InvisibleLightShadowStrength): broad light, so a large size. -1 = LampRadius. Applies immediately.
Jitter = true                        # Turn the rays' pattern every frame (for TAA to average). false = a fixed pattern. Applies immediately.
StartOffset = 0.5                    # [0-31] World units a ray starts off the surface, against a surface shadowing itself. Applies immediately.
LampStop = 12.0                      # [0-64] A ray stops this many world units short of its lamp: the bulb and glass round the light point never shadow it. Applies immediately.
SkipLampModels = true                # The lamp models (fixtures, shades, chandeliers, fans: LampModelShadows' list) do not shadow their own light: over the last LampModelDistance ([Shaders.ShadowsInteriors.Forward]) of each ray they are skipped, so a chandelier still shadows the room's other lamps. Applies immediately.
SkipLampGlass = true                 # Lamp glass, bulbs and glow meshes never block a ray (they are the light). Applies immediately.
ActorsFromCubeMaps = true            # The RT scene has no people yet (only walls, furniture and props): true = each traced lamp takes the darker of the traced shadow and its cube map, so people still cast their shadows (and the cube map's own faults stay where it is darker); false = traced only (no shadows of people from traced lamps). Applies immediately.
DepthTolerance = 0.02                # [0-0.2] How close (share of the distance) a point must be to what the traced frame saw at the same place to use the traced result; else the cube map. Applies immediately.
DebugView = 0                        # 1 = compare: each traced lamp's light white where traced and cube map agree it is lit, black where both are blocked, RED where only the traced result is blocked, GREEN where only the cube map is (where nothing was traced, both show the cube map). 2 = coverage (diagnostic): each traced lamp's light GREEN where the traced result is used (brightness = how lit), BLUE where the point was off the traced frame's screen, RED where the traced frame saw another depth there (brighter = further off). 0 off. Applies immediately.

[_Shaders.ShadowsInteriors.Status]
Enabled = true                      # Post process pointlights shadows in exteriors.

[_Shaders.BounceLight.Main]
Strength = 1.5                      # UNOFFICIAL, optional: how much light bounces from lit surfaces onto nearby ones (0 = none).
Radius = 150.0                      # How far the bounce reaches, in world units (about 70 = 1 m).
DrawDistance = 6000.0               # Distance from the camera where the effect has faded out.
BlurRadius = 1.5                    # Smoothing of the bounce's grain, in pixels (x6 each way).
QuarterResolution = true            # Works the bounce out on a quarter of the pixels instead of half (about 1.2 instead of 1.9 ms at 1440p on a GTX 1070, no visible difference). Off = half resolution.
OffScreenLight = 1.0                # UNOFFICIAL: light for bounce samples that land off the screen (or behind your weapon), guessed from the ambient light and what is seen nearby, so the bounce no longer fades out toward the screen edges. 0 = off (they add nothing, as before).
MultiBounce = 1.0                   # UNOFFICIAL: more than one bounce: the bounce light each surface shows is passed on again the next frame (1 = all of it, up to 2). Subtle, mostly in corners. 0 = one bounce, as before.
Temporal = true                     # UNOFFICIAL: reuses last frame's bounce (moved with the view, dropped where something moved in front): less grain, steadier, light from things just turned away from fades out instead of vanishing. Off = as before.
HalfSamples = false                 # UNOFFICIAL: with Temporal, half the samples each frame: about 0.03 ms cheaper at 1440p, a little more shimmer while turning.
HardEdges = true                   # UNOFFICIAL: the bounce light never crosses the edge of a thing in front of a lit wall (pillars, posts and palms took the wall's light: a blurry glow drawn over them). Off: the softer blend from before. Applies to the Plus and Temporal modes.

[_Shaders.BounceLight.Status]
Enabled = false                     # UNOFFICIAL, optional: one bounce of indirect light from what is on screen (colour bleeding, more natural shading). About 1 ms GPU at 1440p when on (F10 'Bounce light'); nothing when off.

[_Shaders.ContactHardening.Main]
AtNight = false                      # UNOFFICIAL: keep contact hardening at night too. Off (default): plain shadow edges while the sun is down, where the moon's faded shadows show no difference (measured at a night test spot: no changed pixels, about 1 ms faster at 1440p).
SunSize = 1.0                        # UNOFFICIAL, optional: how soft far shadow edges get, as a multiple of the real sun's size (1 = realistic). Higher values can show aliasing.
MaxSoftness = 4.0                    # Cap on the blur, in shadow map texels (1-32). Higher allows softer edges under tall objects but costs more and can show aliasing.
Smooth = true                        # UNOFFICIAL (2026-10-15), PCF shadows (Mode 3): smoother contact-hardening edges. Narrow and wide penumbrae blend instead of switching along a line, and the soft-edge samples are turned a little differently at each spot on the ground, so wide penumbrae show a fine even grain instead of stair-steps and bands. Costs a little in penumbrae only.

[_Shaders.ContactHardening.Status]
Enabled = true                       # UNOFFICIAL, optional: sun shadows sharp where an object meets the ground and softer the further they fall from it. Needs a game RESTART the first time it is turned on (compiled into the shaders only then, so off costs nothing); after that the switch works live. Needs ForwardShadows.

[_Shaders.HDR.Main]
Enabled = false                      # UNOFFICIAL (2026-10-26), needs NVR DXVK (does nothing on native D3D9 or stock DXVK) and an HDR display with HDR on in Windows: true HDR output. The picture keeps its SDR look at "paper white" (HUD and menus too), and highlights the SDR tonemapper squeezed into white (sun, sky by the sun, lamps, fire, glints) get up to the display's peak brightness. With Windows HDR off it stays SDR by itself. Applies immediately.
Mode = 1                             # UNOFFICIAL (2026-10-26), needs NVR DXVK (extension 1.5-hdr) and Windows HDR on: the HDR signal sent to the display. 1 = HDR10 (PQ, 10-bit, what most HDR games send), 2 = scRGB (16-bit floating point, linear; Windows composes it itself). Applies immediately.
PaperWhiteNits = 200                 # UNOFFICIAL [80-1000] With HDR on: how bright white in the normal (SDR) picture, the HUD and the menus is, in nits. Match Windows' "SDR content brightness" (about 200-250 for most HDR monitors). Applies immediately.
PeakNits = 0                         # UNOFFICIAL [0-10000] With HDR on: the brightest a highlight (sun, lamp, fire, glint) may get, in nits. 0 = the display's own peak as Windows reports it (1000 if unknown). Applies immediately.
HighlightStrength = 1.0              # UNOFFICIAL [0-1] With HDR on: how much of the room above paper white the highlights use. 0 = the SDR picture at paper white (no HDR highlights), 1 = full. Applies immediately.
HighlightKnee = 0.5                  # UNOFFICIAL [0-0.99] With HDR on: from which SDR brightness (linear, 0.5 = about 73 % grey on screen) highlights start to rise above the SDR picture. Below it the picture is exactly the SDR one at paper white. Applies immediately.
HudThreshold = 1.5                   # UNOFFICIAL [0-255] With HDR on: a pixel whose colour differs by more than this (in 8-bit steps) from NVR's finished picture was drawn over by the HUD or a menu and is shown at paper white, without highlight gain. Applies immediately.
Gamma22 = false                      # UNOFFICIAL With HDR on: decode the SDR picture with a pure 2.2 gamma instead of the sRGB curve (slightly darker, deeper shadows; what many SDR monitors do). Applies immediately.
IgnoreDisplayCheck = false           # UNOFFICIAL, test only: send HDR even when Windows HDR is off for the display (Windows then converts it back to SDR; colours and brightness will look wrong). Applies immediately.
ShowHudMask = false                  # UNOFFICIAL, test only: tint green the pixels taken as HUD/menu (shown without highlight gain). Applies immediately.
CaptureFrame = 0                     # UNOFFICIAL, test only: each new non-zero value saves, 60 frames later, one frame of the HDR output (as sent to the display, in nits) to NVR-Unofficial-Optimized-Logs\NeonSelfTest_HdrCapture_<value>.pfm.world (a PFM image) and logs its brightness.

[_Shaders.Sharpening.Main]
Clamp = 0.1
Offset = 2.0
Strength = 0.75

[_Shaders.Sharpening.Interiors]
Clamp = 0.1                         # UNOFFICIAL: the same settings for interiors (Main is outdoors).
Offset = 2.0
Strength = 0.75

[_Shaders.Sharpening.Status]
Enabled = false                     # Edge contrast shader to increase detail sharpness.

[_Shaders.HeatHaze.Main]
Strength = 2.5                         # [0.0-8.0] How far the haze displaces the image at its hottest, in pixels (at 1080p). It follows the heat: zero at night, building from sunrise to PeakHour, fading to zero by sunset; full in clear weather, CloudyScale of it when cloudy, none in rain or snow or while the ground is still wet.
StartDistance = 1500.0                 # [0-20000] No haze nearer than this (game units), so nearby things never waver.
FullDistance = 12000.0                 # [1000-60000] Full haze from this distance on.
HorizonBand = 0.25                     # [0.05-1.0] How far above and below the horizon the haze reaches (the sine of the view angle): it lives along the horizon, where the line of sight runs longest through hot air.
NoiseScale = 40.0                      # [5-200] Ripple size: higher makes finer, busier ripples.
Speed = 0.6                            # [0.0-3.0] How fast the ripples rise.
PeakHour = 14.5                        # [10.0-17.0] The hottest hour of the day, when the haze is strongest.
CloudyScale = 0.35                     # [0.0-1.0] Heat in cloudy weather, as a share of a clear day's.

[_Shaders.HeatHaze.Status]
Enabled = false                        # Heat haze: distant ground shimmers in the hot air near the horizon, strongest on clear afternoons, gone at night and in rain or snow.

[_Shaders.Sandstorm.Main]
Keyword = "sandstorm,duststorm"        # A weather whose editor ID holds one of these words (separated by commas), in any case (SandStorm, NVWastelandSandstorm, the game's own HVDustStorm in Hidden Valley...), is a sandstorm. The storm builds and settles with the weather's own transition. (Ported from Physically-Based-Reloaded, Balebandro.)
Visibility = 2200.0                    # [200-30000] How far one sees through the full storm, in game units (a cell is 4096): about 95% of what lies this far is hidden.
HeightFalloff = 2500.0                 # [200-50000] The dust thins with height above the camera over about this many units, so looking up shows a little more sky than looking ahead.
Billowing = 0.7                        # [0.0-1.0] How much the dust gathers into rolling clouds: 0 an even haze, 1 thick clouds with clearer gaps between them.
NoiseScale = 900.0                     # [100-10000] Size of the dust clouds, in game units.
WindSpeed = 2000.0                     # [0-5000] The dust's speed at the weather's full wind, in units per second. It blows the way the weather's wind does.
MinWindSpeed = 700.0                   # [0-5000] The dust's speed when the weather has no wind.
StreakStrength = 1.0                   # [0.0-4.0] Thin streaks of sand blown past the camera. 0 off.
DustColorR = 0.86                      # [0.0-1.0] The dust's colour (red), lit by the weather's fog colour, its ambient light and the sun.
DustColorG = 0.68                      # [0.0-1.0] The dust's colour (green).
DustColorB = 0.48                      # [0.0-1.0] The dust's colour (blue).
SunScattering = 1.5                    # [0.0-10.0] How much brighter the dust glows looking toward the sun, as fine dust scatters light forward.
Brightness = 1.0                       # [0.0-10.0] Overall light on the dust.
FadeSpeed = 0.25                       # [0.01-10.0] How fast the storm builds and settles, as a share per second (0.25: about four seconds), on top of the weather's own transition.
GrassWind = 3.0                        # [1.0-10.0] How much harder the grass sways at the storm's height: it also leans downwind in gusts that sweep across the field, and flutters. Builds and settles with the storm; 1 leaves the grass as the weather moves it.
TreeWind = 2.5                         # [1.0-10.0] How much harder tree leaves swing at the storm's height, with a fast flutter. 1 leaves them as the weather moves them.
LightScattering = 1.0                  # [0.0-20.0] How strongly lamps, fires, signs and other nearby lights glow through the dust, the way the sun does: a halo around each, dimmed by the dust between you and it, stopping at walls. 0 off.
EmissiveThreshold = 3.0                # [0.0-50.0] Fire, sparks and other glowing effects are drawn without depth, so the storm would bury them as deep as whatever is behind them. A pixel this many times brighter than lit dust counts as glowing in front of it and only gets EmissiveDistance of dust. Lower catches dimmer effects (too low and bright sunlit walls pierce the storm too); 0 off.
EmissiveDistance = 400.0               # [0-5000] How much dust, in game units, such a glowing pixel is still seen through.
ThroughBlended = 1                     # [0-1] While the storm blows, glass and other see-through blended surfaces write no depth, so the world behind a window gets its own dust. Cut-outs (fences, wire, torn sheets) and water keep their depth. 0: the world behind a window stays clear.
CharactersKeepDepth = 1                # [0-1] With ThroughBlended: people and creatures keep their depth (hair, blended clothing and armour, hats, helmets, goggles), so they never get the dust of the world behind them and look see-through. 0: as before (a trooper's helmet could look see-through in the storm). From Physically-Based-Reloaded.
ForceStorm = 0                         # [0-1] Debugging: 1 shows the full storm outdoors in any weather.
Steps = 12                             # [4-12] Speed (FastPath 0 only): how many steps the dust is marched in near you (the main cost). Fewer is faster and grainier.
Octaves = 3                            # [1-3] Speed: detail layers in the dust clouds. Fewer is faster and smoother.
SoftEdges = 1                          # [0-1] Speed: 1 blends the dust at the edges of hair, foliage and fences over a few pixels (9 depth reads per pixel); 0 reads one (faster, a darker rim can show).
FineShelter = 1                        # [0-1] Speed: 1 tests 8 points upwind for each sand streak (walls and rocks stop them); 0 tests 4 (faster, coarser).
FastPath = 1                           # [0-1] Speed: 1 works the dust out on a coarse 3D grid of the air (one ray per 16 x 16 pixels, 64 slices deep) and the sand streaks and lamp glow at half resolution: the same storm for about a tenth of the cost (measured at 2560x1440 on a GTX 1070: 17.6 ms -> 1.5 ms in the desert by day and at dusk, 11.1 -> 2.2 ms on the neon-lit Strip at night), without the march's grain. Steps is then not used. 0: every pixel marched at full resolution (the original, very heavy).
FixedTime = -1.0                       # [-1.0-3600.0] Testing: 0 or more holds the dust still at that many seconds of its clock (to compare pictures); -1 lets it blow.

[_Shaders.Sandstorm.Status]
Enabled = false                        # Sandstorm: while the weather is a sandstorm (its editor ID holds Keyword), wind-driven dust fills the air: rolling clouds of it near you, a haze that swallows the distance and the sky, sand streaking past, lamps glowing through it, grass and trees whipped by the wind. Lit by the sun and the weather's own colours. Off by default (a look change).


[_Shaders.VolumetricLight.Main]
Strength = 0.3                         # [0.0-3.0] By day (the Night section has its own values; dawn and dusk blend the two): how much sunlight the lit air adds: shafts of light between the shadows of trees, buildings and rocks, strongest looking towards the sun. First-look value, tune in game.
Darken = 0.4                           # [0.0-1.0] By day: how much the shaded air dims what is behind it. The game's fog lights all the air alike; this lets the shadowed air between the shafts read darker. 0: shafts only ever brighten.
Density = 0.02                         # [0.0-2.0] By day: how thick the air is, per 1000 game units. Higher gives stronger, hazier shafts over a shorter distance.
MaxDistance = 5000.0                   # [500-15000] By day: how far from the eye the shafts are worked out (game units, 4096 to a cell). Beyond the sun's shadow maps the air counts as lit.
Steps = 16                             # [4-48] Day and night: shadow samples per pixel along the view (at half resolution). Fewer is cheaper but coarser (the noise and the smoothing below hide most of it). 16 measured 0.9 ms at 1440p on a GTX 1070.
Temporal = 0.9                         # [0.0-0.95] Day and night: how much of last frame's light each frame keeps. Each frame starts its samples at new points, so keeping the earlier frames adds up to many more samples: smooth shafts with no bands. 0: no carry-over (the noise then has to be blurred away). Lower it if shafts trail behind fast-moving shadows.
BlurRadius = 4.0                       # [0-8] Day and night: how wide the edge-aware smoothing is (in half-resolution pixels each way). It takes out the fine noise that breaks up the bands, and stops at the edges of buildings and trees. 0: no smoothing.
Anisotropy = 0.5                       # [0.0-0.9] By day: forward scattering: higher concentrates the light around the sun and fades it looking away.
RainStrength = 0.5                     # [0.0-1.0] Day and night: share of the strength in rain.
Froxels = true                         # Day and night: work the shafts out on a coarse 3D grid of the air (one column per 16 x 16 pixels, 64 slices deep) instead of along every pixel's view: far fewer shadow reads, no noise, so Steps, Temporal and BlurRadius are not used. Softer shaft edges.

[_Shaders.VolumetricLight.Night]
Strength = 0.09                        # [0.0-3.0] By moonlight: how much light the lit air adds.
Darken = 0.12                          # [0.0-1.0] By night: how much the shaded air dims what is behind it.
Density = 0.02                         # [0.0-2.0] By night: how thick the air is, per 1000 game units.
MaxDistance = 5000.0                   # [500-15000] By night: how far from the eye the shafts are worked out (game units).
Anisotropy = 0.5                       # [0.0-0.9] By night: forward scattering, how much the light gathers round the moon.

[_Shaders.VolumetricLight.Status]
Enabled = true                         # Volumetric light: sun shafts through the air, shaded by the sun's shadow maps. Outdoors only, needs exterior shadows on. Written for this build (idea from Physically-Based-Reloaded).

[_Shaders.Reflections.Main]
GroundSheen = 0.0                      # [0.0-2.0] Outdoors: how much dry ground that faces up (roads, pavements, floors) mirrors what is around it, blurred. Gives streets the sheen that picks up neon and lamps at night. Sand and grass get it too, so keep it low. 0: dry ground reflects nothing.
RainWetness = 1.0                      # [0.0-2.0] Outdoors: how much the rain makes the ground mirror the neon, lamps and sky. Follows the rain; only open ground gets wet (porches, awnings and marquees stay dry, as in Wet World); the puddles left after the rain are Wet World's. Above 1: stronger than real wet asphalt. 0: no rain reflections.
InteriorFloors = 0.0                   # [0.0-2.0] Indoors: how much floors mirror the room, blurred. EVERY floor facing up, wood and carpet too (the effect cannot tell materials apart); the game's own shiny surfaces already show the room through [Shaders.PBR.EnvMaps] CubeReflections. 0: none (default).
Roughness = 0.4                        # [0.02-1.0] How blurred the dry reflections are. 0.02: a mirror; 1: barely a glow.
WetRoughness = 0.08                    # [0.02-1.0] How blurred the wet reflections are. Low: sharp mirrored neon in the puddles.
MaxDistance = 4000.0                   # [200-20000] How far each reflected ray searches, in game units (4096 to a cell). Longer finds farther things, but costs more and may miss thin ones.
Steps = 24                             # [8-64] Samples along each reflected ray (at half resolution). More: steadier, fewer gaps; costs more.
Thickness = 1.0                        # [0.1-10] How thick things count as when a ray passes behind them. Higher fills gaps behind poles and signs, too high reflects things that should be hidden.
Temporal = 0.85                        # [0.0-0.95] How much of last frame's reflection each frame keeps: steadies the noise of blurred reflections. Lower it if reflections trail when turning quickly. 0: none.
BlurRadius = 12.0                      # [0-8] Edge-aware smoothing, in half-resolution pixels each way (wider on rough ground, narrow on wet).
DrawDistance = 8000.0                  # [500-50000] Surfaces farther than this (game units) do not reflect; they fade out before it.
SkyFallback = true                     # Outdoors: a reflected ray that finds nothing on screen takes the sky's colour if it points up into the sky. Off: nothing is reflected there.
CubeMap = true                         # A small live cube of the surroundings, built from what you have seen around you (a little behind, blurred). A reflected ray that finds nothing on screen takes it: ceilings and lamps above you still show in the floor, buildings behind you in the street. Off: only the sky (outdoors) or nothing.
CubeCapture = 0.02                     # [0.02-1.0] How much of the cube each frame's view replaces. Lower: steadier, slower to follow changes (lights switching, turning); higher: quicker, can shimmer.
CubeFade = 0.005                       # [0.0-0.2] How much of what is out of view fades away each frame (0.005: about two seconds to half). Higher forgets places you looked away from sooner.
GridFallback = true                    # UNOFFICIAL, EXPERIMENTAL, INDOORS ONLY: a reflected ray that finds nothing on screen also takes the light from Ambient Light's light grid (needs Ambient Light on with GridBounce above 0; nothing extra is drawn). The grid knows the light all round you, so blurred reflections keep a soft colour in the right place at the screen edges instead of cutting off. Coarse: it fills rough (blurred) reflections first and only the gaps of sharp ones (wet puddles keep the screen and the surroundings cube). Indoors only (outdoors it added almost nothing); about +0.05 ms.
GridBrightness = 1.0                   # [0.0-4.0] How bright the light grid's reflections are (GridFallback). 1 matches the light the grid gives Ambient Light's bounce.
DebugView = 0                          # [0-10] 1: the reflection alone; 2: where the rays found something (green) and where not (red); 3: the surroundings cube over the whole screen (should look like a blurred copy of the view). 0: normal picture. 4: where the rain wets the ground (white) and floors it cannot reach (covered: dark red). 5: what the light grid gives along every reflected ray (GridFallback; black outside the grid). 6: where each reflection came from: green the screen, blue the surroundings cube, red the light grid, grey the sky. 7: the materials MaterialAware knows (red rough, blue smooth, green metal; dimmed: not known, the floor guess). 9 (HiZ, diagnostic): how each ray's walk ended (green hit, cyan hit after the cell limit, yellow hit thrown away, red nothing to the end / off screen, magenta cell limit and nothing, blue not started). 10 (HiZ, diagnostic): what it skipped (red facing along the ray, green the surface's own plane, blue behind by more than the thickness).
MaterialAware = 1                      # [0-2] UNOFFICIAL, EXPERIMENTAL (2026-10-20, restart to turn on; needs [Shaders.PBR.Rmaos] Enabled): the surfaces' own materials from their _rmaos maps decide what reflects. Smooth ones (tiles, glass, polished counters, car paint, metal) reflect whichever way they face, rough ones (concrete, dirt, carpet) stop sheening, metal reflects in its own colour. Surfaces without a map (the land, actors, the game's own shaders) keep the floor guess above. The rain still wets open floors whatever they are made of. 2: the materials are gathered but not used (a test). 0: off (the shaders are exactly as before).
MaterialReflect = 1.0                  # [0.0-2.0] With MaterialAware: how much a smooth known material reflects (indoors and out; GroundSheen and InteriorFloors stay for the surfaces without a map).
ReflectAdd = 0.0                       # [0.0-1.0] UNOFFICIAL, EXPERIMENTAL (2026-10-21, restart to turn on): 0: the reflection replaces its share of the surface's own colour (as before), which shows the floor reflections far more in shadow than under the lamps. 1: the reflection is added on top of the surface's lighting, as a highlight is (lamp-lit floors show the lamps, shaded ones stay dark). Adds a little light overall. In between: a mix.
SpecularOcclusion = 1.0                # [0.0-1.0] UNOFFICIAL, EXPERIMENTAL (2026-10-21, restart to turn on): blurred reflections dim where the floor itself gets little light, so shaded floors stop standing out (they showed the room's reflection far more than lamp-lit ones). Sharp reflections dim too (a taste choice: a real mirror would not). 0: off.
SpecularOcclusionLevel = 0.5           # [0.05-4.0] With SpecularOcclusion: how bright the floor must be, against what it reflects, to keep all of the reflection. Higher dims more (lit floors too).
RoughnessOverrides = "nv_ultralux_centertiles:0.1, ul_marbleblack:0.12" # With MaterialAware: polished surfaces the _rmaos maps rate too rough, as "keyword:roughness" pairs (comma separated), matched against the map's file name. Example: "nv_ultralux_centertiles:0.1, ul_marbleblack:0.12". Only the reflections use it.
MaterialMaxRoughness = 0.5             # [0.05-1.0] With MaterialAware: known materials at least this rough do not reflect (they fade out from 60% of it). Lower: only polished surfaces; higher: satin ones too.
GlassReflect = 0.0                     # [0.0-2.0] UNOFFICIAL, EXPERIMENTAL (2026-10-29, the Vulkan passes of the NVR DXVK fork only): windows, bottles and shop glass reflect what is around them (on screen, the surroundings cube, and with [Shaders.Reflections.RT] the ray-traced scene), at the glass's own angle; the reflection follows the usual Fresnel (strong at grazing angles). Costs one extra draw per glass draw to mark where glass is (glass is a few draws a frame). Not during a sandstorm (glass then writes no depth). 0: off, nothing extra drawn.
HiZ = false                            # MEASURED SLOWER, LEAVE OFF (2026-10-26, GTX 1070): the walk now finds real hits and gives the same picture, but costs more than the fixed steps (desert 1080p: trace 1.30 vs 0.55 ms + 0.26 ms pyramid; Lucky 38 at 960x540: 0.44 vs 0.13 + 0.08). Kept for development only. UNOFFICIAL (2026-10-26), needs NVR DXVK and NvrDxvkPasses (does nothing on native D3D9 or stock DXVK), OUTDOORS ONLY for now (indoors the old fixed steps stay: the walk still misses some near-floor reflections there): each reflected ray walks the shared depth pyramid (Hi-Z, built once a frame in one compute pass), skipping whole empty blocks of the screen and testing every pixel it crosses, instead of Steps samples along the ray. Off: the fixed steps (as before). Applies immediately.
HiZSafeCells = false                   # UNOFFICIAL (2026-10-26) test only: the Hi-Z walk reads the depth pyramid's coarse cells safely (nearest/farthest as the smaller/larger of the two stored values, 'behind' skips only on the full-resolution depth); a fix under test for walks that found no hits. Leave off.
HiZCheck = 0                           # UNOFFICIAL (2026-10-26) test only: every N frames the Hi-Z pyramid is read back and compared with the depth buffer (one log line 'Hi-Z check'; that frame stalls). 0 = off.
HiZInteriorsTest = false               # UNOFFICIAL (2026-10-26) test only: HiZ indoors too (its interior picture is not yet the old trace's). With DebugView 9 / 10 shows why. Leave off.

[_Shaders.Reflections.RT]
Enabled = false                        # UNOFFICIAL, EXPERIMENTAL (2026-10-28, NVR DXVK fork on a GPU with Vulkan ray tracing only; does nothing elsewhere, e.g. on a GTX 10xx): reflected rays the screen cannot answer (off the screen, behind something, a gap the march stepped over) are traced through the scene in 3D. A hit that is visible on screen takes the picture there; one out of view takes the surroundings cube toward it, or a plain lit estimate. Rays that hit something no longer take the sky or the cube by mistake (no sky in the floor under a roof). Needs the Vulkan passes on. Off: the screen-space reflections as before.
MaxRoughness = 0.5                     # [0.02-1.0] With RT: surfaces rougher than this keep the old fallbacks (the cube, the light grid, the sky); fades in from 75% of it. Blurred reflections gain little from rays and cost the same.
Distance = 6000.0                      # [200-30000] With RT: how far each ray looks, in game units (4096 to a cell). Farther than this counts as open (the cube, then the sky).
ScreenTolerance = 0.02                 # [0.002-0.2] With RT: a hit counts as the pixel the screen shows there when their depths differ by less than this share of the distance. Too low: hits on screen fall back to the estimate; too high: what hides the hit is reflected instead.
EstimateBrightness = 1.0               # [0.0-4.0] With RT: brightness of the plain estimate used for hits neither the screen nor the cube can show (a grey surface lit by the place's light and, outdoors by day, the sun).
SunShadows = true                      # With RT: the estimate's sun goes through one more ray (is the hit in the sun's shadow). Off: every estimated hit gets the sun (cheaper).
HitLamps = true                        # UNOFFICIAL (2026-10-29), with RT: reflected things the screen cannot show (behind you, hidden) are lit by the 12 scene lamps nearest you as well as the room's light and the sun; indoors the lamp that lights each one most gets a shadow ray. Off: only the room's light and the sun.
VisibleNormals = true                  # UNOFFICIAL (2026-10-29), with RT: glossy reflections draw their rays from the microfacets the eye can see (VNDF sampling, Heitz 2018): less noise on rough and grazing surfaces for the same number of rays. Off: the screen march's plain GGX spread.
GlowBrightness = 3.0                   # [0.0-16.0] UNOFFICIAL (2026-10-29), with RT: reflected things the screen cannot show that glow (neon, lit signs, lamp glass: the ray tracing core's emissive flag) shine in the reflection with their own colour times this. 0: they are lit like any surface.
ContactSharpness = 0.3                 # [0.05-1.0] UNOFFICIAL (2026-10-29), with RT: how much of its usual blur a reflection keeps where the reflected thing touches the surface (a chair leg on a polished floor): sharp at contact, blurring with distance, as real glossy surfaces do. 1: the same blur everywhere (as before).
ContactSpread = 0.5                    # [0.01-4.0] UNOFFICIAL (2026-10-29), with RT: how far (as a share of your distance to the surface) the reflected thing must be from the surface for the full blur. Lower: the blur comes back sooner.
RoughShare = 0.3                       # [0.0-1.0] UNOFFICIAL (2026-10-29), with RT: surfaces rougher than this cast one ray per 2x2 pixels each frame (the casting pixel moves round the block frame by frame, the others use its hit, the reflection's history fills the gaps): a quarter of the rays on rough floors, where the reflection is blurred anyway. 0: a ray on every pixel.
RoughReach = 0.35                      # [0.0-0.99] UNOFFICIAL (2026-10-29), with RT: how far a ray on a fully rough surface looks, as a share of Distance (mirror-smooth ones look the whole Distance; in between, by roughness). Rough reflections blur far detail away, so short rays cost less for the same look. 0: every ray the whole Distance.
SplitTest = false                      # UNOFFICIAL (2026-10-28) test only: with Enabled, runs the RT trace's two in-game passes (RayGen, Resolve) without any rays, even without the RT helper. The picture must be exactly the normal trace's (checks the split); shows the split's own cost. Leave off.
DebugView = 0                          # [0-5] UNOFFICIAL (2026-10-28) diagnostic, with RT: 5 the scene alignment check (rays from the camera to each reflecting surface: green = the traced scene matches the screen, blue something nearer, yellow farther, red nothing hit); 1 where each reflection came from (green the screen march, cyan RT visible on screen, blue RT through the cube, magenta RT estimate, orange RT with the hit's own material, grey the old fallbacks); 2 the RT hit distance (white near, dark far, red nothing within Distance, black no ray); 3 the normal picture with RT alone (the screen march dropped); 4 a colour per hit instance (checks the scene). 0: normal picture.

[_Shaders.Reflections.Status]
Enabled = false                        # Screen-space reflections on the ground: wet streets mirror the neon and lamps in the rain; optional dry sheen and interior floors. Needs the normals buffer.

[_Shaders.SkyDither.Main]
Strength = 1.0                         # [0.0-4.0] Breaks up the bands in the sky's smooth gradients with a faint, ever-changing noise just before the picture goes to the screen. In steps of the screen's 256 brightness levels: 1 is enough to hide the bands; higher shows as grain.
AtToneMap = true                       # Also where the game rounds the HDR picture to the screen's 256 levels (the tonemap), over the whole picture: the bands are made there, so the noise at the end alone can't remove them. Invisible on textured surfaces.
SkyOnly = true                         # Only where the sky shows. Off: the whole picture (invisible on textured surfaces, can help smooth fog and dark gradients).
Pattern = 0                           # 0 = a new noise pattern every frame (the eye averages it into a smooth gradient). 1 = one fixed pattern: the same 1-step grain at the same pixels every frame, so a still camera shows a perfectly still picture (the anti-aliasing has nothing to flicker on: twinkle 0.0001 % vs 0.12 %); the noise statistics and spectrum are identical, the grain sticks to the screen when the camera moves, at one brightness step. A look change, off by default.

[_Shaders.SkyDither.Status]
Enabled = true                         # Sky dither: hides the banding in the sky's gradients. Very cheap.

[_Shaders.VolumetricClouds.Main]
CloudBase = 1500.0                     # [200-8000] Height of the bottom of the cloud layer, in metres (70 game units each).
Thickness = 1800.0                     # [100-6000] How deep the cloud layer is, in metres. Deeper: taller heaped clouds, darker undersides.
CoveragePleasant = 0.4                 # [0-1] How much of the sky the clouds fill in fair weather. These four follow the game's current weather, so console weather commands (fw, sw) and weather mods change the clouds too: a weather forced with fw shows at once, other changes blend as the game blends its own sky. With FromWeatherTextures they are read against how cloudy the weather's own cloud textures are (this value = vanilla's clear sky, Cloudy = a half-full sky, Rainy = overcast).
CoverageCloudy = 0.7                   # [0-1] The same in cloudy weather.
CoverageRainy = 0.95                   # [0-1] The same in rain: also flatter, greyer clouds.
CoverageSnow = 0.9                     # [0-1] The same in snow.
Density = 1.0                          # [0.05-5] How thick the clouds are: higher is more solid and darker underneath, lower more see-through.
ShapeSize = 9000.0                     # [500-50000] Size of the big cloud shapes, in metres per tile of the shape noise. Larger: bigger, fewer clouds.
DetailSize = 500.0                     # [50-10000] Size of the wisps that wear away the edges, in metres.
Erosion = 0.5                          # [0-1] How much the wisps eat into the cloud edges. 0: smooth round edges.
EdgeSharpness = 2.0                    # [1-8] How quickly a cloud goes from clear air to solid at its edge. 1: soft, hazy outlines; higher: crisp ones.
ShapeSmoothing = 0.0                   # [0-3] Smooths the big cloud shapes (reads the shape noise at a coarser level): fewer small stray puffs, softer outlines.
Turbulence = 1.0                       # [0-2] Twists and stretches the noise the clouds are made of, so they swirl and streak instead of showing rows of round blots. 0: off.
DetailSmoothness = 0.5                 # [0-1] Share of smooth noise in the edge detail (the rest is round billows). Higher: wispier, less lumpy edges.
HalfResolution = false                 # Older switch, the same as Resolution 1 (used only while Resolution is 0). Needs a restart.
Resolution = 0                         # UNOFFICIAL [0-5]: the size the clouds are worked out at. 0: a quarter of the screen each way (cheapest). 1: half, a little more fine detail, about 1.5x the cost. 2: the full screen, the sharpest edges and wisps, but 4 times the pixels of 1 (by far the most costly; check the cost with F10). Needs a restart. 3, 4, 5: larger than the screen (1.5, 2, 3 times each way; 5 needs about 600 MB of video memory at 1440p). Needs a restart.
WeatherSize = 30000.0                  # [2000-200000] Size of the pattern of where clouds form, in metres. Smaller: more, smaller cloud fields.
SunStrength = 1.4                      # [0-10] How bright the sun (or moon) makes the clouds.
AmbientStrength = 0.7                  # [0-10] How much the sky colour lights the clouds from all around (their shaded sides and undersides).
ForwardScattering = 0.6                # [0-0.95] How strongly the clouds glow when you look toward the sun (silver linings).
Steps = 48                             # [8-256] Samples along each view ray. Fewer is faster but grainier; more gives finer, steadier detail (cost grows with it). UNOFFICIAL 2026-10-15: 64 is the most the D3D9 shader uses. 2026-10-26: above 64 needs NVR DXVK with NvrDxvkPasses on (the Vulkan march has no instruction limit); on D3D9 anything above 64 counts as 64.
FineDetail = 0.0                       # UNOFFICIAL [0-1]: a second, finer layer of wisps and curls on the cloud edges, so they keep detail close up instead of one size of lump. 0: off (no cost). One more texture read per sample when on; best with Resolution 1 or 2.
FineDetailSize = 140.0                 # UNOFFICIAL [10-5000]: size of that finer layer, in metres. Smaller: finer grain.
CumulusShape = 1.0                     # UNOFFICIAL [0-1] (2026-10-20): fair-weather clouds as heaps, like real desert cumulus: flat grey bases, rounded bright tops, clean edges (no smoky wisps or flat slabs). Fades out by itself as the sky closes over (cloudy, rain, snow keep their layered look). 0: the older look.
Towering = 0.0                         # UNOFFICIAL [0-1] (2026-10-25): storm clouds, like the huge cumulonimbus towering over the desert in a western: a few lone storms kilometres apart, each a broad billowing column from the cloud base up to TowerHeight times Thickness that spreads out into a flat-topped anvil, among the ordinary clouds (the biggest of those climb a little higher too). Higher: more storms. Fades out by itself as the sky closes over. Costs more cloud march work (check F10); 0: off, no cost.
TowerHeight = 5.0                      # UNOFFICIAL [1-8]: how tall the storms reach, in times Thickness (5 with Thickness 1800: tops near 10 km, as real ones). Used only with Towering above 0.
TowerAnvil = 1.0                       # UNOFFICIAL [0-1]: how far the storms' tops spread out into an anvil. 0: plain tall columns.
Sharpness = 0.5                        # UNOFFICIAL [0-3]: how crisp the clouds look. Higher: the clouds' history is kept sharp as they and the view move (instead of softening a little every frame), the finished clouds get edge-aware sharpening without halos, and far-off cloud detail stays finer. It also keeps drifting clouds moving smoothly (each pixel follows the wind between its refreshes). 0: the older, softer look. Costs a little at Resolution 2, almost nothing at 0.
FromWeatherTextures = 1.0              # UNOFFICIAL [0-1]: how much the coverage follows the current weather's own cloud textures (how much of the sky the game's cloud layers would fill) instead of only its type (pleasant, cloudy, rainy, snow). Weather mods often give overcast skies a 'pleasant' type; with 1 they still get heavy clouds. Rain and snow never get fewer clouds than their own setting. 0: the type alone, as before. Each weather is logged once (NewVegasReloaded.log) with what it measured.
FixedMarchExit = false                 # UNOFFICIAL (2026-10-17): the cloud march stops after Steps samples and when the cloud is opaque, as it was written to (the shader compiler had killed that exit, so every ray took 64 steps and ran past the horizon cap). Slightly different look near the horizon, a little faster. Off = as before.
WeatherTint = 0.5                      # UNOFFICIAL [0-1] (2026-10-25): the clouds take the colour the current weather gives its own cloud layers at this hour (orange at sunrise and sunset, grey when overcast, blue at night), on top of the sun and sky light they already get. Only the colour changes, not the brightness. Weather mods that set their own cloud colours show through. 0: off (the clouds' colour comes from the sun and sky alone, as before). No measurable cost.
MaxDistance = 80000.0                  # [5000-200000] How far away clouds are still drawn, in metres.
HazeDistance = 30000.0                 # [1000-200000] Distance, in metres, at which far clouds have mostly thinned out into the sky.
WindSpeed = 1.0                        # [0-20] How fast the clouds drift with the game's wind: 1 is about 15 m/s in calm weather to 60 m/s in a gale (faster than real, so you can see them move).
Evolution = 8.0                        # [0-50] How fast the clouds change shape as they drift, in metres per second.
History = 0.8                          # [0-0.95] How much of the earlier frames each new sample keeps: higher is smoother but slower to react.
Brightness = 1.0                       # [0-5] Overall brightness of the clouds.
HideGameClouds = true                  # Hide the game's own flat cloud layers while these clouds are drawn (they stay in the water's reflection).
GameTime = true                        # UNOFFICIAL: the clouds move by the game's clock: waiting or sleeping moves them on as far as that time would, a pause or a menu stops them, and the same save shows the same sky. Off: they move by the real time on screen, as before.
Shadows = 0.6                          # UNOFFICIAL [0-1]: how much the clouds shade the ground in the sunlight (drifting cloud shadows across the land). 0: no cloud shadows. While above 0 these replace the flat clouds' Cloud Shadows (Shadows Exteriors, Cloud Shadows), which then do nothing.
ShadowRange = 30000.0                  # UNOFFICIAL [4000-100000]: how far round you the cloud shadows reach, in metres across. Larger reaches farther but each shadow is a little softer.
ShadowResolution = 256                 # UNOFFICIAL [256-2048]: detail of the cloud shadows: 256, 512, 1024 or 2048 texels across ShadowRange (256 over 30000 m is about 120 m per texel, soft edges). Higher: crisper cloud shadow edges, but the shadow map is redrawn every frame, so 1024 costs about 16 times 256 (check with F10). Needs a restart.
ShadowPrefilter = false                # UNOFFICIAL: smoother cloud shadows. On: the shadow map is made from the clouds' smooth shape only (no fine edge detail) and several samples per texel, so faces and ground get no dark speckles or blotches under the clouds. Off: as before.
ShadowSoftness = 1.5                   # UNOFFICIAL [0.5-4]: with ShadowPrefilter on, how wide each cloud shadow sample spreads, in shadow map texels. Higher: softer, smoother cloud shadow edges.
WaterReflections = 1.0                 # UNOFFICIAL [0-1]: these clouds in the water's reflection, drawn into the game's own reflection where it shows sky (so the water waves and tints them like the rest), in place of the game's flat cloud layers there. 0: the game's clouds in the water, as before.
ShadowDebug = false                    # UNOFFICIAL: shows the cloud shadows alone (white: sunlit, black: shaded by a cloud; walls turned from the sun greyer). For checking only.
ReflectionDebug = 0                    # UNOFFICIAL [0-2]: checking only. 1: in the water reflection, paints red where it looks up into the sky and blue where down (where the clouds would go), behind what the game drew. 2: the same over everything.

[_Shaders.VolumetricClouds.Status]
Enabled = false                        # UNOFFICIAL, EXPERIMENTAL (2026-10-11): real 3D clouds high above the ground, lit by the sun and the sky, moving with the wind and following the weather, in place of the game's flat cloud pictures. About 1 ms at 2560x1440 on a GTX 1070. Exteriors only.

[_Shaders.Bodycam.Main]
Fisheye = 0.45                         # UNOFFICIAL [0-1]: how much the wide lens bends straight lines outward towards the edges. Main = by day; Night and Interiors have their own value of every setting here (all but TextSize).
FitEdges = 0.9                         # [0-1] Zooms in so the bent picture still fills the screen (1: no black corners from the bend; 0: none).
Border = 0.95                          # [0-1] A soft black oval round the picture, like looking through the camera's frame. 0: none.
Fringe = 3.1                           # [0-10] Colour fringes (red and blue apart) towards the edges, in pixels at 1080p.
EdgeBlur = 1.6                         # [0-2] The cheap lens blurs towards the edges.
LensBlur = 0.5                         # [0-2] A mild blur over the whole picture (the cheap lens is never quite in focus). 0 off, 1 about 2.5 pixels at 1080p.
Vignette = 0.75                        # [0-1] Darker corners.
Sharpen = 0.5                          # [0-3] The camera's oversharpening: halos along edges.
Exposure = 0.75                        # [0.5-3] By day: overexposure, brighter than the game, highlights clipping. (Night and Interiors have their own.)
Contrast = 1.25                        # [0.5-2] By day: contrast round mid-grey (harsh above 1).
Saturation = 0.7                       # [0-2] By day: colour, below 1 washed out.
Lift = 0.2                             # [0-1.5] By day: raises the dark tones (as a camera's auto exposure does in the dark); black and white stay.
Cool = 1.0                             # [0-1] By day: takes the yellow out of New Vegas's own colour grade, towards the neutral whites of real footage.
Glow = 0.8                             # [0-2] Bright areas bleed over what is near them.
Grain = 2.0                            # [0-2] Sensor noise, changing 30 times a second, stronger in the dark.
Blocks = 0.2                           # [0-1] Video-compression blocks in dark, flat areas.
MotionBlur = 0.5                       # [0-3] Smear while the view turns. 0: none.
LensDirt = 0.4                         # [0-2] Smudges on the lens that light up in bright light.
Tint = 0.55                            # [0-1] A faint green cast.
Text = 0.0                             # [0-1] The timestamp in the top right (the game's date and clock). 0: none.
TextSize = 4.0                         # [1-12] Size of the timestamp's pixels, at 1080p.
VideoFps = 30                          # [0-60] Video frame rate: each frame is held until the next is due, as recorded footage plays (the game keeps running at full speed underneath). 0: off, every frame drawn.
AutoExposure = 0.8                     # [0-1] The camera's exposure lags behind the light: stepping into the sun blows the picture out before it settles, going indoors it goes dark first. In steady light it changes nothing. 0: off.
ExposureSpeed = 1.5                    # [0.1-10] Seconds the exposure takes to catch up (most of the way in about twice this).
Breakup = 0.1                          # [0-2] The video compression breaks down while the view turns fast or you run: bigger blocks over everything. 0: off.
RollingShutter = 0.1                   # [0-3] Rolling-shutter wobble: upright things lean while the view pans fast, the picture squashes on fast tilts. 0: off.
Bounce = 1.0                           # [0-2] The camera is strapped to the chest: the picture bobs with each step and leans into turns (the picture only: your aim is not moved). 0: off.
GunJolt = 1.0                          # [0-3] Each shot jolts the mount: the picture kicks and springs back. 0: off.
Overload = 1.0                         # [0-2] A muzzle flash overloads the sensor: the frame washes out for a moment, then the exposure dips before settling. 0: off.
LowLight = 0.0                         # [0-1] Low-light mode: nearly black and white, shadows lifted, much more grain (mostly a Night setting). 0: off.
LightSmear = 0.3                       # [0-2] Very bright lights bleed into vertical streaks, as cheap sensors do (stronger with LowLight). 0: off.
Hiccups = 0.3                          # [0-1] Encoder hiccups: now and then a frozen frame or a short burst of broken blocks (more often while moving); higher = more often. 0: off.
Autofocus = 0.8                        # [0-2] Autofocus hunting: when what is in the middle of the picture gets much nearer or further, the picture goes soft and pulls back into focus. 0: off.
WideView = 0.0                         # [0, 60-150] Main only: the world's field of view while Bodycam is on (body cameras see much wider than the game). Eased in and out, left alone while aiming and in menus; your game's own value comes back when Bodycam is off. Only the live value is changed, never your INI. 0: the game's own (try 100).
Mic = 0.0                              # [0-1] Main only: all the game's sound as if picked up by the camera's own cheap microphone (the knobs below), while Bodycam is on. 0: off; 1: all mic.
MicTone = 0.7                          # [0-1] The small mic's band: 0 full range, 1 a tiny phone-like mic (bass and treble cut).
MicCompression = 0.7                   # [0-1] Automatic gain: quiet sounds brought up, loud ones held down; it pumps after a gunshot.
MicGain = 6.0                          # [-24 to 24] dB into the mic's cheap preamp: higher clips (distorts) loud sounds sooner.
MicBits = 10                           # [0, 2-16] Bitcrush: the bits kept (lower = grittier). 0: off.
MicSampleRate = 16000                  # [0, 500-48000] Hz the mic is sampled at (lower = duller, lo-fi). 0: off.
MicHiss = 0.3                          # [0-1] Background hiss.

