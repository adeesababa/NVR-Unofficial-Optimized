[_Shaders.Grass.NewGrass]
Enabled = false                        # UNOFFICIAL (2026-10-18) NEW GRASS, a LOOK CHANGE (off): real blade geometry built from the game's own grass placement (same tufts, same density, same grass types per region; each type's colour and shape read from its own card texture). With KeepCards (the default, the 'hybrid') the game's card stays as the dense core of every clump and thin strands are added around its silhouette near the player: real volume from every angle, anti-aliased edges, strands that bend and sway one by one, the sun's shadows on them; far grass is the cards alone. KeepCards = false replaces the cards by blades. Needs DrawFirst. Live. The look is the user's call; cost in the bench log (newgrass-LOG.md).
KeepCards = true                       # true = the hybrid (the game's card is drawn as well, the strands around it); false = the blades replace the cards.
