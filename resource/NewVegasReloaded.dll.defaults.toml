[_Shaders.DitherBuster.Main]
Strength = 1.0                        # AA blend strength (0.0 = off, 1.0 = full).
MaskPower = 0.5                       # Edge detection sensitivity, as the exponent in pow(0.002, MaskPower). Because the base is below 1, RAISING this LOWERS the threshold and antialiases MORE edges - the opposite of what this line used to claim. 0.5 gives a threshold of 0.045, 1.0 gives 0.002.
DitherThreshold = 0.08                # [0.0-1.0, 0 disables] Catches isolated pixels that disagree with all four neighbours at once - alpha test dither, which the edge mask above is mathematically blind to because central differences cancel on a checkerboard. Those pixels get an isotropic average instead of the directional pass. Lower catches more dither; too low and it will start averaging fine texture detail and thin geometry like wires.
Radius = 1.0                          # [0.0-3.0] How far along the edge the directional samples reach, in texels. The samples were previously offset by the raw luma difference, which on an ordinary edge is a few hundredths of a texel - six samples of the same pixel, doing nothing. Normalising the direction and scaling it by this is what NFAA and BIAA do. 0 restores the old raw behaviour; above about 1.5 it starts to smear.
GateSoftness = 0.0                    # [0.0-1.0] How sharply the isolated-pixel test switches on. 0 = the original hard step at DitherThreshold. Above 0 the blend weight rises smoothly over DitherThreshold x (1 - softness) .. (1 + softness) (0.5 = 0.04 to 0.12 at the default threshold). The hard step flipped on and off with the faint noise the tonemap adds for the sky (+-1 brightness step) at thin bright-and-dark features (wires, grass blades): a pixel switching between its own value and the 5-pixel average changes by 10-70 steps, frame after frame - a twinkle on a still picture, 0.12 % of the pixels in the grass scene. 0.5 cuts that 3.8x (0.25: 2.8x, 1.0: 4.2x) at no cost in time; the AA keeps its agreement with a supersampled reference (grass FLIP 0.1134 -> 0.1128, no AA 0.1202) and its edge sharpness (within 1.2 %). It is a look change, tiny: the picture differs from the hard step only at pixels the old step decided by a coin toss (FLIP 0.006, less than the same still scene differs by on its own a minute later). Recommended: 0.5. Off by default (it changes the look).
DeDither = false                      # Judge the isolated-pixel test on the picture without the tonemap's dither noise (recomputed from the pixel position and frame; only the decision, the written picture keeps its dither). Cuts the noise the decision sees 2.7x, but the gain on top of GateSoftness is small (1.3x less twinkle) and it costs +0.05 ms: leave off. Needs Sky Dither with AtToneMap.
DebugView = 0                         # 1 = show the picture with the recomputed dither noise taken out (turn SMAA off to see it): it must match the same frame with the dither off. Proves DeDither reads the right pixel and frame.

[_Shaders.DitherBuster.Status]
Enabled = true                        # Reduces dithering artifacts via luma-edge anti-aliasing.

[_Shaders.SMAA.Main]
EdgeDetection = 3                      # What counts as an edge. 0 luma, 1 colour, 2 depth, 3 luma and depth together. Luma and colour see shading and material edges; depth sees geometry and the alpha test edges they miss. 3 takes both and is the default - the gain over luma alone is small but real.
Threshold = 0.05                       # [0.005-0.5] Luma/colour contrast a pixel pair must differ by to count as an edge. Lower finds more edges and antialiases more of the image; too low starts smoothing texture detail.
DepthThreshold = 0.005                 # [0.0001-0.5] Depth edge sensitivity, as a fraction of the depth at that pixel rather than an absolute distance, so it behaves the same near and far. Affects EdgeDetection 2 and 3 only.
MaxSearchSteps = 32                    # [4-112] How far along an edge the search may travel looking for its end. Longer edges need more steps to be smoothed properly - shallow near horizontal ones most of all - and the cost is only paid where edges actually run that far.
SubpixelShift = 0.0                    # [-2.0-2.0] Shifts SMAA's sampling relative to the pixel it writes, in texels. **0.0 is the technically correct value**: the game's fullscreen quad already puts texture coordinates on texel centres, so sampling is exact and any offset moves it onto texel boundaries, where every fetch becomes a bilinear average of two pixels - a half pixel blur, which also lowers contrast enough that SMAA finds fewer edges. Compared side by side it is simply a blur: the apparent gain in edge smoothness and in DXVK grass dither is the softening, not antialiasing, so it ships at 0.0. Raise it only if you deliberately want that softness.
DepthOffset = 0.0                      # [-2.0-2.0] Shifts only the depth buffer lookups, in texels. **0.5 is the technically correct value**: the depth buffer is rendered separately from the colour buffer and the two sit half a texel apart, so at 0.0 depth found edges land slightly off from the colour edges being blended and look subtly distorted. It ships at 0.0 regardless, because that same misalignment suppresses DXVK's grass dithering far better than correct alignment does. Set 0.5 for cleaner, correctly placed depth edges and accept the dither returning. Affects EdgeDetection 2 and 3 only.
LocalContrast = 2.0                    # [1.0-20.0] How willing SMAA is to call something an edge when its neighbourhood is already busy. The stock 2.0 rejects edges in high contrast areas. Raising it does find more of them, but it will not clean up alpha test dither: SMAA blends by matching edges against a line pattern, and a dither is a checkerboard with no line to match, so the extra edges get near zero weight. Worth raising if finely detailed geometry is being skipped; too high and it starts working on texture noise.
Predication = false                   # Predicated thresholding (Jimenez et al., SMAA, Eurographics 2012): where the depth is flat the luma edge threshold is multiplied by PredicationScale, where there is a depth edge it stays (EdgeDetection 3 only; the depth edge is an edge anyway). Texture-contrast pairs near the threshold stop flipping with the faint tonemap dither noise (luma edge flips 3.5x fewer in a model), geometry edges are unchanged - but about half the texture edges SMAA used to smooth are no longer edges, and the second-difference energy rises 2-5 % (foliage, leaves). A LOOK change; alone it does little for the twinkle (1.08x). Off = every luma pair is judged at Threshold.
PredicationScale = 2.0                # [1.0-8.0] Luma threshold multiplier where the depth is flat (the SMAA reference uses 2).
PredicationStrength = 0.4             # [0.0-1.0] How much a depth edge lowers the threshold again (the SMAA reference uses 0.4). NOTE: this never changes the picture in practice: it only acts on pixels that are already edges, and with EdgeDetection 3 a depth edge is an edge anyway. A value of 0.0 reads as 0.4. Kept so older config files still load.
DeDither = false                      # Judge the luma edges on the picture without the tonemap's dither noise (recomputed from the pixel position and frame; decisions only, the blend still reads the dithered picture). Luma edge flips between dither patterns 1.8x fewer (model); +0.01 ms. Together with GateSoftness 0.5 and DitherBuster DeDither (+ Predication) the grass scene's twinkle falls 9.7x. Needs Sky Dither with AtToneMap; EdgeDetection 3 only.

[_Shaders.SMAA.Status]
Enabled = true						  # Apply SMAA.

[_Shaders.TAA.Main]
HistoryWeight = 0.9                    # [0.5-0.97] How much of each frame is last frame's result carried forward. 0.9 averages roughly the last ten frames. Higher is smoother and settles crawling edges more completely, but anything the reprojection gets wrong -- moving NPCs, since only camera motion is tracked -- lingers longer before it clears. Lower responds faster and stabilises less.
ClipGamma = 1.0                        # [0.5-2.5] How far last frame's colour may stray from what is around the pixel now before it is pulled back, in standard deviations of the 3x3 neighbourhood. This is the main defence against ghosting. Lower rejects stale history harder -- fewer trails behind moving things, but more of the flicker comes back; higher keeps more history -- steadier, but moving objects start leaving trails.
WeaponTAA = 1.0                        # [0.0-1.0] How much TAA applies to the first-person weapon and hands, as a scale on HistoryWeight for those pixels only. The weapon is not jittered, so TAA gives it no anti-aliasing -- only steadiness while it sways -- and because its own sway and bob are motion TAA cannot track, its texture can soften slightly as it moves. 1 treats it like the world, 0.5 halves the history for a steadier-but-sharper middle ground, 0 leaves the weapon exactly as rendered (MSAA and SMAA still apply).
Jitter = true                          # Shift the world render by a different fraction of a pixel each frame (an 8-frame Halton pattern), so TAA collects several sub-pixel samples of every pixel and anti-aliases a still image, not just edges in motion. Without it each frame samples identical pixel centres, and averaging identical frames changes nothing. Only the world scene is jittered: shadow maps, the first-person weapon and every NVR effect see the steady camera. Off gives stabilisation in motion only.
Sharpness = 0.5                        # [0.0-1.0] Sharpening of TAA's output, giving back the softness averaging frames costs. Clamped to each pixel's neighbours, so no halos, and lighter on hard edges than on texture detail. Only the picture is sharpened, never the history, so it does not build up. 0 off. With this on, the separate Sharpening effect is best left off (or at its default).
MipBias = -0.5                         # [-1.5-0.0] Texture mip bias while the jittered world draws: picks sharper texture mips, the detail TAA's averaging would otherwise soften, while TAA settles the extra shimmer. Needs Jitter. 0 off; below -1 textures start to crawl.
DebugView = 0                          # [0-5] Replaces the frame with a diagnostic view; the real TAA result keeps accumulating underneath, so switching back is seamless. 0 off. 1 motion: black = no movement, red/green = horizontal/vertical motion, full at 16 px per frame -- standing still must be all black, turning must give an even wash with the weapon staying black. 2 reprojection error: last frame vs this frame before any clipping -- THE test for trailing: turning past static scenery must stay mostly dark, lit only on edges and newly revealed areas; a doubled image lit everywhere means the reprojection is wrong. With Jitter on, edges flicker faintly here even standing still -- that is the jitter itself, and expected. 3 history use: grey = how much history is blended in (white full, black rejected), red = clipping fighting a ghost, expected on moving NPCs. 4 weapon mask: pixels treated as the first-person weapon in magenta -- must cover the weapon and hands exactly. 5 depth as TAA reads it, log scale, black near to white far.

[_Shaders.TAA.Status]
Enabled = false                        # Temporal anti-aliasing: blends each frame with the last, reprojected for camera motion. With Jitter on it anti-aliases still images as well as settling edges and fine detail that crawl as the view moves. The first-person weapon is reprojected with zero motion so it does not smear when turning. (UNOFFICIAL: from the Physically-Based-Reloaded fork; TAA itself is upstream #78 by Conor.) Note: shapes that are dithered (terrain blending, LOD fades) are smoothed by it.


