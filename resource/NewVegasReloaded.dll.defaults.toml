[_Shaders.PBR.Metal]
MetalOn = true                       # UNOFFICIAL: switches the metal look below on and off (the Enabled button at the top of the panel switches ALL of the PBR shaders, not just this).
FirstPerson = 1.0                    # UNOFFICIAL: metal on your first-person weapon (0 = off, 1 = full). New Vegas has no metal maps, so every surface was lit like plastic: white highlights in the sun, flat and matte in the shade. Metal is guessed from the textures (grey colour, and the shininess mask the artists painted) and then has no flat diffuse light: it shows tinted highlights and reflects the sky and its surroundings. DebugView shows what counts as metal.
World = 0.5                          # The same for everything else in the world (0 = exactly as before). Grey concrete or cloth can be taken for metal, so it starts off.
FadeDistance = 0.0                   # [0-4000] How far away the metal look on the world is gone, in game units (about 70 to a metre); it fades out from 60% of that. 0, or anything further, uses the distance where the game starts dropping highlights from objects (fSpecularLODStartFade in Fallout.ini, usually 2000): past it the game draws objects without highlights, and the metal would vanish at once.
GreyMetal = 0.5                      # [0.0-1.0] How metal a grey part is where the shininess mask is bare (most of a gun's body). The painted mask always makes it fully metal.
ColourStart = 0.25                   # [0.0-1.0] Colour saturation from which a part starts to count as painted or plastic instead of metal...
ColourEnd = 0.55                     # [0.0-1.0] ...and from which it never counts as metal (wood, coloured paint, brass is in between).
Roughness = 0.3                      # [0.05-1.0] Finish of bare metal: 0.05 mirror, 0.5 satin, 1 rough cast.
PolishedRoughness = 0.65             # [0.05-1.0] Finish where the shininess mask is painted fully (edges, worn spots).
Reflections = 0.6                    # [0.0-4.0] Strength of what metal reflects from its surroundings (the sky and the ambient light).
DebugView = 0                        # 1: metal shown in orange (brighter = more metal) over a dim grey image.
SharpSky = 0.5                       # UNOFFICIAL: 0-1. Reflections on metal and shiny objects take the sky's light from the direction they reflect (a gun facing a sunset turns warm on that side). 0 = as before.
CubeReflections = 1.0                # UNOFFICIAL: 0-1. Metal reflects what is really around it (the street, the neon, the room's lamps) instead of only the sky and ambient light: the live surroundings cube that Shaders > Reflections keeps (needs Reflections on with CubeMap on). Darker in dim places, colourful near neon. Switching it on or off from 0 needs a restart. 0: as before.

[_Shaders.PBR.EnvMaps]
Lighting = 0.5                       # UNOFFICIAL: the "chrome" reflections the game draws on guns, glass and metal props follow the light round them (1), or keep the game's fixed brightness (0), which gleams the same in a dark cave as at noon.
Strength = 1.5                       # [0.0-8.0] Brightness of those reflections in the light: about the game's at 1.5 in daylight, dimmer in shade and at night, faint in the dark.
WithMetal = 0.6                      # [0.0-1.0] Where the metal look ([Shaders.PBR.Metal]) is on, it already reflects the surroundings, so these reflections are scaled by this (1 = both in full).
CubeReflections = 1.0                # UNOFFICIAL: 0-1. The game's chrome and glass reflections show what is really around them (the live surroundings cube from Shaders > Reflections, needs Reflections on with CubeMap on) instead of the game's painted picture. Switching it on or off from 0 needs a restart. 0: as before.

[_Shaders.PBR.MaterialRules]
Enabled = true                       # UNOFFICIAL: per-texture material classes (guns, glass, wood, rock, chrome...) from the editable table NewVegasReloaded.dll.materials.txt next to the DLL: which surfaces may look like metal and how rough or polished each kind is. Lets the metal look ([Shaders.PBR.Metal], needs MetalOn) reach guns, robots and steel in the world without turning concrete and cloth into metal. Textures the table does not name look exactly as with this off. Switching it on or off needs a restart (off, the shaders are exactly as before and cost nothing).
DebugView = false                    # Shows each class in its own colour (guns red, wood brown, glass cyan, plants green, rock grey...) over a dim grey picture; textures without a rule stay grey. For checking the table.
LogMatches = false                   # Writes each texture's class to the log the first time it is drawn ("[MaterialRules] <texture> -> <class>").

[_Shaders.PBR.Rmaos]
Enabled = false                      # UNOFFICIAL: PBR material maps. Where a texture has a <name>_rmaos.dds beside it (or under textures\pbr\ at the same path; the Community Shaders "True PBR" layout: red roughness, green metal, blue ambient occlusion, alpha specular level), objects take their roughness, metal and occlusion from it instead of the guesses. Loose files only. Restart to switch (it is compiled into the object shaders).
On = true                            # With Enabled: use the maps (live switch, for comparing). Off: objects as without them.
Occlusion = 1.0                      # [0.0-1.0] How much the maps' ambient occlusion darkens the ambient light.
DebugView = 0                        # [0-4] 1: the maps' roughness in grey; 2: metal; 3: occlusion; 4: objects that have a map in green, others dim grey. 0: normal picture.
LogMatches = false                   # Writes each texture to the log the first time it is drawn, with its map or "none" ("[Rmaos] <texture> -> <file>"): which textures a place uses.

[_Shaders.PBR.Linear]
Enabled = false                      # UNOFFICIAL: linear lighting on objects and the ground. The game adds light up in gamma space, so lit sides drop off too fast into shade, two lamps add up too dark and coloured light tints too little. On, colours are decoded to linear, lit, and encoded back: softer, fuller light falloff and truer colour mixing. Changes the look (brighter mid-tones and ambient), so the exposure and ambient may want retuning. Switching it on or off needs a restart (off, the shaders are exactly as before and cost nothing).
Gamma = 2.2                          # [1.0-3.0] The gamma the colours are decoded with, live. 2.2 is standard; 1.0 looks the same as off.

