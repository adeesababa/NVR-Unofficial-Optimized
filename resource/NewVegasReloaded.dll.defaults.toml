SkipEmpty = false                     # UNOFFICIAL (2026-10-16), DROPPED (off): skip the god rays' blurs when the light mask is empty. Measured in game: the mask is never empty in daylight, so it only added a 0.07 ms check. Applies immediately
SkipIdle = false                      # UNOFFICIAL, MAY CHANGE THE IMAGE (off): draw no god rays at all while the sun is high (20+ degrees up) and well outside the view (12+ degrees beyond the frame) and the sky is too dim to cast rays. Then the rays are exactly nothing and the picture is the one without them; every 4th frame a cheap check (sky mask + a 1-pixel occlusion query, ~0.15 ms, answered a frame later without waiting) tells whether the sky is still dim. Measured at game hours 8-16: the god rays cost ~0.45 ms, with this on ~0.04 ms on frames where the sun is not in view; nothing changes when the sun is in view (the full effect runs on that very frame). Not exact in one case: the sky turning bright within a few frames without the sun (a lightning flash): the rays then start up to ~8 frames late. Also makes the god rays pass return its input exactly where the rays are 0 (the old pass darkens most texels by one fp16 step, ~0.05 %). Needs occlusion queries, otherwise does nothing. Applies immediately
