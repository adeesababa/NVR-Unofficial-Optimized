HeightScale = 0.8                      # strand height relative to the plant's height on its card (the card's opaque top, read from its texture); 0.8 keeps every tip below the card's top.
WidthRatio = 0.015                     # strand width at the root as a share of the plant's height (0.015 = about 1 unit: twig-thin).
TipReach = 1.0                         # how far out the strands reach: tips between half of and this many times the card's alpha EDGE at their height (1.0 = never past the card's outline).
Kink = 0.5                             # a sideways wobble along each strand (share of its width per segment) so it zigzags like a dry twig; 0 = smooth.
