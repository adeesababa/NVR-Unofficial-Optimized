[_Shaders.Bloom.Main]
Blending = 0.04                         # Blending between the base and bloom. Low values are preferable. Works for NVR and vanilla.
Strength = 1.0                          # Scales the bloom. Works for NVR and vanilla.
Passes = 8                              # Passes to apply, 2-8.
PassBlending = 0.0                      # 0: Use additive blending, 0-1: Linear blending coefficient.
Spread = 0.0                            # UNOFFICIAL: 0 = as before. Higher = bigger, wider glows (each wider blur level counts 1 + Spread times as much as the one before; try 0.3-1); below 0 = tighter. Only with PassBlending 0.
GlowBoost = 0.0                         # UNOFFICIAL: 0 = as before. Extra glow from bright lights (neon signs, lamps, fire): they count up to 1 + GlowBoost times as much as the rest of the image (try 2-6).
GlowLightLevel = 1.5                    # UNOFFICIAL, all times of day: what gets GlowBoost: brighter than this many times a white surface lit by the scene's own light (sky and sun or moon outdoors, the cell's light indoors). Lower = more things glow (1-3).
LinearLight = false                     # UNOFFICIAL, all times of day: blurs the light the way it really adds up (as a camera lens spreads it): bright lights on a dark background keep much more of their glow, the rest glows a little less. Off = as before.
AntiFlicker = false                     # UNOFFICIAL, all times of day: steadier glow where tiny bright highlights flicker in and out (small glints count less). Off = as before.

[_Shaders.Bloom.Night]
Blending = 0.04                         # Blending between the base and bloom. Low values are preferable. Works for NVR and vanilla.
Strength = 1.0                          # Scales the bloom. Works for NVR and vanilla.
Passes = 8                              # Passes to apply, 2-8.
