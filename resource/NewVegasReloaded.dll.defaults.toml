# This file is for the default values of settings. Do not modify

[_Main.CameraMode.Main]
ChasingFirst = false    # Use Chasing camera in first person.
ChasingThird = false    # Use Chasing camera in third person.
Crosshair = 0           # Display crosshair in Camera Mode.
Enabled = false         # Activate Camera Mode.
FoV = 90.0              # Custom FOV in Camera Mode.

[_Main.CameraMode.Positioning]
AimingOffsetX = -1.0
AimingOffsetY = 15.0
AimingOffsetZ = 4.5
DialogOffsetX = -50.0
DialogOffsetY = -50.0
DialogOffsetZ = 10.0
OffsetX = 0.0
OffsetY = 15.0
OffsetZ = 5.0

[_Main.Develop.Main]
DebugMode = false       # Enables debug features like capture shaders and print shadowmaps.
DebugVar1 = 0.0         # Custom variable used when developing shaders.
DebugVar2 = 0.0         # Custom variable used when developing shaders.
DebugVar3 = 0.0         # Custom variable used when developing shaders.
DebugVar4 = 0.0         # Custom variable used when developing shaders.
TraceShaders = 25       # Keyboard shortcut to print used shaders list to the log.
GpuDebugLabels = false  # Debug only (2026-10-26): every NVR step (each effect, shadow map, sun cascade, the game's world scene, the DXVK extension's passes) is a named group in a frame capture (D3DPERF events). Under DXVK they need the environment variable DXVK_DEBUG=markers. Guide: docs/next/FORK-DEBUG-CAPTURE.md.
RenderDocCaptureKey = 0 # Debug only: keyboard key (DirectInput code, e.g. 87 = F11) that asks RenderDoc for a capture of the next frame(s). Works only when the game was started from RenderDoc (on the DXVK d3d9.dll); NVR never loads RenderDoc. 0 = no key.
RenderDocCaptureFrames = 1  # Debug only: how many frames the RenderDocCaptureKey captures (1-10).

[_Main.Develop.PixelInspector]
Enabled = false         # UNOFFICIAL DEBUGGING TOOL (2026-10-26), needs NVR DXVK with extension 1.5-debug (fork patch 0016; does nothing on native D3D9 or stock DXVK, and says so once in the log): for the screen pixel X, Y, records the value it has at every stage NVR can see each frame (the scene before NVR, the linear depth, the view normal, the picture after each effect that drew, the effects' own buffers such as the shadow buffer, the tonemapped picture, the final picture before the HUD) and shows them in a window while the menu is open (pick the pixel with the mouse there); the log gets them ('PIXEL INSPECTOR') when the pixel changes and every LogEvery frames. One tiny GPU copy per stage, read back a few frames later without ever waiting. Off: nothing is created. Applies immediately.
X = 960                 # UNOFFICIAL DEBUGGING TOOL (2026-10-26): the inspected pixel's column, in the game's render pixels (0 = left). Also the probe pixel of the shader counters.
Y = 540                 # UNOFFICIAL DEBUGGING TOOL (2026-10-26): the inspected pixel's row, in the game's render pixels (0 = top).
LogEvery = 0            # UNOFFICIAL DEBUGGING TOOL (2026-10-26): with Enabled, also log every stage every this many frames (0: only when the pixel changes, or with the window's 'Log now').

[_Main.Develop.ShaderCounters]
ReflectionsHiZ = false  # UNOFFICIAL DEBUGGING TOOL (2026-10-26), needs NVR DXVK 1.5-debug and Reflections' HiZ trace running (NvrDxvkPasses, HiZ, outdoors): the trace runs its counting build (Compute\ReflectionsTraceHiZCount.spv) that counts how every reflected ray's walk ended (the DebugView 9 rules), the cells walked and the DebugView 10 skips, plus the values of the pixel inspector's pixel; per-frame averages logged once a second ('SHADER COUNTERS') and shown in the pixel inspector window. Read back without waiting. Costs a little GPU time while on (atomic counters in every trace pixel). Off: the normal trace, nothing created. Applies immediately.

[_Main.Transitions.Main]
TransitionCurvePower = 1.0             # Day/night transition curve exponent. 1.0 = current smoothstep behavior. Higher values sharpen the transition; lower values soften it.

[_Main.FlyCam.Main]
Enabled = true
KeyAdd = 78
KeySubtract = 74
ScrollMultiplier = 2.0
StepValue = 1.0

[_Main.GunFX.Main]
Puff = false                            # GunFX (experimental, needs GunFX.dll): a small puff of smoke at the muzzle on every shot. Fine-tune everything in Data\NVSE\Plugins\GunFX.ini.
HeatSmoke = false                       # GunFX: a thin strand of smoke rising from the barrel once it is hot from sustained fire; it tapers off as the gun cools.
AfterFireTrail = false                  # GunFX: a thin, wispy trail rising from the barrel only after you stop firing (like a cigarette); fades as the barrel cools, stops when you fire again.
VolumetricSmoke = false                 # GunFX (prototype): draw the smoke (heat smoke, after-fire trail, muzzle puff, ejection smoke) as continuous volumetric smoke (lit, soft, unbroken while moving) instead of particles. Each smoke's own switch still applies; tuning in [Volume] in GunFX.ini.
VolumetricSmokeHalfRes = true           # GunFX: draw the volumetric smoke at half resolution (a quarter of the pixels; much cheaper, the smoke is soft). Off = full resolution.
VolumetricSmokeLowRes = true# GunFX: draw big, close volumetric smoke (pieces covering more than 1% of the screen, as when you walk into smoke) at an eighth of the resolution. Much cheaper in thick smoke; looks the same.
SmokeHaze = true                       # GunFX: the gun-smoke haze that slowly fills a room as you keep firing (with VolumetricSmoke). The most expensive part of GunFX: off skips its whole-screen pass. Applies immediately.
BulletTunnels = true                   # GunFX: bullets punch tunnels through the smoke and haze in front of you, which then fill back in. Off skips the pass that cuts them. Applies immediately.
VolumetricSmokeTest = 0                 # GunFX, for finding faults: 0 normal; 1 the volumetric smoke in plain green (shows exactly where it is drawn); 2 no muzzle flash light on it; 3 smoke worked out but not drawn; 4 nothing drawn at all. Leave on 0.
EjectionSmoke = false                   # GunFX: a burst of smoke from the ejection port with every casing, bigger when the barrel is hot.
BarrelGlow = false                      # GunFX: the barrel glows after sustained fire and cools down slowly.
HeatHaze = false                        # GunFX: heat shimmer around a hot barrel (screen effect).
MuzzleBlast = false                     # GunFX: a quick, wide ripple of heat shimmer at the muzzle on every shot, whatever the barrel heat.
EnergyWeapons = false                   # GunFX on energy weapons too (lasers, plasma and the like, including modded ones: decided by the weapon's Energy Weapons skill). Off = no GunFX effects on them.

[_Main.FrameRate.SmartControl]
FlowControl = -0.5
SmartControl = false
SmartControlFPS = 60

[_Main.FrameRate.Stuttering]
BackgroundThreadPriority = 5
SmartBackgroundProcess = false

[_Main.LowHFSound.Main]
FatigueCoeff = 0.5
FatigueEnabled = true
HealthCoeff = 0.5
HealthEnabled = false

[_Main.Main.Misc]
ForceMSAA = false           # Override game setting to force MSAA.
RenderEffects = true        # Toggle rendering of all effects.
RenderPreTonemapping = true # Toggle rendering of some effects in HDR before the game image space effects (can cause glitches).
ReplaceIntro = false        # Controls rendering of the main menu custom video.
ScreenshotKey = 87          # Keycode for custom screenshot hotkey (removes HUD and saves as jpg).
HDRScreenshot = false       # Save screenshots in fbx (use with DXVK HDR)
PresetManagerEnabled = false # Master toggle for automatic per-location Preset Manager resolution. Off = your own settings are authoritative; Save/Load/Delete in the Preset Manager panel still work. Defaults off: it silently wins the location-based settings that third-party tools like Cartographer -- which this feature supersedes -- also try to control, so turn it on deliberately once you're not running one of those alongside it.
MoreLampsPerObject = true    # UNOFFICIAL (2026-10-13), needs a restart: the game lit most shiny surfaces indoors (anything with a specular map) with at most 2-3 lamps each and dropped the rest; which ones it kept changed as you moved, so lamp light popped on and off whole wall and floor pieces. On: up to 6, like the game's other many-lamp passes. A little more GPU time where many lamps overlap. Off = the game's limit.
LampsInOnePass = false       # UNOFFICIAL, TEST (2026-10-18), live: shiny surfaces lit by 3-5 lamps (most lit walls and floors indoors) are drawn in ONE pass with all their lamps, as the game already does for 2 lamps, instead of 5-7 passes (base, extra lamps, texture, highlights, fog). With linear lighting each extra pass was added in the stored curve (too bright, a hazy look); in one pass the lamps add up exactly, so these surfaces come out darker and more contrasty. Far fewer draws, but measured SLOWER on the graphics card in the Ultra-Luxe (about +1 ms: the one many-lamp pass costs more than the passes it replaces); about the same in a casino. Needs MoreLampsPerObject (it holds the lamps; without it this stays off). Off = the game's choice.
FoldFog = true               # UNOFFICIAL (2026-10-27), live: environment-mapped objects (shiny metal, chrome, marble with a reflection) get their fog in their lit pass instead of a separate fog pass afterwards: one draw fewer per such object (Vault 21 ~200, a casino up to ~280 a frame). The same picture; the reflection is fogged once instead of twice. Glass and other alpha-blended objects keep their fog pass. Off = as the game draws them.
ManyLampsGlow = true         # UNOFFICIAL (2026-10-27), live, only while ManyLampsOnePass is on: glow-mapped objects (lit signs, lamps, screens, vault wall lights) take the one pass too instead of the game's 5-7 passes (Vault 21 lobby: ~180 objects a frame, ~1,200 draws). Off = they stay multi-pass as the game draws them.
ManyLampsOnePass = false     # UNOFFICIAL (2026-10-27, from Conor's fork; ported 2026-10-28), needs a restart to come on (its shaders), then live: off goes back to the game's passes with the same shaders (to compare with F10); only under DXVK (stock or NVR DXVK; does nothing on native D3D9), with MoreLampsPerObject on: shiny surfaces lit by 3 to 24 lamps (most walls and floors in lamp-rich interiors: Vault 21, the casinos) are drawn in ONE pass with all their lamps instead of the game's 5-7 passes (light-only, extra lamp, texture, highlight and fog passes): far fewer draw calls indoors, which helps most when the processor holds the frame rate back. With LinearScene the picture is the same (the game's passes already add up exactly there). NVR hands the shaders every lamp of the object itself (the game's own arrays stop at 6), and the shaders light each lamp per pixel. Lamps 7-24 of an object get no forward cube-map lamp shadow (the screen-space lamp shadows still cover them). Off = exactly as before.
LampsDepthFirst = 0          # UNOFFICIAL, TEST (2026-10-26), live, needs DXVK (stock or NVR DXVK; does nothing on native D3D9, where it measured slower): makes LampsInOnePass cheaper. The surfaces drawn in one pass with all their lamps are first drawn once with depth only, then shaded, so each pixel gets its lamps computed once, for the surface you actually see; those walls and floors then also hide what is behind them from the rest of the scene. Same picture. Measured with LampsInOnePass: Lucky 38 about 0.7 ms faster than LampsInOnePass alone and 0.1 ms faster than the game's passes; Ultra-Luxe 0.03-0.2 ms faster than LampsInOnePass alone. 1 = on, 0 = off.
LampsDepthFirstMinLamps = 0  # UNOFFICIAL, TEST (2026-10-26): LampsDepthFirst only for one-pass surfaces with at least this many lights (the main light counts). 0 = all of them.
LampsDepthFirstCount = 0     # TEST (2026-10-26), development builds only, F10 only: counts the pixels the one many-lamp passes shade ('LAMPS DEPTH FIRST counts' lines). 0 = off.
LampReachMargin = 16.0       # UNOFFICIAL, BUG FIX (2026-10-13), needs a restart: game units (about 70 to a metre). The game lights an object with a lamp only while the lamp's reach touches the object; fire lights flicker and move a few units, so a lamp at the edge of an object's reach switched on and off every frame and its light and shadow flickered over whole walls and floors. The object counts this much larger, so a lamp at the edge stays. Its light is already zero there, so nothing else changes. 0 = as before.
SpecularLODPasses = false    # UNOFFICIAL, BUG FIX (2026-10-18), live: shiny objects lit by 3-5 lamps (most lit walls, floors and props indoors) jumped in brightness at the distance where the game stops drawing highlights (2000-2300 units by default): near, the game drew them in several passes whose sums come out too bright with linear lighting; past that distance in one exact pass. On: the game picks the same set of passes on both sides of that distance (only the highlight passes are left out far away), so nothing pops as you walk towards or away from them. Far objects with 3-5 lamps then look as they do up close. Off = the game's choice.
ActorsInOnePass = false      # UNOFFICIAL (2026-10-18), live, a LOOK OPTION: shiny actors (NPCs, the player's body) and the first-person model keep ONE lighting pass up to 5 lamps (needs MoreLampsPerObject). Without it, a moving actor that walks into a third lamp switches to several passes: with linear lighting it turns up to 2-3x brighter at once and loses its metal look, and back again as it walks on. On: no such pops on moving things; they keep exact sums and their metal with 3-5 lamps (darker and more contrasty there than the walls around them, which keep the game's passes). Off = the game's choice.
PbrPopLog = 0                # TEST (2026-10-18), development builds only: 1 writes every lit object that changes its set of lighting passes from one frame to the next to the log ('PBR POP' lines: name, distance, lamps, where on the screen), and how fast the _rmaos maps arrive ('RMAOS STREAM' lines). 0 = off.
PassFamilyView = 0           # TEST (2026-10-21), development builds only, diagnostic: every lit object indoors and out drawn in one flat colour by the family of lighting passes the game draws it with: one pass with 0-1 lamps blue, 2 lamps green, 3+ cyan; several passes (light, extra lamps, texture, highlights, fog) with 3 lamps yellow, 4 orange, 5 red, 6+ magenta; other shaders grey. Four shades per family tell neighbouring pieces apart. Logs the coloured objects once ('PASS FAMILY' lines). THE PICTURE IS WRONG while on. 0 = off.
CasterView = 0               # TEST (2026-10-28), development builds only, diagnostic, live, outdoors: every lit object drawn in one flat colour by what the sun shadow cascade covering it did with it this frame: green casts, yellow casts only into another cascade, red casts nowhere (too small for that cascade, MinRadius, or filtered), magenta still fading in (shadows pop at 75 % of the fade), cyan / orange object LOD casting / not, grey beyond the shadows. The log gets one "CASTER VIEW" line per object with its reason. For hunting shadow pop-in. 0 = off.
LinearSceneCensus = 0        # TEST (2026-10-28), development builds only, diagnostic, live: 1 = every 600 frames the log gets "LINEAR CENSUS" lines: every draw into the world and the first person counted by pixel shader (NVR's or the game's), blend (opaque, add, multiply, alpha) and whether it is in the main opaque list. Step 1 of the linear-scene plan (docs/next/LINEAR-SCENE-PLAN.md). Costs a little CPU while on. 0 = off.
PbrPopSpecLODEnd = 0.0       # TEST (2026-10-18), development builds only: moves the game's highlight distance to this many units (its fade range kept) and rebuilds every object's passes, to see objects cross it with a still camera. 0 = the game's own.

[_Main.Main.Performance]
SkipRedundantConstants = true # UNOFFICIAL: skip shader-constant uploads that set exactly what the graphics device already holds (measured indoors: about 9 in 10 of them). Same picture; less work for the CPU, which indoors is what limits the frame rate. Live: F10 logs a CONSTANT FILTER line. Turn off if anything ever renders wrong.
SkinnedShadowFaceTest = true # UNOFFICIAL: lamp shadows (interior cube maps) draw characters only into the cube faces their skeleton can reach, instead of all six; bounds rebuilt from the bones each frame, so the shadows are the same. Big CPU saving with many NPCs near lamps. Live: F10 logs a POINT SHADOWS skinned casters line. Turn off if a character's shadow ever goes missing near a lamp.
ParallelShaderCompile = true # UNOFFICIAL: at game start, NVR's shaders and (since 2026-10-28, after Conor's fork) its effects are prepared and compiled on all your CPU cores at once instead of one after another (the same shaders and cache files, only sooner: a start without a shader cache takes about as long as the slowest effect, VolumetricClouds, instead of all of them in a row). Off: one at a time, as before.
NewEffectCompiler = true    # UNOFFICIAL (2026-10-29): NVR's effects are compiled with Windows' own shader compiler (d3dcompiler_47, on every Windows 10 and 11) instead of the old D3DX one: the big effects take seconds instead of minutes on a start without a shader cache (the snow effect took over 8 minutes, enough to look like the game would not start). Where it is missing or refuses an effect, the old compiler is used as before (logged). false = the old compiler only. Switching recompiles the effects once by itself (no need to clear the cache).
ShaderWarmUp = false        # UNOFFICIAL, EXPERIMENTAL (did not remove the hitches in the first test: the driver compiles per drawing setup, which the test draw does not match): at the main menu, draw each NVR shader you have used in play once into a tiny hidden target, so the graphics driver compiles it there instead of the first time it appears in the world (that first compile was the 50-250 ms hitch when new areas came into view). The list fills as you play (Shaders\NewVegasReloaded\Shaders\Cache\WarmUp.txt). Skipped with DXVK, which compiles shaders ahead anyway. Same picture.
ShaderWarmUp2 = 0           # UNOFFICIAL, EXPERIMENTAL (2026-10-18): a shader preloader for plain Direct3D 9 (DXVK does this by itself). The graphics driver finishes each shader's compile the first time it is drawn, once per drawing setup, which made the 50-250 ms stutters when new places came into view. 1 = record: every new drawing setup is written to Shaders\NewVegasReloaded\Shaders\Cache\WarmUp2.txt as you play. 2 = record + warm up: at the main menu those setups are drawn once into a hidden target, so the driver compiles them there instead of in the world (the menu may pause for a moment). 0 = off. Restart to change. Skipped with DXVK. Same picture.
ShaderWarmUp2BudgetMs = 150 # UNOFFICIAL (2026-10-18): with ShaderWarmUp2 = 2, the warm-up time per main-menu frame in ms (the rest is done in the next frames while the menu is up).
ShaderWarmUp2MinMs = 0.0    # UNOFFICIAL (2026-10-18): with ShaderWarmUp2 = 2, only setups whose first draw took at least this many ms when recorded are warmed up (0 = every recorded setup; 2026-10-19: the first-draw time does not show a compile when the graphics driver compiles on its own thread).
ArrivalSampler = 0          # UNOFFICIAL, TEST BUILDS ONLY (2026-10-20): 1 = a sampling profiler of the game's main thread writes what it was doing in every frame over 50 ms to NVR-Unofficial-Optimized-Logs\ArrivalSamples_<time>.txt (for finding the cause of stutters on arrival). Not in release builds. Restart to change.
IOWorker2 = 0               # UNOFFICIAL, EXPERIMENTAL (2026-10-20): 1 = the game gets a second loading thread that only loads models and textures (the game has one; after a loading screen it is busy for up to a second while you already wait, mostly building NPC face textures and decoding textures). Off by default while it is being tested: if the game crashes or a model / texture looks wrong with it on, turn it off. Restart to change.
HiddenObjectCulling = false # UNOFFICIAL, EXPERIMENTAL (2026-10-11): indoors the game draws most objects several times (the base pass, then extra passes for more lamps and shine). An object that was completely covered by other things a few frames ago gets only its base pass; its extra passes are skipped. Mostly saves CPU (about 0.5 ms in the Rivet City hangar), so it shows most where the CPU limits the frame rate. Worst case: an object that has just come out from behind something misses its extra lamp light for a few frames; answers from before a fast camera turn or move are never used. Live: F10 logs a HIDDEN OBJECT CULLING line. Was FNVProbe's culling version 2.
PreDecodeCache = true       # UNOFFICIAL (2026-10-21), live, CPU: with linear lighting's PreDecode on, the decoded lamp and ambient colours are remembered (exactly what the slow power function gave before) and each upload of them is sent in one piece. Same picture, bit for bit; less CPU work in lamp-rich interiors (the Ultra-Luxe made ~28,000 such copies per frame).
FastCasterHash = true       # UNOFFICIAL (2026-10-21), live, CPU: the check whether anything that casts a lamp shadow (interiors) moved or changed is done 4 bytes at a time and once per object per frame instead of byte by byte for every lamp. Same shadows; less CPU work indoors. Switching it on or off redraws every lamp shadow once.
LampScissor = true          # UNOFFICIAL (2026-10-11): the passes that add an extra lamp's light to an object (indoors) are drawn only inside the screen rectangle that lamp's light can reach, instead of over the whole object. A lamp only lights up to its radius, so nothing outside the rectangle changes. Same picture, less work for the graphics card in lamp-lit interiors. Live: F10 logs a LAMP SCISSOR line. Turn off if lamp light ever looks cut off along a straight line.
LampScissorExact = true     # UNOFFICIAL (2026-10-21): LampScissor's rectangle is the exact outline of each lamp's reach on screen, also for lamps near you (before, a lamp whose reach came close to or behind you drew its pass over the whole screen, most of them indoors). Same picture, less work for the graphics card in lamp-lit interiors. Live. Off = the older, looser rectangle.
TrimLampPasses = true       # UNOFFICIAL (2026-10-11): indoors the game adds each extra lamp's light in its own pass over the whole object, even where that lamp cannot reach. Those pixels add exactly nothing; now they are dropped instead of being blended in. Same picture, less work for the graphics card in lamp-lit interiors. Live. Turn off if anything indoors ever looks different.
LampPassTestSkip = 0        # UNOFFICIAL DIAGNOSTIC (test builds): skips the passes a merged lamp pass would replace, THE PICTURE IS WRONG while on. 1 the extra lamp passes, 2 the highlight passes, 3 both. Keep 0
LampPassOrderLog = 0        # UNOFFICIAL DIAGNOSTIC (test builds): log the order of the world's draw passes for N frames. Keep 0
HiddenObjectCullingMaxAge = 4 # UNOFFICIAL: how old (in frames, 1-7) a 'was it covered' answer from the graphics card may be and still be used by HiddenObjectCulling. The card answers 2-4 frames late when it is busy; lower = fewer skips but less chance of a late light. Live.
FrameChain = true           # UNOFFICIAL: effects alternate between two buffers instead of copying the whole frame after every effect. Faster, identical image. Applies immediately.
CompositeApply = true       # UNOFFICIAL: apply exterior sun shadows and ambient occlusion inside the fog pass instead of in their own full-screen passes (with AmbientLight on, the sun shadows inside its passes). Faster, same result. Applies immediately.
ChainUsesGameTexture = true # UNOFFICIAL: use the game's own frame as one of the effect chain's two buffers, avoiding whole-frame copies at the start and end of each chain. Needs FrameChain. Applies immediately.
MergedDepthNormals = false  # UNOFFICIAL, EXPERIMENTAL, keep off: reconstruct normals in the depth pass instead of a separate full-screen pass. On a GTX 1070 (native D3D9) the driver silently skips this draw, so depth and normals stop updating (wrong AO, fog, god rays, SMAA). Since P40 it checks itself the first time it runs: the log line 'UNOFFICIAL merged depth/normals check' says whether the driver really drew it, and if it did not, the switch turns itself off until the game is restarted (separate passes, correct image). Applies immediately.
SkipIdentityExposure = true # UNOFFICIAL (2026-10-17): skip the exposure pass while its MaxBrightness is 0 (the Night default): the pass then hands the picture back unchanged (a full-screen read and write for nothing, 0.15 ms). Same picture. Applies immediately.
AvgLumaCompute = false      # UNOFFICIAL (2026-10-23), needs NVR DXVK (the NVR-built DXVK d3d9.dll, docs\next\NVR-DXVK-EXTENSION.md); does nothing on native D3D9 or stock DXVK: the screen's average brightness (exposure, depth of field focus) is computed by a Vulkan compute pass that reads every pixel once (exact), instead of the D3D9 pass's 112 sample points. Same smoothing, same speeds, same texture for the other effects. Applies immediately. The log says 'NVR DXVK' at start whether the extension was found.
AvgLumaComputeCheck = 0     # UNOFFICIAL TEST TOOL (2026-10-23), with AvgLumaCompute and NVR DXVK: N > 0 = every N frames run both the compute and the D3D9 average-luma pass and log them side by side ('AvgLuma check'); the D3D9 pass keeps the texture while this is on. Those frames wait for the graphics card: leave 0 while playing.
NvrDxvkPasses = true        # UNOFFICIAL (2026-10-23), needs NVR DXVK (does nothing on native D3D9 or stock DXVK): the effects ported so far (Exposure, ImageAdjust, Sharpening, FXAA, LowHF, SkyDither, BloodLens, WaterLens, LUT, Lens, MotionBlur; since 2026-10-25 also Coloring, DitherBuster, BarrelHaze, HeatHaze, Cinema, DepthOfField's distant blur and autofocus, Bodycam, SkinScattering, BloomLegacy, Snow, Precipitations, ShadowsInteriors, SkyView, ShadowsExteriors, SunFar, FlashlightBeam, VolumetricLight, WetWorld, GodRays, SMAA, Specular, Underwater, Reflections, Bloom, TAA, Sandstorm, SnowAccumulation, BounceLight, PointShadows, PointShadows2, CombineDepth, Normals, VolumetricClouds, Flashlight, SunShadows, VolumetricSmoke, AmbientOcclusion, VolumetricFog, AmbientLight) run as Vulkan passes through the NVR extension instead of their D3D9 shaders, same picture by construction (the GLSL in src\hlsl\NewVegas\Compute is the .fx.hlsl line for line). The point is the route (no 16-sampler / 224-constant / instruction limits for what comes next), not speed. An effect whose pass fails falls back to its D3D9 shader for the session (logged). Applies immediately.
NvrDxvkVariants = true      # UNOFFICIAL (2026-10-26), needs NVR DXVK with NvrDxvkPasses on: a Vulkan pass uses its compile-time variant (Shaders\NewVegasReloaded\Compute\<name>-<variant>.spv, the D3D9 technique's fixed switches: unused paths compiled out, as the D3D9 shaders are) where one exists, else the general shader. Same picture either way; off only to compare speed. Applies immediately.
NvrDxvkStencil = true       # UNOFFICIAL (2026-10-26), needs NVR DXVK 1.6 with NvrDxvkPasses on: a Vulkan pass tests a stencil where its D3D9 technique does (SMAA's costly weight pass runs only on the edge pixels its edge pass marked, as on D3D9). Same picture either way; off only to compare speed. Applies immediately.
NvrDxvkKeepD3D9 = ""        # UNOFFICIAL (2026-10-26), test tool for NvrDxvkPasses: effect names (as in the log, e.g. "PointShadows"; several separated by commas) that keep their D3D9 passes while the other ported effects run as Vulkan passes, so the frame time shows what one pass costs. Empty for normal play. Applies immediately.
NvrDxvkTestSuffix = ""      # UNOFFICIAL (2026-10-26), test tool for NvrDxvkPasses: a Vulkan pass with compile-time variants uses Shaders/NewVegasReloaded/Compute/<name>-<variant><this>.spv where that file exists (shader experiments in one launch). Empty for normal play. Applies immediately.
AmbientLightSmoothCompute = false # MEASURED SLOWER 2026-10-25 (GTX 1070, 1080p: blur 0.20 vs 0.09 ms, smoothing 0.32 vs 0.11 ms incl. prepare), same picture: keep off. UNOFFICIAL (2026-10-25), needs NVR DXVK (does nothing on native D3D9 or stock DXVK): AmbientLight's normal smoothing ([Shaders.AmbientLight.Main] NormalSmoothing) runs as one Vulkan compute dispatch (src\hlsl\NewVegas\Compute\AmbientLightSmooth.comp) instead of its two half-resolution D3D9 passes: the same taps, weights and 16-bit rounding between the two directions, so the same picture; the point is the measurement (F10 'Ambient light prepare + smooth (half)' covers either path). If it fails it is logged once and the D3D9 passes run for the session. Applies immediately.
AmbientLightBlurCompute = false # MEASURED SLOWER 2026-10-25 (GTX 1070, 1080p: blur 0.20 vs 0.09 ms, smoothing 0.32 vs 0.11 ms incl. prepare), same picture: keep off. UNOFFICIAL (2026-10-25), needs NVR DXVK (does nothing on native D3D9 or stock DXVK): Ambient Light's two blur passes (across, then down) run as one Vulkan compute pass that keeps a tile of the picture in the graphics card's fast on-chip memory, instead of two passes through a half-resolution buffer. Same taps, weights and depth tests, the in-between result rounded to 16-bit as the buffer does: same picture. F10 times it as 'Ambient light blur X (half)' ('blur Y' then shows nothing). If it fails, the log says so and the D3D9 passes take over for the session. Applies immediately.
NvrDxvkReplacements = false # UNOFFICIAL (2026-10-24), needs NVR DXVK 1.2 (does nothing on native D3D9, stock DXVK or an older NVR DXVK): when a pixel shader is loaded and Data\Shaders\NewVegasReloaded\Compute\Replace\<shader name>.spv exists (for example Replace\SLS2001.pso.spv), that SPIR-V fragment shader runs in its place, with the game's textures, samplers and float constants still arriving (the .txt next to it lists which; docs\next\NVR-DXVK-EXTENSION.md). This is the route around ps_3_0's limits for the lit-object shaders (phase 2); no replacement ships yet, so with no Replace folder it does nothing. A missing or refused replacement leaves that shader as it is (logged). Read at load.
NvrSm6Shaders = false       # UNOFFICIAL (2026-10-26), needs NVR DXVK (does nothing on native D3D9 or stock DXVK): NVR's own effect passes that have an SM6 build (Data\Shaders\NewVegasReloaded\Compute\Sm6, made by tools\nvr-sm6 from the same .fx.hlsl the D3D9 path compiles) run from that SPIR-V instead of their ps_3_0 shader: no 224-constant, 16-sampler, 32-temporary or instruction limit, so a pass can do what ps_3_0 could not fit. First pass with an SM6 build: VolumetricFog's dedicated estimate and reconstruct (plain and composite), which on the fork also give the fog's sky colour the sky's horizon tint and saturation (did not fit in ps_3_0). A pass whose SM6 build is missing, stale (its .hlsl changed since the build) or refused keeps its D3D9 shader (logged once). Applies immediately.
NvrDxvkDisplacement = false # UNOFFICIAL, EXPERIMENTAL (2026-10-27), needs NVR DXVK 1.7-displace (does nothing on native D3D9, stock DXVK or an older NVR DXVK): the land gets real bumps from its own height maps (the ones its parallax reads) instead of only looking bumpy: near the camera every land triangle is split into many small ones through Vulkan tessellation and each point is moved up or down by the height, so stones and ruts get real outlines against the sky, real depth for fog, AO and reflections, and catch the sun's shadow edges. Strength, reach and detail in [Shaders.Terrain.Displacement]. Needs a game restart to turn ON (the land's shaders are registered with DXVK as they load); turning it off works at once. Since 2026-10-27 the bumps also cast sun shadows ([Shaders.Terrain.Displacement] CastShadows). Since 2026-10-28 rocks, cliffs and other objects with a parallax height map can get real bumps too ([Shaders.POM.Displacement], off by default; with this on their shaders are compiled for it at startup). Not yet: grass, decals and feet keep to the flat land.
LampMaskScissor = true   # UNOFFICIAL (2026-10-18), on: in-game check 330 scissored checks, 0 differing values in the skipped area, 28 inside at 1/65535 (same shader both ways): the lamp light mask (the point-shadow pass, run every frame outdoors and indoors) is drawn only inside the screen rectangle its lamps' light can reach, and not at all when no lamp reaches the screen (open country by day, lamps behind you); everywhere else it would write 0, which the buffer's clear already holds (up to about 0.15-0.37 ms at 1440p). Same picture. Applies immediately.
InteriorShadowFold = false # UNOFFICIAL (2026-10-18), off: indoors with the lamp shadows drawn on each object (Shadows Interiors > Forward, KeepDarkening on, DarkeningBlur off), applies the darkening of what no tracked lamp reaches inside the fog pass instead of in its own full-screen pass (F10 'Interior shadow apply'): -0.24 ms in the casino, -0.33 ms pass in the Ultra-Luxe (the fog pass +0.07 / +0.15). Same function, rounded the way the separate pass's 16-bit frame stores it (measured once per GPU). Off because a same-frame check (InteriorShadowFoldCheck) still finds a few pixels next to the void (gaps in a ceiling, the far plane) differing by a few 16-bit steps: about 50 pixels a frame in the casino, invisible but not bit for bit. Not while an effect between them reads the picture. Applies immediately.
InteriorShadowFoldRound = 0 # UNOFFICIAL DIAGNOSTIC: leave 0 (InteriorShadowFold rounds as this GPU stores 16-bit floats, measured once at the first interior: round toward zero on a GTX 1070). 1 = no rounding, 2 = round toward zero, 3 = round to nearest even: test only.
CubeFaceCopySkip = false # UNOFFICIAL (2026-10-18, off): with RedrawActorsOnly, a lamp cube face no moving caster reaches that still holds its walls-and-furniture copy is not copied again. Exact, but it saved nothing in the casino (people and wind-moved plants reach almost every face: 0 faces skipped per frame). Applies immediately.
CubeFaceCopySkipCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. N = every Nth frame up to two lamp cube faces that CubeFaceCopySkip left alone are read back and compared bit for bit with the static face they should equal (logged as CUBE FACE CHECK). Stalls the GPU.
CubeFaceViewCull = true # UNOFFICIAL (2026-10-18): indoors, a lamp whose shadow is redrawn every frame anyway (people or wind-moved plants in its reach, or a flickering light that moves) no longer draws the faces of its shadow cube map that no pixel on screen can look up (its reach wholly outside the view, with a margin; within 100 units of the camera always drawn). Those faces are drawn again as soon as they can be seen, and in full before the lamp's shadow is kept. Casino: F10 'Point shadow cubemaps' 2.04 -> 1.29 ms, frame -0.68 ms (-0.75 with people moving). Same picture (a test that fills the left-out faces with shadow showed nothing). Applies immediately.
CubeFaceViewCullCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = the faces CubeFaceViewCull leaves out are filled with "everything in shadow" instead of being left alone, so a face that is looked up after all shows as a dark area (test only: changes the picture where the culling would be wrong).
InteriorShadowFoldCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. N = every Nth frame in which InteriorShadowFold would apply, the frame is drawn the old way (separate pass) and the folded fog pass is drawn as well from the same input into a spare target; both are read back and compared bit for bit (logged as INTERIOR SHADOW FOLD CHECK). Stalls the GPU.
FogReferenceTest = 0 # UNOFFICIAL DIAGNOSTIC (2026-10-18, development builds only, release builds ignore it): leave 0. 1 = the volumetric fog is drawn with the original NVR fog's own shader (upstream master, technique FogReference) at full resolution in one pass, with the sun shadow and AO applies as passes of their own, as the original drew it: to compare ClassicLook with it on the same frame.
LampMaskScissorCheck = 0 # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every 8th frame in which LampMaskScissor cut the lamp mask, the result is read back and compared with the whole pass drawn as before (logged as LAMP MASK CHECK; the frame then uses the whole pass). Stalls the GPU.
SlimDepthBuffer = true      # UNOFFICIAL: store the effects' depth buffer as one 32-bit channel instead of two (the second is recomputed exactly), halving depth reads in every effect. Requires a game restart.
ReShadeDepthCompat = false  # UNOFFICIAL (2026-10-11), for ReShade users: keep the game's depth buffer attached while NVR's effects draw (they normally detach it briefly), and give up the two speedups that need it detached (the low-resolution two-target fog pass and SMAA's own stencil). Turns itself on while ReShade is loaded, whatever this says; set it only to try it without ReShade. Applies immediately.
ReShadeNVRDepth = true      # UNOFFICIAL (2026-10-15; 2026-10-18 also with ReShade as a Vulkan layer under DXVK), only does something with ReShade loaded: ReShade's depth buffer becomes a copy of NVR's, which holds your first-person gun and arms as well as the world (the game's own depth buffer loses them before they are drawn, so ReShade's depth effects shaded and blurred across them). Same direction as the game's depth buffer, so your RESHADE_DEPTH_INPUT settings stay as they are. Off: ReShade's Generic Depth picks the game's depth buffer as before. Applies immediately.
ReShadeBeforeHUD = true     # UNOFFICIAL (2026-10-15), only does something with ReShade loaded as d3d9.dll (not as a Vulkan layer): ReShade's effects are drawn right after NVR's, before the HUD, Pip-Boy and menus, instead of over them. Off: ReShade draws at the end of the frame as before. Applies immediately.
ReShadeUnderNVRMenu = true  # UNOFFICIAL (2026-10-25), only does something with ReShade loaded as d3d9.dll: while the NVR menu is open, ReShade's effects (bloom and the like) are always drawn under it, never on the menu itself. Covers the frames ReShadeBeforeHUD cannot (main menu, loading screens, some game menus, or ReShadeBeforeHUD off); there ReShade still draws over the game's HUD and menus as usual. Off: those frames get ReShade over the NVR menu as before. Applies immediately.
ReShadeDepthNearRemap = true # UNOFFICIAL (2026-10-18), with ReShadeNVRDepth: your first-person gun and arms sit closer than the world's near plane, so in ReShade's depth they came out as values past the nearest possible depth, which ReShade's depth decoding turns into negative distances (depth effects then misread or ignore the gun). On: only the depth of things closer than about twice the near plane (the gun, arms, a wall right in front of your face) is folded back into the valid range, keeping its order; every other pixel of the world is handed over exactly as before. Off: handed over unchanged. Applies immediately. (Map adapted from NVR Depth Bridge, MIT.)
ReShadeMenuGuard = false    # UNOFFICIAL (2026-10-18), for ReShade users: pause the ReShade effect files listed in ReShadeMenuGuardEffects while a menu or the Pip-Boy is open (for example lighting or depth-of-field effects that look wrong over menus). Only effects you have switched on are paused, they come back by themselves when the menu closes, and your ReShade preset is never changed. Applies immediately. (Idea from NVR Depth Bridge, MIT.)
ReShadeMenuGuardEffects = "" # UNOFFICIAL (2026-10-18), for ReShadeMenuGuard: the ReShade effect file names to pause, separated by commas, exactly as ReShade lists them (for example "MXAO.fx, DisplayDepth.fx"). Empty: nothing is paused. Applies immediately.
ReShadeMenuGuardVATS = false # UNOFFICIAL (2026-10-18), for ReShadeMenuGuard: also pause them in VATS. Off: VATS keeps them (the world is still shown there). Applies immediately.
ReShadeGameValues = true    # UNOFFICIAL (2026-10-25), only does something with ReShade loaded: ReShade effects that ask for the game's weather, time of day, worldspace or interior cell get them (the same names FNV ReShade Helper by doodlum and Wall_SoGB uses, so presets made for it work without that plugin). Effects that don't ask see no difference. Off: those effects get nothing, as without the helper. Applies immediately.
ReShadeDepthCheck = 0       # UNOFFICIAL DIAGNOSTIC (development builds only, release builds ignore it): leave 0. 1 = every 64th frame the depth handed to ReShade is made with and without ReShadeDepthNearRemap and both are compared in the log ('UNOFFICIAL ReShade depth check' lines; stalls the GPU). 2 = ReShadeMenuGuard acts as if a menu were open (for the auto-test, whose pictures cannot be taken in real menus). 3 = both.
WorldSceneGuard = true      # UNOFFICIAL: if the game stops rendering the world scene for 10 frames in a row (seen once after loading a save directly into an interior, where the image comes out almost black), skip NVR's effects until it starts again instead of running them on a stale depth buffer. Applies immediately.
MenuSceneGuard = true       # UNOFFICIAL (2026-10-20), with WorldSceneGuard: in a menu shown over a still picture of the world (the Pip-Boy), skip NVR's effects from the first frame instead of after 10. Those 10 frames ran the effects on the Pip-Boy itself, and the reflections of your surroundings took in its green screen and orange buttons: the Pip-Boy's glass then showed them as a blurred glow for as long as it stayed open. Over such a menu the game's own bloom is used (NVR's is not drawn there; its last one used to stay frozen on screen). Off: as before. Applies immediately.

[_Main.Main.RayTracing]
SceneRadius = 8192                   # UNOFFICIAL (2026-10-28), NVR DXVK + a GPU with ray tracing + NvrRtHelper.exe (Data\NVSE\Plugins\NvrRt\): the ray tracing core's scene holds the opaque static geometry (land and objects; not actors, alpha-tested or blended meshes, tree leaves, decals) of the loaded cells within this many units of the camera. It is only built while an RT effect is on ([Shaders.ShadowsExteriors.RT] Enabled). Larger: more geometry kept in the helper (GPU memory, a little build time when cells load). Live. docs\next\FORK-RT-CORE.md.
ActorUpdateInterval = 2              # UNOFFICIAL (2026-10-29), with Actors on: each actor is re-posed every this many frames (staggered), the frames between keep its last pose; 1 = every frame. Posing and rebuilding actors is most of the RT cost with people around. Live.
ActorRadius = 3000.0                 # UNOFFICIAL (2026-10-29), with Actors on: only actors this many units from the camera (horizontally) go into the ray tracing scene (each one is posed and rebuilt every frame; 3000 = about 43 m). Live.
Actors = false                       # UNOFFICIAL (2026-10-29), with an RT effect on: the actors (NPCs, creatures, the player's third-person body) go into the ray tracing scene too, posed every frame from their bones (their rigid parts like weapons as well), so the rays see people (RT sun shadows from actors). Costs a rebuild of each actor's structure every frame. Needs fork patch 0033 (d3d9.dll 1.8-rt-skin) and a helper restart (game restart).
AlphaTested = false                  # UNOFFICIAL (2026-10-29), with an RT effect on: alpha-tested meshes (foliage cards, fences, chain link, wires) go into the ray tracing scene too, tested against their diffuse alpha (64 x 64 a texture) by the RT passes that support it (RT sun shadows); without it they cast only through the shadow maps. Needs fork patch 0029 (d3d9.dll 1.8-rt-uv) and a helper restart (game restart). docs\next\FORK-RT-SUN.md.
HitTextures = false                  # UNOFFICIAL (2026-10-29), with an RT effect on: every textured mesh in the ray tracing scene keeps its texcoords and its diffuse texture (64 x 64 a texture, in a shared atlas), so the rays read the real colour where they hit (RT GI bounce, RT reflections) instead of the mesh's average colour. More geometry data (2 floats a vertex) and atlas uploads. Needs fork patch 0029 and a helper restart (game restart). docs\next\FORK-RT-CORE.md.
ArenaMB = 16                         # UNOFFICIAL (2026-10-28), with an RT effect on: the size of the shared image new geometry crosses to the ray tracing helper in, MB per frame. Geometry that does not fit waits for the next frames (a cell's objects then show up in the rays a few frames after it loads). Needs the helper to restart (a restart of the game, or a resolution change).

[_Main.Main.Quality]
MaxQuality = false        # UNOFFICIAL (2026-10-15), FOR SCREENSHOTS, needs a restart: every effect normally worked out at half or a quarter of the screen size runs at the full size, every reduced-quality shortcut is off, and quality settings go to their highest reasonable values (the list is in NewVegasReloaded.dll.maxquality.toml, which you can edit). Expect a much lower frame rate (often half or less). Your own settings are never changed: turn it off and restart to get them back exactly.
SmoothNormals = 0         # UNOFFICIAL (2026-10-23), CHANGES THE IMAGE when above 0, live: every effect works from a surface normal rebuilt from the depth buffer, so low-poly ground and rocks get one flat normal per triangle and the cloud shadows (SunFar), the sun shadows' face offset and the snow step at each triangle edge. A value r (pixels, try 72 = AmbientLight's NormalSmoothing 36 at half resolution) smooths the normals buffer once, right after it is drawn, for every effect that reads it: the same edge-aware averaging AmbientLight uses (creases and silhouettes are kept). About 0.2-0.3 ms at 1440p; with it on, AmbientLight's own NormalSmoothing is skipped (done already). 0 = off, as before.
CapturedNormals = true    # UNOFFICIAL (2026-10-28, tester macintroll's idea; on by default since 2026-10-28: a fix; needs a restart: the lit shaders are compiled with it), CHANGES THE IMAGE: every effect that works from the surface normal (ambient occlusion, AmbientLight, sun / cloud / far shadows, specular, snow...) takes the surfaces' own smooth normals, written by the surfaces while they draw, instead of one flat normal per triangle rebuilt from the depth buffer: no more facets on low-poly rocks and characters, no shadow crust on rocks. Surfaces NVR's shaders do not draw (the game's own shaders, see-through things, water, grass) keep the old normal (SmoothNormals above still applies to them). Works under NVR DXVK and native D3D9 (not with the game's own MSAA on native: as off there). Off = exactly as before.

[_Main.Main.ReducedQuality]
GodRaysLowRes = false       # UNOFFICIAL, CHANGES THE IMAGE: compute god rays at quarter instead of half resolution (4x fewer pixels). Rays get softer; thin shafts through foliage may shimmer when moving. Applies immediately.
AOLowRes = false            # UNOFFICIAL, CHANGES THE IMAGE: compute ambient occlusion at quarter instead of half resolution (4x fewer pixels). Corner shading gets softer and loses small creases; may look blotchier. Applies immediately.
PointShadowInterval = 1     # UNOFFICIAL, CHANGES THE IMAGE (only when above 1): redraw each point-light shadow cubemap (interiors, and exteriors with point shadows on) every N frames instead of every frame, 1-4. 1 = every frame, the original behaviour (the default since P49; earlier builds defaulted to 2). Each light's cubemap is redrawn at once when its light, position, radius or cell changes, and lights that only reach still objects keep their cubemap at any setting; in between, people and doors moving through the light cast shadows that lag up to N-1 frames, which can look like stuttering or flickering shadows on moving people. 2 cut the F10 'Point shadow cubemaps' timer by roughly 40% in one interior (about 1.2 ms GPU and 0.9 ms CPU, measured before P44 made still lights free). Applies immediately.
LampShadowMoveTolerance = 0.0 # UNOFFICIAL, CHANGES THE IMAGE (only above 0), indoors with the per-object lamp shadows: a lamp that moves less than this many units from where its shadow cube map was drawn (flickering fire lights jitter by about 0.6 units a frame, up to ~16 from where they started) keeps that cube map and casts its shadows from that point, instead of redrawing the whole cube map every frame. Shadows of such lights then hold still while the light flickers. Casino at 16: 'Point shadow cubemaps' -0.47 ms, frame -0.37 ms (7 fire lights). 0 = off (as before). Applies immediately.
CheapReflections = false    # UNOFFICIAL, CHANGES THE IMAGE: draw the water reflection map without NVR's per-object sun shadows and without terrain parallax, like the original game's reflections. Objects and ground seen IN the water lose their sun shadows and bumpy terrain detail; the game blurs the reflection, so the difference is usually small. Only matters where water is in view and the game reflects objects (bUseWaterReflections... in FalloutPrefs.ini). F10 timer: 'Water reflections (game)'. Applies immediately.
CheapUnderwaterTerrain = false # CHANGES THE IMAGE: ground below the water surface (lake and river beds, and everything when you are underwater) is drawn without terrain parallax (the fake 3D bumps) and its small shadows; you see that ground through moving, murky water. Only near water; dry ground keeps full parallax. Removes most of the frame-rate drop when wading or swimming (the terrain shader measured 51-78% cheaper on submerged ground; in one test standing in the Potomac, terrain cost 5.6 ms). Applies immediately.
ParallaxLite = false         # UNOFFICIAL, CHANGES THE IMAGE (slightly): cheaper parallax (the fake 3D bumps) on the ground and on objects that have it (many rocks, cliffs and walls). 8 search steps and one quick correction step at the found spot instead of 16 steps plus a second fine search; on the ground also 2 small-shadow samples instead of 4. The bumps can sit very slightly differently, most at grazing angles. In game (GTX 1070, 1440p): open desert terrain 3.7 -> 2.6 ms (about 81 -> 89 fps); rocky desert with many blended ground textures terrain 6.2 -> 4.1 ms (about 65 -> 73.5 fps). Switching it on also sets Shaders > Terrain > Parallax > MaxDistance once to 1024 units (about 15 m) at 1440p, 768 at 1080p, 1536 at 4K (only if it was longer), where the bumps are only a few pixels tall; that saved another 0.8 ms with no visible change. MaxDistance stays yours to change afterwards: raise it there for longer bumps and it is kept. Overrides HighQuality while on. Was TerrainParallaxLite in P60 (a saved value carries over). Applies immediately.
NearCascadeInterval = 1     # UNOFFICIAL, CHANGES THE IMAGE (only when 2): redraw the nearest sun-shadow cascade every 2nd frame instead of every frame, 1-2. Between redraws the cached cascade follows the camera's movement, so still shadows stay put; shadows of moving things (people, creatures, doors) lag one frame, and right after a very fast camera turn the newly visible area may use the softer next cascade for one frame. F10 timers: 'Sun cascade geometry', 'Shadow atlas prefilter', 'Sun cascades (CPU)'. Applies immediately.
StaggeredSunShadows = false # UNOFFICIAL, CHANGES THE IMAGE: redraw the middle sun-shadow cascade (with the default shadow settings roughly 3-9 m away) every 4th frame and the far and most distant ones every 8th, instead of every frame (the most distant one every 4th with ShadowsExteriors > ShadowMaps > LimitFrequency, the original). This was always on in P21-P48. Still shadows stay put, because a cached cascade follows the camera's movement, but people and creatures moving more than a few metres away get shadows that stutter and can flicker on their bodies. Saves roughly 0.5 ms GPU per frame outdoors (GTX 1070, 1440p) plus some CPU. F10 timers: 'Sun cascade geometry', 'Shadow atlas prefilter', 'Sun cascades (CPU)'. Applies immediately.
CachedDistantShadows = false # UNOFFICIAL, CHANGES THE IMAGE (slightly): like StaggeredSunShadows (middle sun shadows every 4th frame, far and most distant every 8th), but a cascade that has the shadow of a person or creature in it is redrawn every frame, so moving characters keep correct shadows (people close to you are handled by the nearest shadows, which are always redrawn). Still objects look the same; other moving things (doors, objects knocked around) far away can lag a few frames. Saves shadow work where no characters are around (up to about 1 ms in quiet places, GTX 1070 1440p); on busy streets like the Strip there is nearly always someone in range and it saves only about 0.1 ms. Ignored while StaggeredSunShadows is on. Applies immediately.
FXAA = false                # UNOFFICIAL, CHANGES THE IMAGE: lean FXAA edge smoothing (about 0.15 ms at 1440p vs about 1 ms for SMAA). Meant to replace SMAA: turn SMAA off (Shaders > SMAA) when using it. Slightly softer than SMAA, weaker on thin distant detail. The game's own MSAA (iMultiSample in FalloutPrefs.ini) is not touched. Applies immediately.

[_Main.Main.Precipitations]
RemovePrecipitations = false   # Disables vanilla rain and other precipitations.

[_Main.Main.Water]
ForceReflections = true     # Always render the full world in reflection for HD reflections.
RemoveUnderwater = false    # Disables fog underwater. Not compatible with custom underwater shader.
ReflectionClipFix = true # UNOFFICIAL, BUG FIX (on by default): water reflections lost the far buildings and showed below-water ground when you looked level or up. The game sets the reflection's water-height clip plane once, before the reflection pass binds a vertex shader, and the driver then applies it wrongly to that pass's draws; NVR re-issues the same plane at every draw of the pass so it takes. Off = the game's behaviour. Applies immediately.

