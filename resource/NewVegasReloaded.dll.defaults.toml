[_Main.Menu.NewInPatch]
NewSince = "2026-10-16"      # UNOFFICIAL, hidden in the menu and read from this file only (never saved to your own settings): the menu tab "New in this patch" lists every setting whose description in this file holds a date (like "(2026-10-17)") on or after this day. It is the day after the last release played (P80 update 3, 2026-10-15). Change it here when a new patch ships. Empty = no date rule.
