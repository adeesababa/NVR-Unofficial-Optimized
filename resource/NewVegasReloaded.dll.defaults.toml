[_Shaders.WetWorld.Main]
FastPaths = true                    # UNOFFICIAL (2026-10-17): the same rain picture for about 1 ms less GPU time (2560x1440): the wet pass's early exits (sky, distance, water, dry or roofed ground, your weapon), its puddle colour and its lamp loop really skip work (the shader compiler had turned them into work every pixel did). Measured: within the frame-to-frame rain flicker; the only place it can differ is the puddle reflection's rare screen-edge cases. Off = the original pass. Applies immediately
FixedReflectionTrace = false        # UNOFFICIAL (2026-10-17): fixes the puddle reflection (the screen-space trace of WetWorld). Its loop exits never worked on the GPU, so it kept the last hit it found at full strength, ran past the screen border and flipped under any recompile. Fixed: the first hit counts, rays that pass behind a thin object are no hit, and the reflection fades out towards the screen borders and with distance. Looks slightly different (softer, no border patches), so it is off by default. Costs about 0.1-0.2 ms in rain. Applies immediately
KeepHighlights = true               # UNOFFICIAL (2026-10-16): in rain the wet pass no longer cuts the picture at full white before the tonemapper (sun, bright sky and wet highlights keep their soft roll-off). Off = the old clamp. Applies immediately
HudDrops = 1.0                       # [0.0-1.0] UNOFFICIAL: rain drops on your first-person weapon while you stand in the rain (not under cover), drying off afterwards (after mrfury97's HUD raindrops). Each drop is a little lens: it magnifies the surface under it, focuses the sun into a bright spot and catches a glint. 0: off (restart to switch on or off: it is compiled into the object shaders).
HudDropSize = 0.6                    # [0.05-20] Size of a drop's cell in game units (the biggest drops are about three quarters of it across).
HudDropDensity = 0.6                 # [0.0-1.0] How many drops gather at full wetness.
HudRefraction = 1.0                  # [0.0-4.0] How strongly a drop magnifies the surface under it.
HudReflection = 1.0                  # [0.0-8.0] How rounded the drops look: how much they tilt the surface's highlights.
HudGloss = 0.8                       # [0.0-1.0] How glossy the drops are.
HudWetGloss = 0.3                    # [0.0-1.0] How much glossier the wet surface between the drops gets.
HudWetTime = 20.0                    # [0.5-600] Seconds in heavy rain to wet through (lighter rain takes longer).
HudDryTime = 45.0                    # [0.5-600] Seconds to dry off under cover, indoors or after the rain.
HudDebug = 0                         # 1: keep the weapon wet without rain, to try it out.
Amount = 0.0                        # Darkness of puddles
Decrease = 0.0                      # Time it takes in game hours for puddles to dissipate
Increase = 0.0                      # Time it takes in game hours for puddles to appear
PuddleCoeff_B = 0.48                # Not used.
PuddleCoeff_G = 0.62                # Not used.
PuddleCoeff_R = 0.72                # Not used.
PuddleSpecularMultiplier = 0.2      # Not used.

