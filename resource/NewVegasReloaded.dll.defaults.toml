StrengthRed = 0.48                  # How much of each colour scatters. Red scatters most, which gives skin its warmth.
StrengthGreen = 0.41
StrengthBlue = 0.28
FalloffRed = 1.0                    # How wide each colour spreads within the blur, 0-1 (above 1 is clamped: it breaks the blur into dots). Use Width to spread further.
FalloffGreen = 0.37
FalloffBlue = 0.3
PerPixelWidth = 1.0                 # Per-pixel diffusion from curvature, used only where the screen-space blur cannot reach (first-person arms, reflections, fading actors) or when ScreenSpace is off. 0 is plain shading.

