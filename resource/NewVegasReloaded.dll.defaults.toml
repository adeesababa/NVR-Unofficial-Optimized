[_Shaders.AmbientOcclusion.GTAO]
Enabled = false                      # UNOFFICIAL (2026-10-16): ground-truth ambient occlusion (GTAO, Jimenez et al. 2016) instead of the old SSAO: open flat ground is no longer greyed, corners and creases darken by how closed they really are, no halo round things in front. Uses the same Range, strength and fade settings. Applies immediately
MaxRadius = 64.0                     # [4-256] Largest search radius on screen, in pixels (close up the Range would cover half the screen)

[_Shaders.AmbientOcclusion.Skylighting]
Enabled = false                        # UNOFFICIAL (2026-10-17, new): outdoors, the sky's light is taken away where something above blocks the sky: under roofs, porches, bridges, overhangs and at the foot of cliffs. Uses a top-down map of the world round you and needs the ambient occlusion or (UNOFFICIAL 2026-10-20) AmbientLight on. Version 2 takes away only the sky's share of the light, so sunlit spots keep their sunlight.
Version = 2                            # UNOFFICIAL 2026-10-17: 2 = the sky's share only, its own clean and rarely redrawn map, quarter resolution (about 0.1-0.2 ms); 1 = the first version (darkens through the ambient occlusion, whole pixel, map redrawn every 4th frame).
Strength = 1.0                         # [0.0-1.0] How much of the blocked sky light is taken away.
Distance = 800.0                       # [64-4000] How far (game units) to look for something above. Larger: big overhangs and cliffs count from further away; smaller: only close cover. (Version 1 was tuned at 600.)
ShareApply = true                      # Version 2: take away only the sky's share of the light (false: the whole pixel, as a comparison).
OpenThreshold = 0.85                   # [0.5-1.0] Version 2: a spot that sees at least this much of the sky counts as open (no change), so open ground next to buildings keeps its light. 1.0: every bit of blocked sky counts.
DepthNormals = false                   # Version 2: work out the surface's slope from the depth (false: from the normals buffer, which is wrong on some road meshes and ground stains).
OwnProjection = false                  # Version 2: draw its top-down map with its own straight-down projection round you (false: the rain map's projection).
AmbientScale = 1.0                     # [0-10] Version 2: how strong the sky light is against the sun when the sky's share is worked out. Higher: sunlit surfaces under partial cover darken more.
CleanMap = true                        # Version 2: the top-down map takes leaves and fences with their holes and leaves out see-through effects (dust devils, glass), which would block the sky over open ground.
MapRefresh = 60                        # [1-100000] Version 2: frames between redraws of the top-down map while you stand still (cells that stream in). It is also redrawn when you move MoveRefresh units.
MoveRefresh = 200.0                    # [1-100000] Version 2: how far (game units) you move before the top-down map is redrawn.
SoftWidth = 40.0                       # [1-500] Version 2: how soft (game units) the edge of cover is in the test (against hard steps).
DebugView = 0                          # Version 2, test views: 1 sky visibility, 2 the sky's share of the light, 3 the final darkening, 4 'covered' (something above the point in the map). 0 = off.
Reflections = false                    # UNOFFICIAL (2026-10-19) Skylighting step 3: the sky's reflection also goes where the sky cannot be seen, so wet floors, puddles and shiny ground under roofs, porches and overhangs stop mirroring a bright sky (the Specular effect's sky reflection and the wet-ground reflections' sky). Needs Skylighting Version 2 on. Costs next to nothing. After Community Shaders' Skylighting (GPL-3.0).
MinReflection = 0.1                    # [0-1] (2026-10-19) How much of the sky's reflection stays where the sky is fully hidden (Community Shaders' default 0.1).
LightCap = 0.1                         # [0-10] UNOFFICIAL (2026-10-20): the most light Skylighting may take from a spot, in multiples of the sky's light (x Strength x how much of the sky is hidden), so lamp-lit walls and glowing signs and bulbs under a roof or canopy keep their own light (the sky can only take the light it gave). 0.1 keeps lamps and glow and changes nothing in daylight; 0 = no limit (before 2026-10-20: a wide canopy at dusk turned everything under it, the bulbs too, black). Applies immediately.
OpenSides = 1.0                        # [0-1] UNOFFICIAL (2026-10-20): under a canopy, porch roof or bridge the sky test cannot see the open air at its sides, so it counted every spot under a wide cover as seeing no sky at all. 1 = for such a spot the low sky counts as open wherever nothing taller than the spot stands at the test's reach (an open-sided canopy keeps its side light; a cliff or the house beside a porch still blocks). 0 = as before (stronger darkening under covers). Applies immediately.

[_Shaders.AmbientOcclusion.RT]
Enabled = false                        # UNOFFICIAL (2026-10-28, NVR DXVK fork, ray tracing): ambient occlusion and sky visibility from rays traced against the real scene instead of the screen: what is off screen, behind the first surface or thinner than it looks still darkens, and no light leaks through walls. Takes the place of the screen estimate of AmbientLight (or of this AO when AmbientLight is off) and of Skylighting's top-down map; the strength and fade settings stay theirs. Needs the NVR DXVK d3d9.dll with ray tracing, [Main.Main.Performance] NvrDxvkPasses on and a GPU with ray queries (AMD RDNA2+, NVIDIA RTX, Intel Arc); anywhere else it does nothing and the current AO runs (logged once). Applies immediately
RayCount = 4                           # [1-16] Rays per pixel (half resolution) and frame for the occlusion. More: less grain before the blur and history smooth it, cost grows with the count. Applies immediately
Distance = 120.0                       # [8-1000] How far (game units, about 70 = 1 m) a ray looks for something that occludes. Longer: broader, softer occlusion (under cars, in rooms); shorter: contact shadows only, cheaper. Applies immediately
Sky = true                             # The sky visibility (Skylighting, which must be on) from rays too, instead of its top-down map: overhangs, bridges and the inside of buildings block the sky by their real shape. Applies immediately
SkyRays = 16                           # [8 or 16] Rays per pixel for the sky visibility (fixed directions round the normal: no grain, no flicker). 8: one ring, cheaper. Applies immediately
SkyDistance = 800.0                    # [64-8000] How far (game units) a sky ray looks for cover (Skylighting's Distance). Applies immediately
DebugView = 0                          # Test views: 1 the ray-traced visibility alone, before strength (through AmbientLight's occlusion view, or as this AO); 2 the ray-traced sky visibility (through Skylighting's view 1); 3 black where rays began inside something (depth and scene disagree), else grey by the mean hit distance; 4 and 5 (test only) the rays' input: view distance / 2000 and the normal's up component (white up, black down, grey sideways). 0 = off.

[_Shaders.AmbientOcclusion.FastPaths]
Enabled = true                         # UNOFFICIAL (2026-10-17): the same ambient occlusion for less GPU time outdoors: sky and distant pixels really skip the occlusion samples and both blurs (the shader compiler had turned that early exit into work every pixel did). Off = the original passes. Applies immediately

[_Shaders.AmbientOcclusion.Status]
Enabled = true                          # Shadows based on object proximity/creases for more realistic light contribution.

[_Shaders.AmbientLight.Main]
Radius = 250.0                      # UNOFFICIAL: how far the occlusion and the bounce reach, in world units (about 70 = 1 m).
OcclusionStrength = 2.5             # [0-4] How dark creases, corners and the ground under things get.
DrawDistance = 6000.0               # Distance from the camera where the effect has faded out.
DarkestOcclusion = 0.25             # [0-1] The darkest the occlusion may make a pixel (as AmbientOcclusion's ClampStrength).
BrightnessFade = 0.7                # Bright surfaces keep their light: the occlusion fades out above this brightness (as AmbientOcclusion's LumThreshold).
BlurRadius = 1.0                    # [0.5-4] Smoothing of the grain, in half-resolution pixels per step (x3 each way).
GridBounce = 0.0                    # UNOFFICIAL, EXPERIMENTAL: the sun's bounce light from a 3D light grid round you (light propagation volume), outdoors in daylight. It is AmbientLight's bounce light: it does not depend on what is on screen, so it neither shimmers nor comes and goes as you turn; soft (room-sized) light. Indoors and at night it takes the light of lamps and neon seen on screen (GridScreenStrength). 0 = no bounce light (nothing extra drawn).
GridCellSize = 200.0                # [50-800] Size of one grid cell in world units (32 x 32 x 16 cells round you: 200 covers about 90 x 90 x 45 m). Smaller = finer but shorter reach.
GridSteps = 8                       # [1-16] How many cells the light spreads from what it bounces off.
GridSpread = 0.3                    # [0-0.6] How much light passes on from cell to cell each step.
GridScreenStrength = 6.0            # [0-40] Indoors and at night (no sun): how strongly the light surfaces show on screen (lamps, neon, fire) feeds the grid. It remembers what it saw, so the bounce stays when you turn away.
GridBlocking = 1.0                  # [0-4] How much walls and other surfaces stop the grid's light passing through them (0: light leaks through everything).
GridWallMemory = true               # UNOFFICIAL (2026-10-22): indoors and at night the grid also remembers the walls and floors it has seen on screen, so GridBlocking stops the light there too (before, it only knew surfaces outdoors in daylight, and a lit room's light crossed the wall into the next). Off = as before. Applies immediately.
GridLamps = 8.0                     # [0-40] UNOFFICIAL (2026-10-22): indoors and at night the game's lamps light the walls and floors the grid remembers (GridWallMemory), and that light bounces round the room: soft light pooling round lamps, stopped by walls. Before, the grid only had the light it saw on screen, which barely showed. 0 = off, as before. Applies immediately.
GridFine = true                     # UNOFFICIAL (2026-10-22): outdoors in daylight, a second, four times finer grid round you (about 16 x 16 x 8 m) for the sun's bounce light: light and shade the size of a door or a car near you instead of a room, fading into the coarse grid further out. Made from the same sun map (no extra drawing); off = the coarse grid alone, as before. Applies immediately.
GridColour = 0.25                   # [0-1] UNOFFICIAL (2026-10-18): how much of the colour of what lights the room the bounce light carries (1: all of it - a fire-lit room turns orange; 0: white light). Applies immediately.
InteriorBalance = true              # UNOFFICIAL (2026-10-18): indoors the room keeps its own brightness: the occlusion darkens only the ambient light (not the lamps' light), and the bounce gives back at most the light the occlusion takes (InteriorBounceShare), so light moves from creases to the surfaces next to lit ones instead of lifting the whole room. Off = as P81 (the bounce added on top of the room's own ambient: interiors much brighter). Outdoors it changes nothing. Applies immediately.
InteriorBounceShare = 1.0           # [0-4] UNOFFICIAL (2026-10-18): with InteriorBalance, how much of the light the occlusion takes the bounce may give back indoors (1 = the room's average brightness stays as without AmbientLight; 0.5 = a little darker; above 1 = brighter, at most what GridBounce gives). Applies immediately.
NoEdgeOutline = true                # UNOFFICIAL (2026-10-21): no thin light outline round things. The rule that keeps the occlusion from shimmering on grass took the edge of every object for grass, so a line round every character, table and booth kept only a quarter of its darkening (most visible in dim rooms). On: only depth that is busy over several pixels (grass, bushes) counts, the same picture everywhere else. Off = the old look. Applies immediately.
NormalSmoothing = 36                # [0-64] UNOFFICIAL (2026-10-21): the surface direction the occlusion and Skylighting work from is rebuilt from the depth buffer, so every triangle of a low-poly rock gets one flat direction and the darkening cut off hard along its edges (one face dark, the next light; at night with Skylighting whole faces went black). The direction is averaged over the half-resolution pixels this far round each one (3 taps each side along x, then along y), only where they lie on the same surface: object edges and real corners keep theirs. 0 = off, as before. Applies immediately.
NormalSmoothingWorld = 0.0           # [0-64] UNOFFICIAL (2026-10-24), OPTIONAL, live (not the cause of the 2026-10-24 facets; 8 is a sensible value): the same smoothing, at least this many world units wide (about 70 = 1 m). NormalSmoothing is in screen pixels, so close to the camera, where a character's triangles are hundreds of pixels across, it covered only a thin band at each edge and the faces stayed flat with hard edges (indoors above all, where this effect shades the ambient light characters are lit by). 8 spans a couple of a character's triangles at any distance; small creases keep their own occlusion (it comes from the depth, not the direction). 0 = pixels only, as before.
HorizonBias = 0.0                   # [0-45] UNOFFICIAL (2026-10-21): degrees a neighbouring surface must rise above a pixel's own before it counts as hiding the sky (HBAO's angle bias). Measured no help on the rock faces (it only lightens creases a little), so off; try 10-15 for softer shallow creases. Applies immediately.
HiZ = 0                            # [0-6] RETIRED 2026-10-26, does nothing (measured no win). UNOFFICIAL (2026-10-26), needs NVR DXVK and NvrDxvkPasses (does nothing on native D3D9 or stock DXVK): the far occlusion samples read a coarse level of the shared depth pyramid (Hi-Z, built once a frame in one compute pass) instead of the half-resolution buffer, so neighbouring pixels share a few cached texels. A sample at least 2^(HiZ+1) half-resolution pixels away reads the coarse level (3: 16 pixels and more). Slightly darker far creases (the coarse level keeps the nearest depth). 0: off (as before). Applies immediately.
Temporal = true                     # UNOFFICIAL: keeps the occlusion from frame to frame (moved with the camera) and turns its sample pattern every frame, so its grain averages out instead of crawling. Off: each frame on its own.
ComputeGI = false                   # UNOFFICIAL (2026-10-27), EXPERIMENTAL, needs NVR DXVK with [Main.Main.Performance] NvrDxvkPasses on (does nothing on native D3D9 or stock DXVK): the occlusion's own search also gathers one bounce of light from what is on screen (screen-space GI, "visibility bitmask"): a lit wall tints the floor and corners next to it, a sunlit ground lights the shaded side of rocks and posts. The occlusion itself stays as it is. Adds to the light grid (GridBounce), which keeps the light from what is off screen. Off = exactly as before. Applies immediately.
ComputeGIStrength = 1.0             # [0-4] UNOFFICIAL (2026-10-27), with ComputeGI: how much of the bounced light is added (1 = one physical bounce off what is on screen; 0 = none: at ComputeGIQuality 0 the same picture as ComputeGI off, for comparing the cost). Applies immediately.
ComputeGIThickness = 100.0          # [5-500] UNOFFICIAL (2026-10-27), with ComputeGI: how thick things are taken to be, in world units (about 70 = 1 m): a surface in front gives its light (and, with ComputeGIThinOcclusion, its shade) only for what lies within this depth behind it, so a thin post in front of a lit wall does not hide the wall's light. Smaller = thin things block less, but walls seen at a slant let more through. Applies immediately.
ComputeGIThinOcclusion = false      # UNOFFICIAL (2026-10-27), with ComputeGI, EXPERIMENTAL: the occlusion from the same thickness rule too, so thin things (poles, chair legs, railings) no longer darken everything behind them (no dark halo round them). Off = the occlusion exactly as AmbientLight's own. Applies immediately.
ComputeGIQuality = 0                # [0-2] UNOFFICIAL (2026-10-27), with ComputeGI: how many samples each pixel takes (for the occlusion and the bounce light alike): 0 = 16 (AmbientLight's own), 1 = 36, 2 = 64. More = smoother, steadier bounce light and occlusion, but the cost grows faster than the samples (Lucky 38, 1080p, whole effect: about +0.25 ms at 0, +1.9 at 1, +3.5 at 2; F10 'Ambient light estimate (half)'): keep 0. Applies immediately.
ComputeGITest = 0                   # [0-2] UNOFFICIAL (2026-10-27), TEST ONLY: 1 = ComputeGI's estimate pass alone (AmbientLight's own accumulate and apply after it), 2 = its estimate and accumulate (AmbientLight's own apply). With ComputeGIStrength 0 each must give the picture of ComputeGI off. 0 = normal.
DebugView = 0                       # 7: the light grid's bounce alone. 0 off, 1 the occlusion alone (white open, black hidden), 2 the bounce light alone; 3-6 diagnostics (normal, depth, reach, raw values); 8 the grid's screen memory; 9 the grid's light before the surface colour; 10 the surface colour the bounce is multiplied by; 11 (2026-10-21) where the grass rule lifts the occlusion (white); 12 (2026-10-22) the walls the grid knows in each cell (red, green, blue: across east-west, north-south, up-down); 13 (2026-10-27, with ComputeGI running) ComputeGI's bounce light alone, as it arrives (x ComputeGIStrength, before the surface colour; without ComputeGI: as 12).

