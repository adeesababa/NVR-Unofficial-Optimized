Darkness = 0.65                      # Darkness of shadows.
Doors = true                         # Wether to include objects with "Doors" flag when rendering shadowmaps.
Furniture = true                     # Wether to include objects with "Furniture" flag when rendering shadowmaps.
LightPoints = 24                     # How many lamps can cast shadows at once (24 = default). UNOFFICIAL: indoors with forward shadows ([Shaders.ShadowsInteriors.Forward] Enabled) up to 64; each lamp past 12 needs about 6 MB of video memory at ShadowCubeMapSize 512 (12 MB with people near it, RedrawActorsOnly) and about 0.3-0.4 ms whenever its shadow is redrawn whole (lamps with nothing moving near them are drawn once; with RedrawActorsOnly, lamps with people near them redraw only the people). Outdoors, and indoors without forward shadows, at most 12.
ExteriorLightPoints = 12             # UNOFFICIAL (2026-10-13) [0-44]: OUTDOORS, how many lamps cast shadows (needs [Shaders.ShadowsExteriors.Main] UsePointShadowsDay/Night on). 12 = as before. Above 12 the shadow pass is drawn in batches of 11 lamps (about 0.3 ms each at 1440p) and each lamp needs a shadow cube map (about 6 MB at ShadowCubeMapSize 512, plus its drawing whenever things near it move).
LightRadiusMult = 1.5                # A muliplier for the lights radius to render shadows for.
MinRadius = 10.0                     # Wether to include objects with a radius of less than x pixels on the screen in the shadowmaps.
Misc = true                          # Wether to include objects with misc flags when rendering shadowmaps.
NearFade = 0.0                       # UNOFFICIAL [0-128]: things within this many world units of a lamp (about 70 to a metre) cast less of a shadow from it, none at the lamp itself. Standing right at a lamp made your shadow fill the room, sharp and black, sometimes on several walls at once. A real lamp's shadow from that close is too blurred to see. 0 = as before.
EdgeFade = 0.0                       # UNOFFICIAL [0-0.9], OFF (0 = exactly as before): fades each lamp's lit disc, and the shadows in it, out over this fraction of its radius instead of ending on the hard circle where a bright lamp's clamped light amount drops. 0.4 was tried on 2026-10-07 and darkened the ring round every lamp (with forward shadows on this mask is the room darkening), so it is off; see LampReachMask for the cure. Applies immediately.
LampReachMask = false                # UNOFFICIAL, CHANGES THE IMAGE indoors (2026-10-07): the darkening pass faded each lamp out with its own falloff on top of the game's lamp lighting, which already fades, so the floor past a certain distance was darkened twice and a shadow on it seemed to stop at a circle. On: a lamp counts in full out to its game radius and fades over the rest of its LightRadiusMult reach (the game's own light does the fading), so its shadows show in full; the outer part of each lamp's reach is a little brighter than before. Applies immediately.
PlayerInsideLamp = true           # UNOFFICIAL, BUG FIX: a lamp whose light point sits inside your body (or within PlayerLampMargin of it) leaves you out of its shadow cube map. A point inside a model is blocked on every side, so without this the player threw room-sized shadows onto every wall when walking through a light that has no fixture. Applies immediately.
RedrawActorsOnly = true              # UNOFFICIAL: a lamp with people (or wind-blown leaves) in reach draws its walls and furniture into its shadow once and keeps them; each refresh copies that and redraws only the people on top. Off = the whole shadow is redrawn every refresh, as before. Same image either way.
PlayerLampMargin = 16.0              # [0-64] How close (world units, about 70 to a metre) a lamp may come to your character before it counts as inside.
Quality = 1                          # Not currently used.
ShadowCubeMapSize = 512              # The resolution of one face for the point light shadow cubemaps.
Statics = true                       # Wether to include objects with "Statics" flag when rendering shadowmaps.
TorchesCastShadows = true            # Used in Oblivion to enable shadows on torches.
DrawDistance = 4000                  # Max distance for point light shadow rendering.
PlayerShadowThirdPerson = true       # Enable shadows for Player Model in third person in pointlights shadows
PlayerShadowFirstPerson = false      # Enable shadows for Player Model in first person in pointlights shadows

[_Shaders.ShadowsInteriors.Forward]
Enabled = true                       # UNOFFICIAL: indoor lamp shadows drawn on each object, lamp by lamp, instead of one dark mask over the finished picture: a lamp's shadow takes away only that lamp's light, so lamp glow, lit windows and the room's ambient light stay bright and two lamps on a wall each cast their own shadow. Needs a restart (the indoor shaders are compiled once, then cached).
Strength = 1.0                       # [0.0-1.0] How dark a lamp's shadow is (1 = none of its light). 0 = the old screen-space shadows again, live, to compare.
Softness = 0.4                       # [0.0-2.0] 0 = sharp shadow edges (cheapest). About 0.75 = softer edges, about 1-2 ms slower in busy rooms.
Quality = 1                          # UNOFFICIAL (2026-10-10) [0-3]: how smooth lamp shadow edges are (with Softness above 0). 0 Low = one lookup, sharp edges (cheapest, as Softness 0). 1 Medium = 4 lookups, as before. 2 High = 10, smoother edges. 3 Ultra = 20, smoothest. Applies immediately.
ContactHardening = false             # UNOFFICIAL (2026-10-10): lamp shadows sharp where an object touches what it shadows (a chair leg on the floor) and blurred by Softness further away. Indoor lamps only; the sun has its own [Shaders.ContactHardening]. Needs Quality 1 or more. Off = as before. Applies immediately.
ContactHardeningStrength = 2.0       # [0.0-8.0] How fast the shadow softens with distance from the object casting it. Higher = soft sooner.
ContactHardeningMinSoftness = 0.2    # [0.0-1.0] How sharp the edge is right at contact, as a share of Softness (0 = razor sharp).
Bias = 0.018                         # [0.0-0.1] Keeps surfaces from shadowing themselves (speckles). Raise a little if lit walls show dark speckles.
NormalOffset = 0.0                   # [0.0-4.0] Another cure for speckles, pushing the lookup off the surface. 0 = off.
FirstPerson = true                   # Shadows on your weapon and arms too.
KeepDarkening = true                 # Keep the old darkening of what no tracked lamp reaches (rooms keep their mood). Off = brighter unlit corners, and about 0.8 ms saved.
DarkeningBlur = false                # Blur that darkening as the old pass did (about 0.9 ms more).
LampSwitchMargin = 0.2               # [0.0-0.9] Only so many lamps can cast shadows at once (LightPoints); they are picked by distance. A lamp that already has a shadow keeps it until another is this much nearer (0.2 = 20%), and while it is a little behind you, so shadows stop popping on and off as you walk and turn. 0 = pick purely by distance, as before.
FadeIn = 0.0                         # [0.0-2.0] Seconds a lamp's shadow takes to fade in when the lamp gets one, instead of popping in. 0 = at once, as before.
LampRanking = 1                      # 1: lamps get shadows by how much of the scene they light (brightness x reach / distance), so a big room lamp is not pushed out by small bulbs near you as you move. 0 = the nearest lamps, as before.
KeepLampsInView = true               # UNOFFICIAL, BUG FIX (2026-10-08): the game lights each object only with the lamps it thinks are in view, and its test dropped lamps whose light was still on screen: turning the camera, their light and shadow popped off and on across whole mesh pieces (forward shadows live in each object's own lamps; the old screen-space shadows hid it). Lamps whose light reaches the view now stay. false = the game's test alone.
CameraIndependent = true             # UNOFFICIAL (2026-10-08): lamps get shadows by where you are, not where you look. A busy room has far more lamps than shadow slots (the Tops: 50-70 for 11), and picking them by the view swapped them as you turned: shadows and whole floor pieces popped at the edges of the screen. Now only walking changes them. false = the view test, as before.
FillLightRadius = 1000               # UNOFFICIAL (2026-10-08) [0-4000]: lamps that reach farther than this (game units) are a level's big fill lights, placed up near the ceiling to light a whole area; FillLightShadowStrength decides their shadows. 0 = no lamp counts as one.
FillLightShadowStrength = 0.5        # UNOFFICIAL (2026-10-08) [0.0-1.0]: how dark fill lights' shadows are. 0 = none (they light as before; at full strength a fill light's ceiling and the staircases under it blacked out whole floor pieces, and they take shadow slots from real lamps). 0.5 = half: staircases, tables and people still shade the floor under them. 1 = full, like a real lamp.
LogLamps = false                     # DIAGNOSTIC, for finding faults: write to the log every lamp that gains or loses its shadow, and why.
ScopeFix = true                      # B42 Optics (picture-in-picture scopes): no lamp shadows (indoors) or sun shadows (outdoors) on the scope's lens or in the scope's picture, where they would land in the wrong places (it is drawn from another camera). Off = as before.
DebugView = 0                        # 1: the light a shadow takes away is drawn in the lamp's own colour instead. 2: each lamp that casts shadows tints what it lights in its colour. 3 (diagnostic): only the red lamp's shadow map, read at every pixel whatever lamps the object has: red = blocked, pale colours = the six sides of its shadow map, a checker every 64 units, objects that lamp does not light at a third of the brightness. 0 off.

[_Shaders.ShadowsInteriors.Status]
Enabled = true                      # Post process pointlights shadows in exteriors.

[_Shaders.BounceLight.Main]
Strength = 1.5                      # UNOFFICIAL, optional: how much light bounces from lit surfaces onto nearby ones (0 = none).
Radius = 150.0                      # How far the bounce reaches, in world units (about 70 = 1 m).
DrawDistance = 6000.0               # Distance from the camera where the effect has faded out.
BlurRadius = 1.5                    # Smoothing of the bounce's grain, in pixels (x6 each way).
QuarterResolution = true            # Works the bounce out on a quarter of the pixels instead of half (about 1.2 instead of 1.9 ms at 1440p on a GTX 1070, no visible difference). Off = half resolution.
OffScreenLight = 1.0                # UNOFFICIAL: light for bounce samples that land off the screen (or behind your weapon), guessed from the ambient light and what is seen nearby, so the bounce no longer fades out toward the screen edges. 0 = off (they add nothing, as before).
MultiBounce = 1.0                   # UNOFFICIAL: more than one bounce: the bounce light each surface shows is passed on again the next frame (1 = all of it, up to 2). Subtle, mostly in corners. 0 = one bounce, as before.
Temporal = true                     # UNOFFICIAL: reuses last frame's bounce (moved with the view, dropped where something moved in front): less grain, steadier, light from things just turned away from fades out instead of vanishing. Off = as before.
HalfSamples = false                 # UNOFFICIAL: with Temporal, half the samples each frame: about 0.03 ms cheaper at 1440p, a little more shimmer while turning.
HardEdges = true                   # UNOFFICIAL: the bounce light never crosses the edge of a thing in front of a lit wall (pillars, posts and palms took the wall's light: a blurry glow drawn over them). Off: the softer blend from before. Applies to the Plus and Temporal modes.

[_Shaders.BounceLight.Status]
Enabled = false                     # UNOFFICIAL, optional: one bounce of indirect light from what is on screen (colour bleeding, more natural shading). About 1 ms GPU at 1440p when on (F10 'Bounce light'); nothing when off.

[_Shaders.ContactHardening.Main]
SunSize = 1.0                        # UNOFFICIAL, optional: how soft far shadow edges get, as a multiple of the real sun's size (1 = realistic). Higher values can show aliasing.
MaxSoftness = 4.0                    # Cap on the blur, in shadow map texels (1-32). Higher allows softer edges under tall objects but costs more and can show aliasing.

[_Shaders.ContactHardening.Status]
Enabled = false                      # UNOFFICIAL, optional: sun shadows sharp where an object meets the ground and softer the further they fall from it. Needs a game RESTART the first time it is turned on (compiled into the shaders only then, so off costs nothing); after that the switch works live. Needs ForwardShadows.

[_Shaders.Sharpening.Main]
Clamp = 0.1
Offset = 2.0
Strength = 0.75

[_Shaders.Sharpening.Interiors]
Clamp = 0.1                         # UNOFFICIAL: the same settings for interiors (Main is outdoors).
Offset = 2.0
Strength = 0.75

[_Shaders.Sharpening.Status]
Enabled = false                     # Edge contrast shader to increase detail sharpness.

[_Shaders.HeatHaze.Main]
Strength = 2.5                         # [0.0-8.0] How far the haze displaces the image at its hottest, in pixels (at 1080p). It follows the heat: zero at night, building from sunrise to PeakHour, fading to zero by sunset; full in clear weather, CloudyScale of it when cloudy, none in rain or snow or while the ground is still wet.
StartDistance = 1500.0                 # [0-20000] No haze nearer than this (game units), so nearby things never waver.
FullDistance = 12000.0                 # [1000-60000] Full haze from this distance on.
HorizonBand = 0.25                     # [0.05-1.0] How far above and below the horizon the haze reaches (the sine of the view angle): it lives along the horizon, where the line of sight runs longest through hot air.
NoiseScale = 40.0                      # [5-200] Ripple size: higher makes finer, busier ripples.
Speed = 0.6                            # [0.0-3.0] How fast the ripples rise.
PeakHour = 14.5                        # [10.0-17.0] The hottest hour of the day, when the haze is strongest.
CloudyScale = 0.35                     # [0.0-1.0] Heat in cloudy weather, as a share of a clear day's.

[_Shaders.HeatHaze.Status]
Enabled = false                        # Heat haze: distant ground shimmers in the hot air near the horizon, strongest on clear afternoons, gone at night and in rain or snow.


[_Shaders.VolumetricLight.Main]
Strength = 0.3                         # [0.0-3.0] By day (the Night section has its own values; dawn and dusk blend the two): how much sunlight the lit air adds: shafts of light between the shadows of trees, buildings and rocks, strongest looking towards the sun. First-look value, tune in game.
Darken = 0.4                           # [0.0-1.0] By day: how much the shaded air dims what is behind it. The game's fog lights all the air alike; this lets the shadowed air between the shafts read darker. 0: shafts only ever brighten.
Density = 0.02                         # [0.0-2.0] By day: how thick the air is, per 1000 game units. Higher gives stronger, hazier shafts over a shorter distance.
MaxDistance = 5000.0                   # [500-15000] By day: how far from the eye the shafts are worked out (game units, 4096 to a cell). Beyond the sun's shadow maps the air counts as lit.
Steps = 16                             # [4-48] Day and night: shadow samples per pixel along the view (at half resolution). Fewer is cheaper but coarser (the noise and the smoothing below hide most of it). 16 measured 0.9 ms at 1440p on a GTX 1070.
Temporal = 0.9                         # [0.0-0.95] Day and night: how much of last frame's light each frame keeps. Each frame starts its samples at new points, so keeping the earlier frames adds up to many more samples: smooth shafts with no bands. 0: no carry-over (the noise then has to be blurred away). Lower it if shafts trail behind fast-moving shadows.
BlurRadius = 4.0                       # [0-8] Day and night: how wide the edge-aware smoothing is (in half-resolution pixels each way). It takes out the fine noise that breaks up the bands, and stops at the edges of buildings and trees. 0: no smoothing.
Anisotropy = 0.5                       # [0.0-0.9] By day: forward scattering: higher concentrates the light around the sun and fades it looking away.
RainStrength = 0.5                     # [0.0-1.0] Day and night: share of the strength in rain.
Froxels = false                        # Day and night: work the shafts out on a coarse 3D grid of the air (one column per 16 x 16 pixels, 64 slices deep) instead of along every pixel's view: far fewer shadow reads, no noise, so Steps, Temporal and BlurRadius are not used. Softer shaft edges.

[_Shaders.VolumetricLight.Night]
Strength = 0.09                        # [0.0-3.0] By moonlight: how much light the lit air adds.
Darken = 0.12                          # [0.0-1.0] By night: how much the shaded air dims what is behind it.
Density = 0.02                         # [0.0-2.0] By night: how thick the air is, per 1000 game units.
MaxDistance = 5000.0                   # [500-15000] By night: how far from the eye the shafts are worked out (game units).
Anisotropy = 0.5                       # [0.0-0.9] By night: forward scattering, how much the light gathers round the moon.

[_Shaders.VolumetricLight.Status]
Enabled = true                         # Volumetric light: sun shafts through the air, shaded by the sun's shadow maps. Outdoors only, needs exterior shadows on. Written for this build (idea from Physically-Based-Reloaded).

[_Shaders.Reflections.Main]
GroundSheen = 0.0                      # [0.0-2.0] Outdoors: how much dry ground that faces up (roads, pavements, floors) mirrors what is around it, blurred. Gives streets the sheen that picks up neon and lamps at night. Sand and grass get it too, so keep it low. 0: dry ground reflects nothing.
RainWetness = 1.0                      # [0.0-2.0] Outdoors: how much the rain makes the ground mirror the neon, lamps and sky. Follows the rain (and Wet World's puddles as they dry). Above 1: stronger than real wet asphalt. 0: no rain reflections.
InteriorFloors = 0.0                   # [0.0-2.0] Indoors: how much floors mirror the room, blurred (polished tile, metal decks). 0: none.
Roughness = 0.4                        # [0.02-1.0] How blurred the dry reflections are. 0.02: a mirror; 1: barely a glow.
WetRoughness = 0.08                    # [0.02-1.0] How blurred the wet reflections are. Low: sharp mirrored neon in the puddles.
MaxDistance = 4000.0                   # [200-20000] How far each reflected ray searches, in game units (4096 to a cell). Longer finds farther things, but costs more and may miss thin ones.
Steps = 24                             # [8-64] Samples along each reflected ray (at half resolution). More: steadier, fewer gaps; costs more.
Thickness = 1.0                        # [0.1-10] How thick things count as when a ray passes behind them. Higher fills gaps behind poles and signs, too high reflects things that should be hidden.
Temporal = 0.85                        # [0.0-0.95] How much of last frame's reflection each frame keeps: steadies the noise of blurred reflections. Lower it if reflections trail when turning quickly. 0: none.
BlurRadius = 12.0                      # [0-8] Edge-aware smoothing, in half-resolution pixels each way (wider on rough ground, narrow on wet).
DrawDistance = 8000.0                  # [500-50000] Surfaces farther than this (game units) do not reflect; they fade out before it.
SkyFallback = true                     # Outdoors: a reflected ray that finds nothing on screen takes the sky's colour if it points up into the sky. Off: nothing is reflected there.
CubeMap = true                         # A small live cube of the surroundings, built from what you have seen around you (a little behind, blurred). A reflected ray that finds nothing on screen takes it: ceilings and lamps above you still show in the floor, buildings behind you in the street. Off: only the sky (outdoors) or nothing.
CubeCapture = 0.02                     # [0.02-1.0] How much of the cube each frame's view replaces. Lower: steadier, slower to follow changes (lights switching, turning); higher: quicker, can shimmer.
CubeFade = 0.005                       # [0.0-0.2] How much of what is out of view fades away each frame (0.005: about two seconds to half). Higher forgets places you looked away from sooner.
DebugView = 0                          # [0-3] 1: the reflection alone; 2: where the rays found something (green) and where not (red); 3: the surroundings cube over the whole screen (should look like a blurred copy of the view). 0: normal picture.

[_Shaders.Reflections.Status]
Enabled = false                        # Screen-space reflections on the ground: wet streets mirror the neon and lamps in the rain; optional dry sheen and interior floors. Needs the normals buffer.

[_Shaders.SkyDither.Main]
Strength = 1.0                         # [0.0-4.0] Breaks up the bands in the sky's smooth gradients with a faint, ever-changing noise just before the picture goes to the screen. In steps of the screen's 256 brightness levels: 1 is enough to hide the bands; higher shows as grain.
AtToneMap = true                       # Also where the game rounds the HDR picture to the screen's 256 levels (the tonemap), over the whole picture: the bands are made there, so the noise at the end alone can't remove them. Invisible on textured surfaces.
SkyOnly = true                         # Only where the sky shows. Off: the whole picture (invisible on textured surfaces, can help smooth fog and dark gradients).

[_Shaders.SkyDither.Status]
Enabled = true                         # Sky dither: hides the banding in the sky's gradients. Very cheap.

[_Shaders.VolumetricClouds.Main]
CloudBase = 1500.0                     # [200-8000] Height of the bottom of the cloud layer, in metres (70 game units each).
Thickness = 1800.0                     # [100-6000] How deep the cloud layer is, in metres. Deeper: taller heaped clouds, darker undersides.
CoveragePleasant = 0.4                 # [0-1] How much of the sky the clouds fill in fair weather (the game's weather type decides which of these four applies; weather changes blend between them over about a minute).
CoverageCloudy = 0.7                   # [0-1] The same in cloudy weather.
CoverageRainy = 0.95                   # [0-1] The same in rain: also flatter, greyer clouds.
CoverageSnow = 0.9                     # [0-1] The same in snow.
Density = 1.0                          # [0.05-5] How thick the clouds are: higher is more solid and darker underneath, lower more see-through.
ShapeSize = 9000.0                     # [500-50000] Size of the big cloud shapes, in metres per tile of the shape noise. Larger: bigger, fewer clouds.
DetailSize = 500.0                     # [50-10000] Size of the wisps that wear away the edges, in metres.
Erosion = 0.5                          # [0-1] How much the wisps eat into the cloud edges. 0: smooth round edges.
EdgeSharpness = 2.0                    # [1-8] How quickly a cloud goes from clear air to solid at its edge. 1: soft, hazy outlines; higher: crisp ones.
ShapeSmoothing = 0.0                   # [0-3] Smooths the big cloud shapes (reads the shape noise at a coarser level): fewer small stray puffs, softer outlines.
Turbulence = 1.0                       # [0-2] Twists and stretches the noise the clouds are made of, so they swirl and streak instead of showing rows of round blots. 0: off.
DetailSmoothness = 0.5                 # [0-1] Share of smooth noise in the edge detail (the rest is round billows). Higher: wispier, less lumpy edges.
HalfResolution = false                 # Work the clouds out at half instead of a quarter of the screen size each way: a little more fine detail, roughly 1.5x the cost. Needs a restart.
WeatherSize = 30000.0                  # [2000-200000] Size of the pattern of where clouds form, in metres. Smaller: more, smaller cloud fields.
SunStrength = 1.4                      # [0-10] How bright the sun (or moon) makes the clouds.
AmbientStrength = 0.7                  # [0-10] How much the sky colour lights the clouds from all around (their shaded sides and undersides).
ForwardScattering = 0.6                # [0-0.95] How strongly the clouds glow when you look toward the sun (silver linings).
Steps = 48                             # [8-64] Samples along each view ray. Fewer is faster but grainier.
MaxDistance = 80000.0                  # [5000-200000] How far away clouds are still drawn, in metres.
HazeDistance = 30000.0                 # [1000-200000] Distance, in metres, at which far clouds have mostly thinned out into the sky.
WindSpeed = 1.0                        # [0-20] How fast the clouds drift with the game's wind: 1 is about 15 m/s in calm weather to 60 m/s in a gale (faster than real, so you can see them move).
Evolution = 8.0                        # [0-50] How fast the clouds change shape as they drift, in metres per second.
History = 0.8                          # [0-0.95] How much of the earlier frames each new sample keeps: higher is smoother but slower to react.
Brightness = 1.0                       # [0-5] Overall brightness of the clouds.
HideGameClouds = true                  # Hide the game's own flat cloud layers while these clouds are drawn (they stay in the water's reflection).
GameTime = true                        # UNOFFICIAL: the clouds move by the game's clock: waiting or sleeping moves them on as far as that time would, a pause or a menu stops them, and the same save shows the same sky. Off: they move by the real time on screen, as before.
Shadows = 0.6                          # UNOFFICIAL [0-1]: how much the clouds shade the ground in the sunlight (drifting cloud shadows across the land). 0: no cloud shadows.
ShadowRange = 30000.0                  # UNOFFICIAL [4000-100000]: how far round you the cloud shadows reach, in metres across. Larger reaches farther but each shadow is a little softer.
WaterReflections = 1.0                 # UNOFFICIAL [0-1]: these clouds in the water's reflection, drawn into the game's own reflection where it shows sky (so the water waves and tints them like the rest), in place of the game's flat cloud layers there. 0: the game's clouds in the water, as before.
ShadowDebug = false                    # UNOFFICIAL: shows the cloud shadows alone (white: sunlit, black: shaded by a cloud; walls turned from the sun greyer). For checking only.
ReflectionDebug = 0                    # UNOFFICIAL [0-2]: checking only. 1: in the water reflection, paints red where it looks up into the sky and blue where down (where the clouds would go), behind what the game drew. 2: the same over everything.

[_Shaders.VolumetricClouds.Status]
Enabled = false                        # UNOFFICIAL, EXPERIMENTAL (2026-10-11): real 3D clouds high above the ground, lit by the sun and the sky, moving with the wind and following the weather, in place of the game's flat cloud pictures. About 1 ms at 2560x1440 on a GTX 1070. Exteriors only.

[_Shaders.Bodycam.Main]
Fisheye = 0.45                         # UNOFFICIAL [0-1]: how much the wide lens bends straight lines outward towards the edges. Main = by day; Night and Interiors have their own value of every setting here (all but TextSize).
FitEdges = 0.9                         # [0-1] Zooms in so the bent picture still fills the screen (1: no black corners from the bend; 0: none).
Border = 0.95                          # [0-1] A soft black oval round the picture, like looking through the camera's frame. 0: none.
Fringe = 3.1                           # [0-10] Colour fringes (red and blue apart) towards the edges, in pixels at 1080p.
EdgeBlur = 1.6                         # [0-2] The cheap lens blurs towards the edges.
LensBlur = 0.5                         # [0-2] A mild blur over the whole picture (the cheap lens is never quite in focus). 0 off, 1 about 2.5 pixels at 1080p.
Vignette = 0.75                        # [0-1] Darker corners.
Sharpen = 0.5                          # [0-3] The camera's oversharpening: halos along edges.
Exposure = 0.75                        # [0.5-3] By day: overexposure, brighter than the game, highlights clipping. (Night and Interiors have their own.)
Contrast = 1.25                        # [0.5-2] By day: contrast round mid-grey (harsh above 1).
Saturation = 0.7                       # [0-2] By day: colour, below 1 washed out.
Lift = 0.2                             # [0-1.5] By day: raises the dark tones (as a camera's auto exposure does in the dark); black and white stay.
Cool = 1.0                             # [0-1] By day: takes the yellow out of New Vegas's own colour grade, towards the neutral whites of real footage.
Glow = 0.8                             # [0-2] Bright areas bleed over what is near them.
Grain = 2.0                            # [0-2] Sensor noise, changing 30 times a second, stronger in the dark.
Blocks = 0.2                           # [0-1] Video-compression blocks in dark, flat areas.
MotionBlur = 0.5                       # [0-3] Smear while the view turns. 0: none.
LensDirt = 0.4                         # [0-2] Smudges on the lens that light up in bright light.
Tint = 0.55                            # [0-1] A faint green cast.
Text = 0.0                             # [0-1] The timestamp in the top right (the game's date and clock). 0: none.
TextSize = 4.0                         # [1-12] Size of the timestamp's pixels, at 1080p.
VideoFps = 30                          # [0-60] Video frame rate: each frame is held until the next is due, as recorded footage plays (the game keeps running at full speed underneath). 0: off, every frame drawn.
AutoExposure = 0.8                     # [0-1] The camera's exposure lags behind the light: stepping into the sun blows the picture out before it settles, going indoors it goes dark first. In steady light it changes nothing. 0: off.
ExposureSpeed = 1.5                    # [0.1-10] Seconds the exposure takes to catch up (most of the way in about twice this).
Breakup = 0.1                          # [0-2] The video compression breaks down while the view turns fast or you run: bigger blocks over everything. 0: off.
RollingShutter = 0.1                   # [0-3] Rolling-shutter wobble: upright things lean while the view pans fast, the picture squashes on fast tilts. 0: off.
Bounce = 1.0                           # [0-2] The camera is strapped to the chest: the picture bobs with each step and leans into turns (the picture only: your aim is not moved). 0: off.
GunJolt = 1.0                          # [0-3] Each shot jolts the mount: the picture kicks and springs back. 0: off.
Overload = 1.0                         # [0-2] A muzzle flash overloads the sensor: the frame washes out for a moment, then the exposure dips before settling. 0: off.
LowLight = 0.0                         # [0-1] Low-light mode: nearly black and white, shadows lifted, much more grain (mostly a Night setting). 0: off.
LightSmear = 0.3                       # [0-2] Very bright lights bleed into vertical streaks, as cheap sensors do (stronger with LowLight). 0: off.
Hiccups = 0.3                          # [0-1] Encoder hiccups: now and then a frozen frame or a short burst of broken blocks (more often while moving); higher = more often. 0: off.
Autofocus = 0.8                        # [0-2] Autofocus hunting: when what is in the middle of the picture gets much nearer or further, the picture goes soft and pulls back into focus. 0: off.
WideView = 0.0                         # [0, 60-150] Main only: the world's field of view while Bodycam is on (body cameras see much wider than the game). Eased in and out, left alone while aiming and in menus; your game's own value comes back when Bodycam is off. Only the live value is changed, never your INI. 0: the game's own (try 100).
Mic = 0.0                              # [0-1] Main only: all the game's sound as if picked up by the camera's own cheap microphone (the knobs below), while Bodycam is on. 0: off; 1: all mic.
MicTone = 0.7                          # [0-1] The small mic's band: 0 full range, 1 a tiny phone-like mic (bass and treble cut).
