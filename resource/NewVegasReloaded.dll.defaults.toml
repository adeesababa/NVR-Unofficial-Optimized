[_Main.Develop.Main]
DebugMode = false       # Enables debug features like capture shaders and print shadowmaps.
DebugVar1 = 0.0         # Custom variable used when developing shaders.
DebugVar2 = 0.0         # Custom variable used when developing shaders.
DebugVar3 = 0.0         # Custom variable used when developing shaders.
DebugVar4 = 0.0         # Custom variable used when developing shaders.
TraceShaders = 25       # Keyboard shortcut to print used shaders list to the log.

[_Main.Transitions.Main]
TransitionCurvePower = 1.0             # Day/night transition curve exponent. 1.0 = current smoothstep behavior. Higher values sharpen the transition; lower values soften it.

[_Main.FlyCam.Main]
Enabled = true
KeyAdd = 78
KeySubtract = 74
ScrollMultiplier = 2.0
StepValue = 1.0

[_Main.GunFX.Main]
Puff = false                            # GunFX (experimental, needs GunFX.dll): a small puff of smoke at the muzzle on every shot. Fine-tune everything in Data\NVSE\Plugins\GunFX.ini.
HeatSmoke = false                       # GunFX: a thin strand of smoke rising from the barrel once it is hot from sustained fire; it tapers off as the gun cools.
AfterFireTrail = false                  # GunFX: a thin, wispy trail rising from the barrel only after you stop firing (like a cigarette); fades as the barrel cools, stops when you fire again.
VolumetricSmoke = false                 # GunFX (prototype): draw the smoke (heat smoke, after-fire trail, muzzle puff, ejection smoke) as continuous volumetric smoke (lit, soft, unbroken while moving) instead of particles. Each smoke's own switch still applies; tuning in [Volume] in GunFX.ini.
VolumetricSmokeHalfRes = true           # GunFX: draw the volumetric smoke at half resolution (a quarter of the pixels; much cheaper, the smoke is soft). Off = full resolution.
VolumetricSmokeLowRes = true# GunFX: draw big, close volumetric smoke (pieces covering more than 1% of the screen, as when you walk into smoke) at an eighth of the resolution. Much cheaper in thick smoke; looks the same.
SmokeHaze = true                       # GunFX: the gun-smoke haze that slowly fills a room as you keep firing (with VolumetricSmoke). The most expensive part of GunFX: off skips its whole-screen pass. Applies immediately.
BulletTunnels = true                   # GunFX: bullets punch tunnels through the smoke and haze in front of you, which then fill back in. Off skips the pass that cuts them. Applies immediately.
VolumetricSmokeTest = 0                 # GunFX, for finding faults: 0 normal; 1 the volumetric smoke in plain green (shows exactly where it is drawn); 2 no muzzle flash light on it; 3 smoke worked out but not drawn; 4 nothing drawn at all. Leave on 0.
EjectionSmoke = false                   # GunFX: a burst of smoke from the ejection port with every casing, bigger when the barrel is hot.
BarrelGlow = false                      # GunFX: the barrel glows after sustained fire and cools down slowly.
HeatHaze = false                        # GunFX: heat shimmer around a hot barrel (screen effect).
MuzzleBlast = false                     # GunFX: a quick, wide ripple of heat shimmer at the muzzle on every shot, whatever the barrel heat.
EnergyWeapons = false                   # GunFX on energy weapons too (lasers, plasma and the like, including modded ones: decided by the weapon's Energy Weapons skill). Off = no GunFX effects on them.

